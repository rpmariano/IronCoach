<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <radialGradient id="animBg_gc" cx="50%" cy="34%" r="75%">
      <stop offset="0%" stop-color="#161f28" stop-opacity="0.95"/>
      <stop offset="55%" stop-color="#0b1120" stop-opacity="1"/>
      <stop offset="100%" stop-color="#020611" stop-opacity="1"/>
    </radialGradient>

    <!-- Chevron 1: Ouro de Prova -->
    <linearGradient id="animC1_gc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="50%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <!-- Chevron 2: Ciano da Carol -->
    <linearGradient id="animC2_gc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a5f3fc"/>
      <stop offset="45%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#0891b2"/>
    </linearGradient>

    <!-- Titanium Frame Stroke -->
    <linearGradient id="animTi_gc" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="animGlow_gc" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="9" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      @keyframes chevronCadence1 {
        0%, 100% {
          transform: translateX(0px);
          filter: drop-shadow(0 0 6px rgba(251, 191, 36, 0.4));
        }
        50% {
          transform: translateX(-4px);
          filter: drop-shadow(0 0 16px rgba(251, 191, 36, 0.85));
        }
      }

      @keyframes chevronCadence2 {
        0%, 100% {
          transform: translateX(0px);
          filter: drop-shadow(0 0 8px rgba(34, 211, 238, 0.4));
        }
        50% {
          transform: translateX(5px);
          filter: drop-shadow(0 0 20px rgba(34, 211, 238, 0.95));
        }
      }

      @keyframes auraEngine {
        0%, 100% {
          opacity: 0.18;
          stroke: #22d3ee;
        }
        50% {
          opacity: 0.42;
          stroke: #fbbf24;
        }
      }

      @keyframes innerBorderShine {
        0%, 100% {
          stroke-opacity: 0.45;
          stroke-width: 2;
        }
        50% {
          stroke-opacity: 0.9;
          stroke-width: 2.8;
        }
      }

      @keyframes coachPulse {
        0%, 100% {
          filter: drop-shadow(0 0 0px transparent);
        }
        50% {
          filter: drop-shadow(0 0 12px rgba(34, 211, 238, 0.75));
        }
      }

      @keyframes aiPoweredBreath {
        0%, 100% {
          opacity: 0.85;
          letter-spacing: 10px;
        }
        50% {
          opacity: 1;
          letter-spacing: 11.5px;
          filter: drop-shadow(0 0 8px rgba(251, 191, 36, 0.8));
        }
      }

      .c1-animated {
        animation: chevronCadence1 2.2s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite;
      }
      .c2-animated {
        animation: chevronCadence2 2.2s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite;
      }
      .aura-animated {
        animation: auraEngine 3.4s ease-in-out infinite;
      }
      .inner-border-animated {
        animation: innerBorderShine 2.2s ease-in-out infinite;
      }
      .coach-word-animated {
        animation: coachPulse 2.2s ease-in-out infinite;
      }
      .ai-text-animated {
        animation: aiPoweredBreath 3.4s ease-in-out infinite;
      }
      /* Movimento reduzido: parado, como a variante estática. */
      @media (prefers-reduced-motion: reduce) {
        .c1-animated, .c2-animated, .aura-animated, .inner-border-animated, .coach-word-animated, .ai-text-animated { animation: none; }
      }
    </style>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="600" rx="24" fill="url(#animBg_gc)"/>

  <!-- Speed Track Ambient Lines -->
  <g opacity="0.04" stroke="#ffffff" stroke-width="1.5">
    <line x1="80" y1="210" x2="720" y2="210" />
    <line x1="120" y1="155" x2="680" y2="155" />
    <line x1="120" y1="265" x2="680" y2="265" />
  </g>

  <!-- Main Insignia Group -->
  <g transform="translate(400, 208)">
    <!-- Ambient Neon Outer Shield Aura (Animado) -->
    <polygon class="aura-animated"
             points="0,-115 100,-58 100,58 0,115 -100,58 -100,-58" 
             fill="none" stroke="#22d3ee" stroke-width="15" stroke-linejoin="round"
             filter="url(#animGlow_gc)"/>

    <!-- Dark Titanium Hexagonal Shield -->
    <polygon points="0,-115 100,-58 100,58 0,115 -100,58 -100,-58" 
             fill="#080e1a" stroke="url(#animTi_gc)" stroke-width="5" 
             stroke-linejoin="round"/>

    <!-- Inner Neon Accent Perimeter (Animado) -->
    <polygon class="inner-border-animated"
             points="0,-104 88,-50 88,50 0,104 -88,50 -88,-50" 
             fill="none" stroke="#fbbf24" stroke-linejoin="round"/>

    <!-- CHEVRON 1: Ouro de Prova (Animado) -->
    <g class="c1-animated">
      <path d="M -56,-52 L -12,0 L -56,52 L -32,52 L 12,0 L -32,-52 Z" 
            fill="none" stroke="url(#animC1_gc)" stroke-width="6" stroke-linejoin="round"
            filter="url(#animGlow_gc)" opacity="0.45"/>
      <path d="M -56,-52 L -12,0 L -56,52 L -32,52 L 12,0 L -32,-52 Z" 
            fill="url(#animC1_gc)" stroke="#f59e0b" stroke-width="1.5" stroke-linejoin="round"/>
    </g>

    <!-- CHEVRON 2: Ciano da Carol (Animado) -->
    <g class="c2-animated">
      <path d="M -12,-52 L 32,0 L -12,52 L 12,52 L 56,0 L 12,-52 Z" 
            fill="none" stroke="url(#animC2_gc)" stroke-width="6" stroke-linejoin="round"
            filter="url(#animGlow_gc)" opacity="0.45"/>
      <path d="M -12,-52 L 32,0 L -12,52 L 12,52 L 56,0 L 12,-52 Z" 
            fill="url(#animC2_gc)" stroke="#38bdf8" stroke-width="1.5" stroke-linejoin="round"/>
    </g>
  </g>

  <!-- Typography: IRON (Branco) + COACH (Ciano Carol com pulso luminoso) -->
  <text x="400" y="420" 
        text-anchor="middle" 
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" 
        font-size="46" 
        font-weight="900" 
        letter-spacing="6" 
        fill="#f8fafc">
    IRON<tspan class="coach-word-animated" fill="url(#animC2_gc)">COACH</tspan>
  </text>

  <!-- Subtitle: AI-POWERED com respiração néon -->
  <text x="400" y="468" 
        text-anchor="middle" 
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
        font-size="14.5" 
        font-weight="800" 
        fill="#fbbf24"
        class="ai-text-animated">
    AI-POWERED
  </text>
</svg>