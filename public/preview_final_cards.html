<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cartões Finais (Colapsados)</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: ui-sans-serif, system-ui, sans-serif; }
  body { background: #eaeef4; color: #0f172a; padding: 40px 20px; }
  .header { text-align: center; margin-bottom: 40px; }
  h1 { font-size: 2rem; font-weight: 800; color: #0f172a; margin-bottom: 8px; }
  p.subtitle { color: #516071; font-size: 1.1rem; }

  .grid { display: flex; flex-direction: column; gap: 48px; max-width: 700px; margin: 0 auto; }
  .section-title { font-size: 0.75rem; font-weight: 800; color: #516071; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 16px; }

  /* ======== TIMELINE CARD (NUTRIÇÃO COLAPSADO) ======== */
  .timeline-container { position: relative; padding-left: 20px; }
  .v1-tl { border-left: 2px solid rgba(62,107,130,0.15); padding-left: 24px; position: relative; margin-bottom: 24px; }
  .v1-node { position: absolute; left: -7px; top: 20px; width: 12px; height: 12px; border-radius: 50%; background: #ec8871; box-shadow: 0 0 10px #ec8871; animation: pulseV1 2s infinite alternate; }
  @keyframes pulseV1 { from { opacity: 0.7; transform: scale(1); } to { opacity: 1; transform: scale(1.15); } }
  .v1-card {
    background: rgba(255,255,255,0.6); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    border: 1px solid rgba(255,255,255,0.9); border-radius: 24px; padding: 12px 20px;
    box-shadow: 0 10px 30px -5px rgba(0,0,0,0.05); transition: transform 0.3s;
    display: flex; flex-direction: row; align-items: center; justify-content: space-between; cursor: pointer;
  }
  .v1-card:hover { transform: translateX(4px); }
  .v1-main { display: flex; gap: 16px; align-items: center; }
  .food-img { width: 54px; height: 54px; border-radius: 12px; background: url('https://images.unsplash.com/photo-1512621776951-a57141f2eefd?w=200&q=80') center/cover; }
  .v1-info h3 { font-size: 1.05rem; color: #0f172a; margin-bottom: 0; }
  .v1-collapsed-right { display: flex; align-items: center; gap: 12px; }

  /* ======== RUNNING CARD (COM MAGIA E PÍLULAS DE TEMPO/RITMO) ======== */
  .running-card-wrapper { position: relative; z-index: 1; width: 100%; max-width: 700px; border-radius: 99px; background: transparent; cursor: pointer; }
  .running-card-wrapper::before {
    content: ''; position: absolute; inset: -2px; border-radius: 100px; z-index: -1;
    background: linear-gradient(90deg, #e11d48, #9333ea, #e11d48); background-size: 200% auto;
    opacity: 0.15; transition: opacity 0.3s; animation: glowBorder 3s linear infinite;
  }
  .running-card-wrapper:hover::before { opacity: 0.5; }
  @keyframes glowBorder { 0% { background-position: 0% center; } 100% { background-position: 200% center; } }
  
  .running-card {
    background: rgba(255,255,255,0.75); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
    border: 1px solid rgba(255,255,255,0.9); border-radius: 99px; padding: 12px 20px 12px 12px;
    box-shadow: 0 8px 20px -5px rgba(0,0,0,0.05); display: flex; align-items: center; gap: 16px;
  }
  .rc-icon-wrap {
    width: 54px; height: 54px; border-radius: 50%; background: #ffe4e6; color: #e11d48;
    display: flex; align-items: center; justify-content: center; box-shadow: 0 0 15px rgba(225,29,72,0.2); flex-shrink: 0;
  }
  .rc-content { flex: 1; display: flex; flex-direction: column; justify-content: center; }
  .rc-top { display: flex; align-items: center; gap: 8px; }
  .rc-title { font-size: 1.05rem; font-weight: 800; color: #0f172a; }
  .rc-tag { background: rgba(147,51,234,0.1); color: #9333ea; font-size: 0.7rem; font-weight: 800; padding: 2px 8px; border-radius: 8px; }
  .rc-date { font-size: 0.8rem; color: #516071; margin-top: 2px; display: flex; align-items: center; gap: 8px; }
  .rc-photos { display: flex; align-items: center; font-size: 0.75rem; color: #516071; font-weight: 600; }
  .rc-right { display: flex; align-items: center; gap: 16px; }
  
  .rc-pill {
    background: rgba(255,255,255,0.5); border: 1px solid rgba(255,255,255,0.8);
    border-radius: 12px; padding: 6px 12px; display: flex; flex-direction: column; align-items: center;
    box-shadow: inset 0 1px 1px rgba(255,255,255,1);
  }
  .rc-pill-lbl { font-size: 0.6rem; font-weight: 800; color: #516071; text-transform: uppercase; }
  .rc-pill-val { font-size: 0.85rem; font-weight: 900; color: #0f172a; }
  
  .rc-dist { font-size: 1.25rem; font-weight: 900; color: #e11d48; }

</style>
</head>
<body>

<div class="header">
  <h1>Visualização Final (Colapsados)</h1>
  <p class="subtitle">Estado compactado do Cartão de Corrida e Cartão de Nutrição</p>
</div>

<div class="grid">
  
  <!-- CORRIDA FINAL -->
  <div>
    <div class="section-title">CORRIDA (COM BORDAS MÁGICAS + PÍLULAS)</div>
    <div class="running-card-wrapper">
      <div class="running-card">
        <div class="rc-icon-wrap">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="currentColor">
            <path d="M4 16v-2.38C4 11.5 5.86 10 8 10h1.5l1.83-2.75a2 2 0 0 1 1.66-.88H16a2 2 0 0 1 2 2v2h2a2 2 0 0 1 2 2v4a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2z"/>
            <path d="M2 16h20M6 12l-2 4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
        </div>
        
        <div class="rc-content">
          <div class="rc-top">
            <span class="rc-title">Treino da tarde</span>
            <span class="rc-tag">Contínuo</span>
          </div>
          <div class="rc-date">
            <span>30 jul 2026</span>
            <span class="rc-photos">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="margin-right: 4px;">
                <rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/>
              </svg>
              2
            </span>
          </div>
        </div>

        <div class="rc-right">
          <div class="rc-pill">
            <span class="rc-pill-lbl">Tempo</span>
            <span class="rc-pill-val">1h 05m</span>
          </div>
          <div class="rc-pill">
            <span class="rc-pill-lbl">Ritmo</span>
            <span class="rc-pill-val">5'45"</span>
          </div>
          <span class="rc-dist">11.32 km</span>
          <svg width="20" height="20" color="#516071" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M6 9l6 6 6-6"/>
          </svg>
        </div>
      </div>
    </div>
  </div>

  <!-- NUTRIÇÃO FINAL -->
  <div>
    <div class="section-title">NUTRIÇÃO (CARTÃO TIMELINE COLAPSADO)</div>
    <div class="timeline-container v1-tl">
      <div class="v1-node"></div>
      <div class="v1-card">
        <div class="v1-main">
          <div class="food-img"></div>
          <div class="v1-info">
            <h3>Aveia e Frutas</h3>
          </div>
        </div>
        <div class="v1-collapsed-right">
          <div style="font-size: 1rem; font-weight: 900; color: #ec8871;">345 kcal</div>
          <svg width="20" height="20" color="#516071" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M6 9l6 6 6-6"/>
          </svg>
        </div>
      </div>
    </div>
  </div>

</div>

</body>
</html>
