<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cenas da Carol</title>
<style>
  :root { --dur: 2s; --bg: #f6f3ef; --ink: #3b2a20; --card: #fff; }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 16px; font: 15px/1.4 system-ui, sans-serif; background: var(--bg); color: var(--ink); }
  h1 { font-size: 18px; margin: 0 0 4px; }
  p { margin: 0 0 16px; color: #6b5a4e; }
  .barra { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-bottom: 16px; }
  button { font: inherit; padding: 8px 16px; border-radius: 999px; border: 0; background: var(--ink); color: #fff; cursor: pointer; }
  label { display: flex; gap: 6px; align-items: center; }
  .lado { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; max-width: 760px; }
  figure { margin: 0; background: var(--card); border-radius: 16px; padding: 12px; }
  figcaption { font-weight: 600; margin-bottom: 8px; }
  figcaption small { display: block; font-weight: 400; color: #6b5a4e; }
  .palco { position: relative; aspect-ratio: 600 / 804; border-radius: 12px; overflow: hidden; background: #fbf9f6; }
  .palco > svg, .palco > img { position: absolute; inset: 0; width: 100%; height: 100%; }

  /* O contrato das duas: cada caminho tem pathLength="1" e --i (a ordem). */
  .anima path { stroke-dasharray: 1; stroke-dashoffset: 1; animation: desenha var(--seg) ease-out forwards; animation-delay: calc(var(--i) * var(--passo)); }
  @keyframes desenha { to { stroke-dashoffset: 0; } }

  /* Opção 2: o traço, e no fim (se pedido) a imagem aparece por baixo. */
  #traco svg { color: var(--ink); }
  #traco img { opacity: 0; }
  #traco.com-imagem.anima img { animation: aparece .5s ease-out forwards; animation-delay: calc(var(--dur) - .3s); }
  #traco.com-imagem.anima svg { animation: some .5s ease-out forwards; animation-delay: calc(var(--dur) - .1s); }
  @keyframes aparece { to { opacity: 1; } }
  @keyframes some { to { opacity: 0; } }
</style>
</head>
<body>
<h1>Cenas da Carol: corrida</h1>
<p>As duas animações de «a Carol está a analisar», lado a lado, com a duração final (~2 s).</p>
<div class="barra">
  <button id="repetir" type="button">Repetir</button>
  <label><input type="checkbox" id="acabar" checked> Opção 2 acaba na imagem</label>
</div>
<div class="lado">
  <figure>
    <figcaption>Opção 1: máscara<small>corrida-mascara.svg revela corrida.webp</small></figcaption>
    <div class="palco" id="mascara"></div>
  </figure>
  <figure>
    <figcaption>Opção 2: traço<small>corrida-traco.svg, desenhado à mão</small></figcaption>
    <div class="palco com-imagem" id="traco"><img src="corrida.webp" alt=""></div>
  </figure>
</div>
<script>
  const DUR = 2; // segundos, do primeiro traço ao último acabado
  const SEG = 0.6; // quanto demora cada traço

  function ritmo(el) {
    const max = Math.max(...[...el.querySelectorAll('path')].map((p) => Number(p.style.getPropertyValue('--i')) || 0), 1);
    el.style.setProperty('--seg', `${SEG}s`);
    el.style.setProperty('--passo', `${(DUR - SEG) / max}s`);
  }

  async function carregar() {
    const [mascara, traco] = await Promise.all(['corrida-mascara.svg', 'corrida-traco.svg'].map((f) => fetch(f).then((r) => r.text())));

    // Opção 1: a máscara entra num <mask> e a imagem fica por baixo dela.
    const m = new DOMParser().parseFromString(mascara, 'image/svg+xml').documentElement;
    const caminhos = [...m.querySelectorAll('path')].map((p) => p.outerHTML).join('');
    document.getElementById('mascara').innerHTML = `
      <svg viewBox="0 0 600 804" preserveAspectRatio="xMidYMid slice">
        <mask id="revela" maskUnits="userSpaceOnUse" x="0" y="0" width="600" height="804">
          <g fill="none" stroke="#fff" stroke-linecap="round" stroke-linejoin="round">${caminhos}</g>
        </mask>
        <image href="corrida.webp" width="600" height="804" mask="url(#revela)"/>
      </svg>`;

    // Opção 2: o traço por cima da imagem (escondida até ao fim).
    document.getElementById('traco').insertAdjacentHTML('beforeend', traco);
    repetir();
  }

  function repetir() {
    document.getElementById('traco').classList.toggle('com-imagem', document.getElementById('acabar').checked);
    for (const id of ['mascara', 'traco']) {
      const el = document.getElementById(id);
      const alvo = id === 'mascara' ? el.querySelector('mask') : el.querySelector('svg:last-of-type');
      ritmo(alvo);
      el.classList.remove('anima');
      if (alvo !== el) alvo.classList.remove('anima');
      void el.offsetWidth; // reinicia as animações
      el.classList.add('anima');
      if (alvo !== el) alvo.classList.add('anima');
    }
  }

  document.getElementById('repetir').addEventListener('click', repetir);
  document.getElementById('acabar').addEventListener('change', repetir);
  carregar();
</script>
</body>
</html>
