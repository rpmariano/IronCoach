<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f04a3e" />
      <stop offset="100%" stop-color="#b82d23" />
    </linearGradient>
    <linearGradient id="darkGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a1a1a" />
      <stop offset="100%" stop-color="#0a0a0a" />
    </linearGradient>
    <radialGradient id="goldSphere" cx="40%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#f8e5c8" />
      <stop offset="40%" stop-color="#d4b17b" />
      <stop offset="85%" stop-color="#9e7542" />
      <stop offset="100%" stop-color="#6e4f27" />
    </radialGradient>
    <filter id="shadowRed" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000" flood-opacity="0.3" />
    </filter>
    <filter id="shadowSphere" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="5" stdDeviation="3.5" flood-color="#000" flood-opacity="0.85" />
    </filter>
    <filter id="innerShadowDark">
      <feOffset dx="0" dy="4"/>
      <feGaussianBlur stdDeviation="4" result="offset-blur"/>
      <feComposite operator="out" in="SourceGraphic" in2="offset-blur" result="inverse"/>
      <feFlood flood-color="black" flood-opacity="0.9" result="color"/>
      <feComposite operator="in" in="color" in2="inverse" result="shadow"/>
      <feComposite operator="over" in="shadow" in2="SourceGraphic"/>
    </filter>
  </defs>

  <!-- Sem fundo: esta e a fonte usada tambem dentro da propria app (logo.png
       no cabecalho/login), sobre o fundo claro da UI — um retangulo opaco
       aqui ficava pesado e deslocado nesse contexto. O fundo opaco exigido
       pelo iOS (apple-touch-icon) e pela variante "maskable" e aplicado à
       parte, só nesses dois ficheiros derivados, nao na fonte. -->

  <!-- Grupo escalado a 0.92: o circulo (r=85) e a capsula (alcance vertical
       85 a partir do centro) tocavam quase na borda do canvas (85% do meio-
       canvas, só 7.5% de margem). A 0.92 ficam a ~78%, dentro da zona de
       seguranca de mascaras adaptativas Android sem alterar o desenho. -->
  <g transform="translate(100,100) scale(0.92) translate(-100,-100)">
    <circle cx="100" cy="100" r="85" fill="url(#redGrad)" filter="url(#shadowRed)" />
    <rect x="52" y="15" width="96" height="170" rx="48" ry="48" fill="url(#darkGrad)" filter="url(#innerShadowDark)" />
    <rect x="52" y="15" width="96" height="170" rx="48" ry="48" fill="none" stroke="#000" stroke-width="4" opacity="0.6" />
    <circle cx="100" cy="45" r="16" fill="url(#goldSphere)" filter="url(#shadowSphere)" />
    <circle cx="100" cy="112" r="30" fill="url(#goldSphere)" filter="url(#shadowSphere)" />
  </g>
</svg>
