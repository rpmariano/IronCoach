<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fbf8f2"/>
      <stop offset="100%" stop-color="#ece6d8"/>
    </linearGradient>
    <radialGradient id="glow" cx="30%" cy="20%" r="75%">
      <stop offset="0%" stop-color="#ec8871" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#ec8871" stop-opacity="0"/>
    </radialGradient>
    <!-- Anel coral: gradiente radial para 3D -->
    <radialGradient id="coralRing" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#f5a89a"/>
      <stop offset="40%" stop-color="#ec8871"/>
      <stop offset="100%" stop-color="#c65847"/>
    </radialGradient>
    <!-- Anel azul: gradiente radial para 3D -->
    <radialGradient id="blueRing" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#8ec1d4"/>
      <stop offset="40%" stop-color="#5a8fa3"/>
      <stop offset="100%" stop-color="#1f3a47"/>
    </radialGradient>
    <!-- Knob/nó dourado -->
    <radialGradient id="goldKnob" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#fef5e1"/>
      <stop offset="50%" stop-color="#eccea4"/>
      <stop offset="100%" stop-color="#b59757"/>
    </radialGradient>
    <!-- Linha de pulso dourada -->
    <linearGradient id="goldPulse" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#dcc084"/>
      <stop offset="50%" stop-color="#f5ddb8"/>
      <stop offset="100%" stop-color="#c9a860"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="100" height="100" rx="24" fill="url(#bg)"/>
  <rect x="0" y="0" width="100" height="100" rx="24" fill="url(#glow)"/>

  <!-- Anel coral (esquerda, mais perto da frente) -->
  <circle cx="36" cy="52" r="25" fill="none" stroke="url(#coralRing)" stroke-width="12" opacity="0.95"/>
  <!-- Sombra interior do anel coral -->
  <circle cx="36" cy="52" r="25" fill="none" stroke="rgba(0,0,0,0.08)" stroke-width="2" stroke-dasharray="2,3" opacity="0.6"/>

  <!-- Anel azul (direita, ligeiramente atrás) -->
  <circle cx="64" cy="52" r="25" fill="none" stroke="url(#blueRing)" stroke-width="12" opacity="0.95"/>
  <!-- Sombra interior do anel azul -->
  <circle cx="64" cy="52" r="25" fill="none" stroke="rgba(0,0,0,0.08)" stroke-width="2" stroke-dasharray="2,3" opacity="0.6"/>

  <!-- Linha de pulso/ECG dourada (passa pelos anéis) -->
  <path d="M15 56 H28 L33 43 L40 65 L47 38 L54 65 L61 45 L72 56 H85"
        fill="none" stroke="url(#goldPulse)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>

  <!-- Knob/botão dourado no topo (como "nó" ou ponto de articulação) -->
  <circle cx="50" cy="24" r="8.5" fill="url(#goldKnob)" filter="drop-shadow(0 2px 3px rgba(0,0,0,0.15))"/>
  <!-- Highlight no knob para mais dimensão -->
  <circle cx="48" cy="22" r="3" fill="rgba(255,255,255,0.5)"/>
</svg>
