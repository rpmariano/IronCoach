// 'alert' (alguma métrica afastou-se do objetivo/sentido saudável face à
// avaliação anterior — mesma cor vermelha já usada nos deltas do Corpo, ver
// deltaTrendClass), 'has' (há avaliação sem alerta), 'none' (sem registo).
function dayBodyStatus(dateIso){
  const dayAssessments = bodyAssessments.filter(a => a.date === dateIso);
  if (dayAssessments.length === 0) return 'none';
  const worsened = dayAssessments.some(a => bodyAssessmentWorsenedMetrics(a).length > 0);
  return worsened ? 'alert' : 'has';
}

// Métricas que pioraram nesta avaliação face à anterior (mesmo critério de
// deltaTrendClass: com objetivo definido, afastar-se dele; sem objetivo, ir
// no sentido oposto ao saudável de BODY_METRICS.good).
function bodyAssessmentWorsenedMetrics(a){
  const prev = previousAssessment(a);
  if (!prev) return [];
  return BODY_METRICS.filter(m => {
    const latest = a[m.key], prevVal = prev[m.key];
    if (latest === null || latest === undefined || prevVal === null || prevVal === undefined) return false;
    return deltaTrendClass(m, prevVal, latest) === 'text-red-400';
  }).map(m => ({ m, prevVal: prev[m.key], latest: a[m.key] }));
}

// Realça o módulo ativo na barra fixa do fundo (Início/Nutrição/Corpo/Coach).
// Registar/Perfil são sub-ecrãs da Nutrição; o Perfil é um atalho global e não
// deve realçar nenhum módulo (senão parecia que "Nutrição" está selecionada).
function setActiveVerticalBar(){
  const bar = document.getElementById('verticalStrip');
  if (!bar) return;
  const perfilOpen = activeVertical === 'nutricao' && activeTab === 'perfil';
  bar.querySelectorAll('.vbar-btn').forEach(btn => {
    btn.classList.toggle('active', !perfilOpen && btn.dataset.vert === activeVertical);
  });
}

// Chave que identifica o ecrã atualmente visível (não cada render, que
// acontece várias vezes por ecrã por causa de atualizações de estado).
// Usada para só ajustar o scroll quando o utilizador realmente muda de
// ecrã, e não sempre que algo dentro do mesmo ecrã é atualizado.
function currentScreenKey(){
  if (!currentUser) return 'auth';
  if (showAdminPanel) return 'admin';
  if (dataLoading) return 'loading';
  if (activeVertical === 'nutricao') return `nutricao:${activeTab}`;
  if (activeVertical === 'corpo') return `corpo:${bodyTab}`;
  if (activeVertical === 'ginasio') return `ginasio:${gymTab}`;
  if (activeVertical === 'corrida') return `corrida:${corridaTab}`;
  return activeVertical;
}

let lastScreenKey = null;

// Ao mudar de ecrã: o Coach fica sempre no fim da conversa (já tratado no
// render do Coach), todos os outros ecrãs arrancam no topo — sem isto, o
// scroll herdava a posição do ecrã anterior dentro do mesmo container.
function applyScreenEntryScroll(){
  const key = currentScreenKey();
  if (key === lastScreenKey) return;
  lastScreenKey = key;
  if (activeVertical === 'coach') {
    scrollCoachToBottom();
    // Chamado de forma síncrona (sem requestAnimationFrame) para preservar o
    // gesto do utilizador que despoletou a navegação — em vários browsers
    // móveis o teclado só abre com foco programático se ainda estiver dentro
    // do mesmo "user gesture" que originou o clique.
    const input = document.getElementById('coachInputEl');
    if (input) input.focus();
  } else {
    const main = document.getElementById('tab-content');
    if (main) main.scrollTop = 0;
    window.scrollTo(0, 0);
  }
}

function render(){
  renderScreen();
  applyScreenEntryScroll();
}

function renderScreen(){
  const nav = document.getElementById('bottomNav');
  const headerActions = document.getElementById('headerActions');
  const verticalStrip = document.getElementById('verticalStrip');
  const main = document.getElementById('tab-content');
  document.getElementById('header-date').textContent = formatDatePT(todayISO());

  if (!currentUser) {
    nav.classList.add('hidden');
    verticalStrip.classList.add('hidden');
    headerActions.innerHTML = '';
    main.innerHTML = renderAuth();
    if (window.lucide) lucide.createIcons();
    return;
  }

  if (showAdminPanel) {
    nav.classList.add('hidden');
    verticalStrip.classList.add('hidden');
    headerActions.innerHTML = `
      <button onclick="closeAdminPanel()"
        class="flex items-center gap-1 bg-neutral-800 text-slate-200 text-xs font-bold pl-2.5 pr-3 py-1.5 rounded-full active:scale-95 transition">
        <i data-lucide="x" class="w-3.5 h-3.5"></i> Fechar
      </button>
    `;
    main.classList.remove('overflow-hidden', 'pb-28', 'flex', 'flex-col');
    main.classList.add('overflow-y-auto', 'pb-28');
    main.innerHTML = renderAdminPanel();
    if (window.lucide) lucide.createIcons();
    return;
  }

  verticalStrip.classList.remove('hidden');

  const showPerfilShortcut = !(activeVertical === 'nutricao' && activeTab === 'perfil');
  headerActions.innerHTML = `
    ${showPerfilShortcut ? `
      <button onclick="goToPerfil()"
        class="tap-h-44 flex items-center gap-1 bg-[var(--chrome)] text-neutral-950 text-xs font-bold pl-3.5 pr-4 rounded-full active:scale-95 transition">
        <i data-lucide="user" class="w-3.5 h-3.5"></i> Perfil
      </button>
    ` : ''}
  `;

  if (dataLoading) {
    nav.classList.add('hidden');
    verticalStrip.classList.add('hidden');
    main.innerHTML = `<div class="flex items-center justify-center h-[60vh] text-slate-500 text-xs gap-2"><i data-lucide="loader-2" class="w-4 h-4 animate-spin"></i> A carregar dados...</div>`;
    if (window.lucide) lucide.createIcons();
    return;
  }

  // Realça o módulo ativo na barra fixa do fundo.
  setActiveVerticalBar();

  if (activeVertical !== 'nutricao') {
    if (activeVertical === 'coach') {
      nav.classList.add('hidden');
      // Layout especial: o main torna-se um flex column sem scroll próprio
      // para que a lista de mensagens e o input partilhem a altura disponível.
      main.classList.remove('overflow-y-auto', 'pb-28');
      main.classList.add('overflow-hidden', 'pb-28', 'flex', 'flex-col');
      main.innerHTML = renderCoach();
      if (window.lucide) lucide.createIcons();
      scrollCoachToBottom();
      return;
    }
    if (activeVertical === 'ginasio') {
      // Mesma lógica da Nutrição/Corpo: nav próprio (Dashboard/Calendário)
      // sempre visível; Registar é acedido a partir do Calendário/FAB, nunca
      // pelo nav, mas mantém o nav visível com "Calendário" em destaque.
      nav.classList.remove('hidden');
      nav.innerHTML = GYM_NAV_HTML;
      main.classList.remove('overflow-hidden', 'pb-28', 'flex', 'flex-col');
      main.classList.add('overflow-y-auto', 'pb-28');
      const navHighlight = gymTab === 'registar' ? 'calendario' : gymTab;
      nav.classList.toggle('nav-elsewhere', gymTab === 'registar');
      document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.tab === navHighlight);
      });
      if (gymTab === 'registar') closeFab();

      if (gymTab === 'dashboard') main.innerHTML = renderGymDashboard();
      else if (gymTab === 'registar') main.innerHTML = renderGymRegistar();
      else if (gymTab === 'calendario') main.innerHTML = renderGymCalendario();

      if (window.lucide) lucide.createIcons();
      if (gymTab === 'dashboard') requestAnimationFrame(renderGymCharts);
      return;
    }
    if (activeVertical === 'corpo') {
      // Mesma lógica da Nutrição: nav próprio (Dashboard/Calendário) sempre
      // visível; Avaliar é acedido a partir do Calendário/FAB, nunca pelo nav,
      // mas mantém o nav visível com "Calendário" em destaque (tal como
      // Registar faz na Nutrição) em vez de o esconder.
      nav.classList.remove('hidden');
      nav.innerHTML = CORPO_NAV_HTML;
      main.classList.remove('overflow-hidden', 'pb-28', 'flex', 'flex-col');
      main.classList.add('overflow-y-auto', 'pb-28');
      const navHighlight = bodyTab === 'avaliar' ? 'calendario' : bodyTab;
      nav.classList.toggle('nav-elsewhere', bodyTab === 'avaliar');
      document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.tab === navHighlight);
      });
      // Já estamos no ecrã de criação — fecha o menu do "+" se estiver aberto.
      if (bodyTab === 'avaliar') closeFab();

      if (bodyTab === 'dashboard') main.innerHTML = renderBodyDashboard();
      else if (bodyTab === 'avaliar') main.innerHTML = renderBodyAvaliar();
      else if (bodyTab === 'calendario') main.innerHTML = renderBodyCalendario();

      if (window.lucide) lucide.createIcons();
      if (bodyTab === 'dashboard') requestAnimationFrame(renderBodyChart);
      return;
    }
    if (activeVertical === 'corrida') {
      // Mesma lógica de Ginásio/Corpo: nav próprio (Dashboard/Calendário,
      // aqui com Agenda como 3ª aba) sempre visível; Registar só se acede a
      // partir do Calendário/FAB, nunca é a landing page nem uma aba própria.
      nav.classList.remove('hidden');
      nav.innerHTML = CORRIDA_NAV_HTML;
      main.classList.remove('overflow-hidden', 'pb-28', 'flex', 'flex-col');
      main.classList.add('overflow-y-auto', 'pb-28');
      const navHighlight = corridaTab === 'registar' ? 'calendario' : corridaTab;
      nav.classList.toggle('nav-elsewhere', corridaTab === 'registar');
      document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.tab === navHighlight);
      });
      if (corridaTab === 'registar') closeFab();

      if (corridaTab === 'dashboard') main.innerHTML = renderCorridaDashboard();
      else if (corridaTab === 'calendario') main.innerHTML = renderCorridaCalendario();
      else if (corridaTab === 'agenda') main.innerHTML = renderCorridaAgenda();
      else if (corridaTab === 'registar') main.innerHTML = renderCorridaRegistar();

      if (window.lucide) lucide.createIcons();
      if (corridaTab === 'dashboard') requestAnimationFrame(renderCorridaCharts);
      return;
    }
    // Início → placeholder simples, sem sub-navegação de topo (outras
    // verticais ainda por construir caem aqui também).
    nav.classList.add('hidden');
    main.classList.remove('overflow-hidden', 'pb-28', 'flex', 'flex-col');
    main.classList.add('overflow-y-auto', 'pb-28');
    if (activeVertical === 'home') main.innerHTML = renderHome();
    else main.innerHTML = renderVerticalPlaceholder(VERTICALS.find(v => v.key === activeVertical));
    if (window.lucide) lucide.createIcons();
    return;
  }

  // A partir daqui é Nutrição: restaurar o nav próprio (o Ginásio pode tê-lo
  // substituído) antes de aplicar o realce do separador ativo.
  nav.innerHTML = NUTRITION_NAV_HTML;

  // Restaurar layout normal ao entrar na vertical Nutrição (caso venha do Coach)
  main.classList.remove('overflow-hidden', 'pb-28', 'flex', 'flex-col');
  main.classList.add('overflow-y-auto', 'pb-28');

  // Perfil é um atalho global (não um separador de Dashboard/Calendário) —
  // o nav inferior da Nutrição não deve ficar visível enquanto lá estivermos.
  if (activeTab === 'perfil') {
    nav.classList.add('hidden');
  } else {
    nav.classList.remove('hidden');
    const navHighlight = activeTab === 'registar' ? 'calendario' : activeTab; // Registar é acedido a partir do Calendário
    nav.classList.toggle('nav-elsewhere', activeTab === 'registar');
    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.classList.toggle('active', btn.dataset.tab === navHighlight);
    });
  }
  // Já estamos no ecrã de criação — fecha o menu do "+" se estiver aberto.
  if (activeTab === 'registar') closeFab();

  if (activeTab === 'dashboard') main.innerHTML = renderDashboard();
  else if (activeTab === 'registar') main.innerHTML = renderRegistar();
  else if (activeTab === 'calendario') main.innerHTML = renderCalendario();
  else if (activeTab === 'agua') main.innerHTML = renderAgua();
  else if (activeTab === 'perfil') main.innerHTML = renderPerfil();

  if (window.lucide) lucide.createIcons();
  if (activeTab === 'dashboard') requestAnimationFrame(renderDashChart);
}

// Fundo/relevo partilhado por todos os cartões de estatística do Início —
// dá a cada módulo uma identidade cromática própria em vez da superfície
// neutra única que havia antes. Os dois temas pedem tratamentos opostos:
// - Escuro: cor forte (brilho radial + gradiente tingido) fica vibrante
//   sobre o quase-preto sem parecer exagerada — mantido tal como estava.
// - Claro: a mesma abordagem tingia o cartão inteiro e ficava "colorido de
//   mais", pouco profissional. Aqui o cartão volta a ser limpo/neutro
//   (branco, sombra suave discreta) e a cor do módulo fica só como um
//   detalhe — uma barra fina à esquerda — deixando o destaque para os
//   números, anéis e setas de tendência lá dentro (já coloridos).
function statCardBg(color){
  return `background:
      radial-gradient(130% 150% at 100% 0%, color-mix(in srgb, ${color} 10%, transparent) 0%, transparent 60%),
      linear-gradient(165deg, #ffffff, var(--surf-800));
    border-style:solid; border-width:1px 1px 1px 3px;
    border-color: var(--brd-700) var(--brd-700) var(--brd-700) color-mix(in srgb, ${color} 70%, var(--brd-700));
    box-shadow: 0 1px 2px rgba(15,23,42,0.06), 0 4px 14px -5px rgba(15,23,42,0.16), inset 0 1px 0 rgba(255,255,255,0.6);`;
}

// Cartão de módulo no Início: selo de cor + barra lateral que identificam o
// módulo, sobre o mesmo fundo com relevo/textura dos restantes cartões.
function moduleCard({ onclick, icon, color, g1, g2, title, sub, soon }){
  return `
    <button ${onclick ? `onclick="${onclick}"` : ''}
      class="relative rounded-2xl p-3.5 text-left flex items-center gap-3 transition ${onclick ? 'active:scale-[0.98]' : 'cursor-default'} ${soon ? 'opacity-60' : ''}"
      style="${statCardBg(color)}">
      <span class="absolute left-0 top-3 bottom-3 w-[3px] rounded-full" style="background:${color}"></span>
      <span class="w-10 h-10 rounded-xl flex items-center justify-center shrink-0" style="background:linear-gradient(135deg,${g1},${g2})">
        <i data-lucide="${icon}" class="w-5 h-5 text-white"></i>
      </span>
      <div class="min-w-0">
        <p class="text-sm font-bold text-white leading-tight">${title}</p>
        <p class="text-[11px] text-slate-400 mt-0.5 truncate">${sub}</p>
      </div>
    </button>`;
}

/* ============================= INÍCIO (visão geral das verticais) ============================= */
// Anel de progresso em SVG puro (sem lib de gráficos) — usado no cartão de
// calorias e nos mini-cartões do Corpo. Começa às 12h e avança no sentido dos
// ponteiros do relógio (rotação -90° no <svg>); o texto sobreposto não roda.
function emptyFillColor(){
  return theme === 'light' ? 'rgba(15,23,42,0.10)' : 'rgba(255,255,255,0.09)';
}
function ringSvg(pct, { size = 96, stroke = 8, color = 'var(--accent)', trackColor = emptyFillColor() } = {}){
  const r = (size - stroke) / 2;
  const c = size / 2;
  const circumference = 2 * Math.PI * r;
  const dash = circumference * Math.max(0, Math.min(100, pct)) / 100;
  return `
    <svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" class="-rotate-90">
      <circle cx="${c}" cy="${c}" r="${r}" fill="none" stroke="${trackColor}" stroke-width="${stroke}" />
      ${dash > 0.5 ? `<circle cx="${c}" cy="${c}" r="${r}" fill="none" stroke="${color}" stroke-width="${stroke}" stroke-linecap="round"
        stroke-dasharray="${dash} ${circumference}" style="transition: stroke-dasharray .4s ease" />` : ''}
    </svg>`;
}

// Barra de progresso horizontal — usada onde o anel não se aplica bem por
// não haver uma meta real definida pelo utilizador (ex.: pace da Corrida,
// que usa uma escala fixa de referência, não um objetivo do Perfil).
function gaugeBar(pct, { color = 'var(--accent)' } = {}){
  const width = Math.max(0, Math.min(100, pct));
  return `
    <div class="w-full h-1.5 rounded-full overflow-hidden" style="background:${emptyFillColor()}">
      <div class="h-full w-full rounded-full" style="transform-origin:left;transform:scaleX(${width / 100});background:${color};transition:transform .4s ease"></div>
    </div>`;
}

// Cartão principal do Início: substitui o antigo resumo "Hoje" — mesmo papel
// (leva a Nutrição), mas agora com o anel de progresso e um sinal de estado
// (macro no alvo / acima da meta) em vez de só um número.
function nutritionHeroCard(totals, profile){
  const calGoal = Number(profile.calorie_goal) || 0;
  const proteinGoal = Number(profile.protein_goal) || 0;
  const remaining = calGoal - totals.calories;
  const pct = calGoal > 0 ? (totals.calories / calGoal) * 100 : 0;
  const mealsToday = state.meals.filter(m => m.date === todayISO()).length;

  // Tons escuros o suficiente para passarem 4.5:1 sobre o cartão claro — os
  // originais eram cores de tema escuro (#f87171/#34d399/#fbbf24) e no fundo
  // claro caíam para 1.4-2.5, deixando o aviso quase invisível.
  let status = null;
  if (calGoal > 0 && totals.calories > calGoal) {
    status = { color: '#b91c1c', label: 'Calorias acima da meta' };
  } else if (proteinGoal > 0 && totals.protein >= proteinGoal) {
    status = { color: '#047857', label: 'Proteína no alvo' };
  } else if (proteinGoal > 0) {
    status = { color: '#8f5e07', label: `Faltam ${(proteinGoal - totals.protein).toFixed(0)}g de proteína` };
  }

  const mealsLabel = `${mealsToday} refeiç${mealsToday === 1 ? 'ão' : 'ões'} registada${mealsToday === 1 ? '' : 's'} hoje`;
  const desc = calGoal > 0
    ? `${mealsLabel}. Estás a ${Math.round(Math.min(100, pct))}% da meta diária.`
    : `${mealsLabel}. Define a tua meta no Perfil.`;

  return `
    <button onclick="switchVertical('nutricao')"
      class="w-full text-left rounded-3xl p-5 active:scale-[0.99] transition" style="${statCardBg('var(--accent)')}">
      <h2 class="text-[11px] font-semibold text-slate-500 uppercase tracking-wider mb-4">Hoje · Nutrição</h2>
      <div class="flex items-center gap-5">
        <div class="relative shrink-0" style="width:104px;height:104px;">
          ${ringSvg(pct, { size: 104, stroke: 9 })}
          <div class="absolute inset-0 flex flex-col items-center justify-center">
            <span class="text-2xl font-extrabold text-white leading-none">${totals.calories.toFixed(0)}</span>
            <span class="text-[10px] font-semibold text-slate-500 uppercase tracking-wide mt-1">${calGoal > 0 ? `de ${calGoal.toFixed(0)} kcal` : 'kcal'}</span>
          </div>
        </div>
        <div class="min-w-0 flex-1">
          <p class="text-lg font-bold text-white leading-tight">${calGoal > 0
            ? (remaining >= 0 ? `Restam ${remaining.toFixed(0)} kcal` : `${Math.abs(remaining).toFixed(0)} kcal acima`)
            : 'Sem meta definida'}</p>
          <p class="text-xs text-slate-400 mt-1.5 leading-relaxed">${desc}</p>
          ${status ? `
            <p class="flex items-center gap-1.5 mt-2.5 text-xs font-semibold" style="color:${status.color}">
              <span class="w-1.5 h-1.5 rounded-full shrink-0" style="background:${status.color}"></span> ${status.label}
            </p>` : ''}
        </div>
      </div>
    </button>`;
}

// Mini-cartão do Corpo (peso / gordura corporal / etc.) — anel de progresso.
// Todas estas métricas têm um objetivo definível pelo utilizador no Perfil,
// e o anel mede exatamente isso (proximidade ao objetivo) — o formato certo
// para uma dimensão com meta, ao contrário de módulos sem meta real (ver
// gaugeBar, usado onde um anel não teria o mesmo significado).
function bodyMiniStatCard(m, latestVal, prevVal, goal){
  const hasVal = latestVal !== null && latestVal !== undefined;
  const hasGoal = hasVal && goal !== null && goal !== undefined && isFinite(goal) && goal > 0;
  const pct = hasGoal ? Math.max(0, Math.min(100, 100 - Math.abs(latestVal - goal) / goal * 100)) : 0;

  const delta = (prevVal !== null && prevVal !== undefined) ? (latestVal - prevVal) : null;
  const improving = delta !== null && m.good !== null ? (m.good === 'up' ? delta > 0 : delta < 0) : null;
  const deltaColor = improving === null ? 'text-slate-500' : improving ? 'text-emerald-400' : 'text-red-400';
  const deltaArrow = delta === null ? '' : (delta > 0 ? '▲' : delta < 0 ? '▼' : '•');

  return `
    <button onclick="switchVertical('corpo')" class="text-left rounded-2xl p-3.5 active:scale-[0.98] transition" style="${statCardBg(m.color)}">
      <h2 class="text-[10px] font-semibold text-slate-500 uppercase tracking-wide mb-2 truncate">${m.label}</h2>
      <div class="flex items-center gap-3">
        <div class="relative shrink-0" style="width:52px;height:52px;">
          ${ringSvg(hasGoal ? pct : 0, { size: 52, stroke: 5, color: m.color })}
        </div>
        <div class="min-w-0">
          <p class="text-base font-extrabold text-white leading-none">${hasVal ? fmtMetric(m, latestVal) : '—'}</p>
          <p class="text-[10px] text-slate-500 mt-1 truncate">${hasGoal ? `meta ${fmtMetric(m, goal)}` : 'Sem objetivo'}</p>
          ${delta !== null ? `<p class="text-[10px] font-semibold ${deltaColor} mt-0.5">${deltaArrow} ${Math.abs(delta).toFixed(m.dec)}${m.unit}</p>` : ''}
        </div>
      </div>
    </button>`;
}

// Cartão do Ginásio: nº de sessões concluídas esta semana (0 para quem não
// tem a beta ativa — o módulo continua bloqueado, mas o cartão fica visível
// a todos por indicação explícita).
// Cartão do Ginásio (Sessões): tira de 7 dias (estilo "streak" de calendário)
// em vez de anel — a mesma informação (treinou ou não em cada dia) lê-se
// muito mais depressa numa tira do que num anel percentual, e dá variedade
// visual à grelha (nem tudo tem de ser um anel).
// Datas (Dom→Sáb) e iniciais da semana de calendário atual — partilhado por
// todos os cartões do Início que mostram um valor por dia desta semana.
function currentWeekDates(){
  const sunday = new Date(); sunday.setDate(sunday.getDate() - sunday.getDay());
  const dates = Array.from({ length: 7 }, (_, i) => { const d = new Date(sunday); d.setDate(d.getDate() + i); return d.toISOString().slice(0, 10); });
  return { dates, labels: ['D', 'S', 'T', 'Q', 'Q', 'S', 'S'] };
}
function gymSessionsCard(){
  const sessions = gymSessionsInRange('semana');
  const trainedDates = new Set(sessions.map(s => s.date));
  const { dates: days, labels } = currentWeekDates();
  const todayStr = todayISO();

  return `
    <button onclick="switchVertical('ginasio')" class="w-full text-left rounded-2xl p-3.5 active:scale-[0.98] transition" style="${statCardBg('var(--mod-ginasio-to)')}">
      <div class="flex items-center justify-between mb-3">
        <h2 class="text-[10px] font-semibold text-slate-500 uppercase tracking-wide">Ginásio · Esta semana</h2>
        <p class="text-xs font-bold text-white">${sessions.length} ${sessions.length === 1 ? 'sessão' : 'sessões'}</p>
      </div>
      <div class="flex items-center gap-1.5">
        ${days.map((d, i) => {
          const trained = trainedDates.has(d);
          const isToday = d === todayStr;
          return `
            <div class="flex flex-col items-center gap-1 flex-1">
              <div class="w-full aspect-square rounded-lg flex items-center justify-center"
                style="${trained ? 'background:linear-gradient(135deg,var(--mod-ginasio-from),var(--mod-ginasio-to))' : ('background:' + emptyFillColor()) + (isToday ? ';box-shadow:inset 0 0 0 1.5px #60a5fa' : '')}">
                ${trained ? '<i data-lucide="check" class="w-3.5 h-3.5 text-white"></i>' : ''}
              </div>
              <span class="text-[10px] ${isToday ? 'text-white font-bold' : 'text-slate-600'}">${labels[i]}</span>
            </div>`;
        }).join('')}
      </div>
    </button>`;
}

// Cartão opcional: volume total (kg) levantado esta semana, com barras
// diárias (Dom→Sáb) e a inicial do dia por baixo — mesmo tratamento do
// cartão "Ginásio · Esta semana" (streak), mas cada barra é o volume desse
// dia em vez de um check de treino feito/não feito.
function gymVolumeMiniCard(){
  const { dates: days, labels } = currentWeekDates();
  const byDay = {};
  gymSessions.forEach(s => { byDay[s.date] = (byDay[s.date] || 0) + sessionVolume(s); });
  const perDay = days.map(d => byDay[d] || 0);
  const thisWeek = perDay.reduce((a, b) => a + b, 0);

  const lastSunday = new Date(days[0]); lastSunday.setDate(lastSunday.getDate() - 7);
  const lastSaturday = new Date(days[0]); lastSaturday.setDate(lastSaturday.getDate() - 1);
  const lastWeekStart = lastSunday.toISOString().slice(0, 10), lastWeekEnd = lastSaturday.toISOString().slice(0, 10);
  const lastWeek = gymSessions.filter(s => s.date >= lastWeekStart && s.date <= lastWeekEnd).reduce((sum, s) => sum + sessionVolume(s), 0);
  const trend = thisWeek - lastWeek;
  const trendColor = trend > 0 ? 'text-emerald-400' : trend < 0 ? 'text-red-400' : 'text-slate-500';
  const trendArrow = trend > 0 ? '▲' : trend < 0 ? '▼' : '•';
  const maxDay = Math.max(...perDay, 1);
  const todayStr = todayISO();

  return `
    <button onclick="switchVertical('ginasio')" class="w-full text-left rounded-2xl p-3.5 active:scale-[0.98] transition" style="${statCardBg('var(--mod-ginasio-to)')}">
      <div class="flex items-center justify-between mb-1">
        <h2 class="text-[10px] font-semibold text-slate-500 uppercase tracking-wide">Ginásio · Volume</h2>
        ${gymSessions.length ? `<span class="text-[10px] font-semibold ${trendColor}">${trendArrow} ${Math.round(Math.abs(trend))} kg</span>` : ''}
      </div>
      <p class="text-2xl font-extrabold text-white leading-none">${Math.round(thisWeek)}<span class="text-xs font-semibold text-slate-500"> kg</span></p>
      <p class="text-[10px] text-slate-500 mt-1 mb-3">esta semana · semana passada abaixo</p>
      <div class="flex items-end gap-1.5" style="height:28px;">
        ${perDay.map(kg => `<div class="flex-1 rounded-sm" style="height:${kg > 0 ? Math.max(4, kg / maxDay * 28) : 3}px;background:${kg > 0 ? 'var(--mod-ginasio-to)' : emptyFillColor()}"></div>`).join('')}
      </div>
      <div class="flex items-center gap-1.5 mt-1">
        ${days.map((d, i) => `<span class="flex-1 text-center text-[10px] ${d===todayStr?'text-white font-bold':'text-slate-600'}">${labels[i]}</span>`).join('')}
      </div>
    </button>`;
}

// Cartão opcional: macro específico de hoje (Proteína/Hidratos/Gordura) —
// anel de progresso: tem meta real definida no Perfil, tal como o Corpo, por
// isso o anel (proximidade à meta) volta a ser a leitura mais direta aqui.
function nutrientMiniCard(nutrientKey, label, color, totals, profile){
  const goal = Number(profile[nutrientKey + '_goal']) || 0;
  const value = totals[nutrientKey] || 0;
  const hasGoal = goal > 0;
  const pct = hasGoal ? (value / goal) * 100 : 0;
  return `
    <button onclick="switchVertical('nutricao')" class="text-left rounded-2xl p-3.5 active:scale-[0.98] transition" style="${statCardBg(color)}">
      <h2 class="text-[10px] font-semibold text-slate-500 uppercase tracking-wide mb-2 truncate">${label}</h2>
      <div class="flex items-center gap-3">
        <div class="relative shrink-0" style="width:52px;height:52px;">
          ${ringSvg(hasGoal ? pct : 0, { size: 52, stroke: 5, color })}
        </div>
        <div class="min-w-0">
          <p class="text-base font-extrabold text-white leading-none">${value.toFixed(0)}<span class="text-xs font-semibold text-slate-500">g</span></p>
          <p class="text-[10px] text-slate-500 mt-1 truncate">${hasGoal ? `meta ${goal.toFixed(0)}g` : 'Sem meta'}</p>
        </div>
      </div>
    </button>`;
}

// Cartão da Corrida: distância desta semana (Dom→Sáb), barras diárias com a
// inicial do dia por baixo — mesmo tratamento visual do "Ginásio · Volume"
// e do "Ginásio · Esta semana".
function kmHomeCard(){
  const { dates: days, labels } = currentWeekDates();
  const perDay = days.map(d => totalKm(runs.filter(r => r.date === d)));
  const weekKm = perDay.reduce((a, b) => a + b, 0);
  const monthKm = totalKm(runsInRange('mes'));

  const lastSunday = new Date(days[0]); lastSunday.setDate(lastSunday.getDate() - 7);
  const lastSaturday = new Date(days[0]); lastSaturday.setDate(lastSaturday.getDate() - 1);
  const lastWeekKm = totalKm(runs.filter(r => r.date >= lastSunday.toISOString().slice(0, 10) && r.date <= lastSaturday.toISOString().slice(0, 10)));
  const trend = weekKm - lastWeekKm;
  const trendColor = trend > 0 ? 'text-emerald-400' : trend < 0 ? 'text-red-400' : 'text-slate-500';
  const trendArrow = trend > 0 ? '▲' : trend < 0 ? '▼' : '•';
  const maxDay = Math.max(...perDay, 0.1);
  const todayStr = todayISO();

  return `
    <button onclick="switchVertical('corrida')" class="w-full text-left rounded-2xl p-3.5 active:scale-[0.98] transition" style="${statCardBg('var(--mod-corrida-to)')}">
      <div class="flex items-center justify-between mb-1">
        <h2 class="text-[10px] font-semibold text-slate-500 uppercase tracking-wide">Corrida · Distância</h2>
        ${runs.length ? `<span class="text-[10px] font-semibold ${trendColor}">${trendArrow} ${Math.abs(trend).toFixed(1)} km</span>` : ''}
      </div>
      <p class="text-2xl font-extrabold text-white leading-none">${weekKm.toFixed(1)}<span class="text-xs font-semibold text-slate-500"> km</span></p>
      <p class="text-[10px] text-slate-500 mt-1 mb-3">esta semana · ${monthKm.toFixed(1)} km este mês</p>
      <div class="flex items-end gap-1.5" style="height:28px;">
        ${perDay.map(km => `<div class="flex-1 rounded-sm" style="height:${km > 0 ? Math.max(4, km / maxDay * 28) : 3}px;background:${km > 0 ? 'var(--mod-corrida-to)' : emptyFillColor()}"></div>`).join('')}
      </div>
      <div class="flex items-center gap-1.5 mt-1">
        ${days.map((d, i) => `<span class="flex-1 text-center text-[10px] ${d===todayStr?'text-white font-bold':'text-slate-600'}">${labels[i]}</span>`).join('')}
      </div>
    </button>`;
}
// Escala fixa de referência (3:00/km = ritmo muito rápido → 100%; 8:00/km =
// ritmo de caminhada/corrida ligeira → 0%) para o anel ter sempre um
// preenchimento com significado, sem precisar de um objetivo definido pelo
// utilizador (ao contrário do Peso/Gordura corporal, que usam a meta do
// Perfil). Cada bucket (5km/10km/21km) fica com a sua barra de progresso —
// a mesma família visual dos macros da Nutrição, em vez de mais um anel.
function paceQualityPct(paceSec){
  const FAST = 180, SLOW = 480;
  return Math.max(0, Math.min(100, (SLOW - paceSec) / (SLOW - FAST) * 100));
}
// Cartão da Corrida: melhor pace de sempre aos 5/10/21 km — não o pace da
// corrida mais recente, o recorde pessoal em cada bucket (ver bestPaceData).
function paceHomeCard(){
  const b5 = bestPaceData(5);
  const b10 = bestPaceData(10);
  const b21 = bestPaceData(21);
  const bucket = (label, b) => {
    if (!b) return `
      <div class="flex-1 min-w-0">
        <div class="flex items-baseline justify-between gap-2">
          <p class="text-[10px] text-slate-500">${label}</p>
          <p class="text-xs text-slate-600">Sem dados</p>
        </div>
        ${gaugeBar(0, { color: 'var(--mod-corrida-from)' })}
      </div>`;
    return `
      <div class="flex-1 min-w-0">
        <div class="flex items-baseline justify-between gap-2 mb-1">
          <p class="text-[10px] text-slate-500">${label}</p>
          <p class="text-sm font-extrabold text-white leading-none">${formatPace(b.pace)}</p>
        </div>
        ${gaugeBar(paceQualityPct(b.pace), { color: 'var(--mod-corrida-from)' })}
      </div>`;
  };
  return `
    <button onclick="switchVertical('corrida')" class="w-full text-left rounded-2xl p-3.5 active:scale-[0.98] transition" style="${statCardBg('var(--mod-corrida-to)')}">
      <h2 class="text-[10px] font-semibold text-slate-500 uppercase tracking-wide mb-2.5">Corrida · Melhor pace</h2>
      <div class="flex items-start gap-3">
        ${bucket('5 km+', b5)}
        ${bucket('10 km+', b10)}
        ${bucket('21 km+', b21)}
      </div>
    </button>`;
}

// Vai diretamente para a Agenda de provas (não o Registo) — usado pelo
// cartão "Próxima Prova" do Início, espelhando o padrão de goToAvaliarForDate.
function goToCorridaAgenda(){
  corridaTab = 'agenda';
  switchVertical('corrida');
}

// Cartão "Próxima Prova": contagem decrescente para a prova agendada mais
// próxima — é o indicador central que liga a Agenda (Fase 3) ao Início,
// para o utilizador ver de imediato quanto tempo falta sem abrir a Corrida.
function nextRaceHomeCard(){
  const todayIso = todayISO();
  const upcoming = raceEvents
    .filter(e => e.status !== 'concluida' && e.date >= todayIso)
    .sort((a,b) => a.date.localeCompare(b.date));
  const next = upcoming[0];
  const color = '#eab308';

  if (!next) {
    return `
      <button onclick="goToCorridaAgenda()" class="w-full text-left rounded-2xl p-3.5 active:scale-[0.98] transition" style="${statCardBg(color)}">
        <h2 class="text-[10px] font-semibold text-slate-500 uppercase tracking-wide mb-2">Próxima Prova</h2>
        <div class="flex items-center gap-2.5">
          <span class="w-9 h-9 rounded-xl flex items-center justify-center shrink-0" style="background:${color}1a;">
            <i data-lucide="flag" class="w-4 h-4" style="color:${color}"></i>
          </span>
          <p class="text-xs text-slate-500">Sem provas agendadas — toca para adicionar uma na Agenda.</p>
        </div>
      </button>`;
  }

  const daysUntil = Math.round((new Date(next.date + 'T00:00:00') - new Date(todayIso + 'T00:00:00')) / 86400000);
  const typeLabel = (RACE_TYPES.find(t => t.key === next.race_type) || {}).label || next.race_type;
  const countLabel = daysUntil === 0 ? 'Hoje!' : daysUntil === 1 ? '1 dia' : `${daysUntil} dias`;
  const countColor = daysUntil === 0 ? '#ef4444' : daysUntil <= 7 ? '#f97316' : '#fff';

  return `
    <button onclick="goToCorridaAgenda()" class="w-full text-left rounded-2xl p-3.5 active:scale-[0.98] transition" style="${statCardBg(color)}">
      <div class="flex items-center justify-between mb-1.5">
        <h2 class="text-[10px] font-semibold text-slate-500 uppercase tracking-wide">Próxima Prova</h2>
        <span class="text-[10px] font-semibold px-1.5 py-0.5 rounded-full" style="background:${color}1a;color:color-mix(in srgb, ${color} 45%, #0f172a)">${esc(typeLabel)}</span>
      </div>
      <div class="flex items-end justify-between gap-2">
        <div class="min-w-0">
          <p class="text-sm font-bold text-white truncate">${esc(next.name)}</p>
          <p class="text-[10px] text-slate-500 mt-0.5 truncate">${formatDatePT(next.date)}${next.location ? ` · ${esc(next.location)}` : ''}</p>
        </div>
        <div class="text-right shrink-0">
          <p class="text-xl font-extrabold leading-none" style="color:${countColor}">${countLabel}</p>
        </div>
      </div>
    </button>`;
}

// Cartões ativos (o utilizador só escolhe QUAIS, não a ordem — ver
// CANONICAL_HOME_ORDER) devolvidos sempre pela mesma ordem fixa, agrupada
// por módulo. Chaves desconhecidas (ex.: de uma versão futura/antiga) são
// ignoradas em vez de rebentar o render.
function currentHomeLayout(){
  const saved = state.profile && Array.isArray(state.profile.home_layout) ? state.profile.home_layout : null;
  const activeSet = new Set((saved && saved.length) ? saved : DEFAULT_HOME_LAYOUT);
  return CANONICAL_HOME_ORDER.filter(k => activeSet.has(k));
}

async function saveHomeLayout(next){
  if (!state.profile) return;
  const prevLayout = state.profile.home_layout;
  state.profile.home_layout = next;
  render();
  try {
    const { error } = await sb.from('profiles').update({ home_layout: next }).eq('id', currentUser.id);
    if (error) throw error;
  } catch(e) {
    state.profile.home_layout = prevLayout;
    flashSyncError(e);
    render();
  }
}
function toggleHomeCard(key){
  const active = new Set(currentHomeLayout());
  if (active.has(key)) active.delete(key); else active.add(key);
  // Guarda-se um array (esquema simples), mas a ordem de exibição vem sempre
  // de CANONICAL_HOME_ORDER — o array aqui é só o conjunto de chaves ativas.
  saveHomeLayout(CANONICAL_HOME_ORDER.filter(k => active.has(k)));
}
function toggleHomeEditMode(){
  homeEditMode = !homeEditMode;
  render();
}

// Mapa key → HTML já renderizado para cada cartão opcional (calculado uma
// vez por render a partir dos dados atuais, e depois filtrado/ordenado pela
// disposição escolhida pelo utilizador).
function buildHomeCardsMap(totals, profile){
  // Cada avaliação pode não preencher todas as métricas (ex.: só peso numa
  // pesagem rápida), por isso cada cartão procura a sua própria última
  // medição — não apenas a última avaliação, que pode não ter esse campo.
  const lastTwoForMetric = key => {
    const vals = [];
    for (const a of bodyAssessments) {
      if (a[key] !== null && a[key] !== undefined) {
        vals.push(a[key]);
        if (vals.length === 2) break;
      }
    }
    return [vals[0] ?? null, vals[1] ?? null];
  };
  const bodyCard = key => {
    const m = BODY_METRICS.find(x => x.key === key);
    const [latestVal, prevVal] = lastTwoForMetric(key);
    return bodyMiniStatCard(m, latestVal, prevVal, bodyGoal(m));
  };
  return {
    weight_kg: bodyCard('weight_kg'),
    body_fat_pct: bodyCard('body_fat_pct'),
    bmi: bodyCard('bmi'),
    muscle_mass_kg: bodyCard('muscle_mass_kg'),
    body_water_pct: bodyCard('body_water_pct'),
    // Cor vem sempre de MACROS, nunca repetida à mão aqui — era assim que
    // "Proteína hoje" (macro) e "Proteína %" (métrica de Corpo) acabaram com
    // o mesmo roxo #a78bfa sem ninguém ter decidido isso.
    protein_today: nutrientMiniCard('protein', 'Proteína hoje', MACROS.find(m => m.key === 'protein').color, totals, profile),
    carbs_today: nutrientMiniCard('carbs', 'Hidratos hoje', MACROS.find(m => m.key === 'carbs').color, totals, profile),
    fat_today: nutrientMiniCard('fat', 'Gordura hoje', MACROS.find(m => m.key === 'fat').color, totals, profile),
    gym_sessions: gymSessionsCard(),
    gym_volume: gymVolumeMiniCard(),
    corrida_km: kmHomeCard(),
    corrida_pace: paceHomeCard(),
  };
}

// Painel de "Personalizar Início": os 12 cartões opcionais agrupados por
// módulo, cada um com um interruptor para ativar/desativar. A ordem de
// exibição é sempre fixa (CANONICAL_HOME_ORDER) — só a seleção é do
// utilizador, por isso não há setas nem drag aqui.
function homeCardRow(d, active){
  // "footprints" (pés) não tem equivalente de ténis no set base da lucide —
  // ver sneakerIcon() — por isso este cartão usa o SVG inline em vez de
  // data-lucide como os restantes.
  const icon = d.icon === 'footprints'
    ? sneakerIcon('w-4 h-4 text-slate-400 shrink-0')
    : `<i data-lucide="${d.icon}" class="w-4 h-4 text-slate-400 shrink-0"></i>`;
  return `
    <div class="flex items-center gap-2 bg-neutral-900/60 border border-neutral-800 rounded-xl px-2.5 py-2">
      ${icon}
      <span class="text-xs text-white flex-1 truncate">${d.label}</span>
      <button onclick="toggleHomeCard('${d.key}')" type="button"
        class="w-9 h-5 rounded-full relative transition shrink-0 ${active ? 'bg-[var(--accent)]' : 'bg-neutral-700'}">
        <span class="absolute top-0.5 ${active ? 'left-4' : 'left-0.5'} w-4 h-4 rounded-full bg-white transition-all"></span>
      </button>
    </div>`;
}
function renderHomeEditPanel(){
  const activeSet = new Set(currentHomeLayout());
  const modules = [...new Set(HOME_CARD_DEFS.map(d => d.module))];

  return `
    <div class="rounded-2xl p-4" style="${statCardBg('var(--accent)')}">
      <div class="flex items-center justify-between mb-1">
        <h2 class="text-sm font-bold text-white">Personalizar Início</h2>
        <button onclick="toggleHomeEditMode()" class="text-xs font-semibold text-[var(--accent)]">Concluir</button>
      </div>
      <p class="text-[11px] text-slate-500 mb-3 leading-relaxed">Escolhe os cartões que queres ver. A posição é sempre agrupada por módulo — o cartão de calorias é sempre o primeiro e não se pode desativar.</p>

      ${modules.map(mod => `
        <h2 class="text-[10px] font-semibold text-slate-500 uppercase tracking-wide mb-1.5">${mod}</h2>
        <div class="space-y-1.5 mb-3">
          ${HOME_CARD_DEFS.filter(d => d.module === mod).map(d => homeCardRow(d, activeSet.has(d.key))).join('')}
        </div>`).join('')}
    </div>`;
}

function renderHome(){
  const totals = rangeTotals('hoje');
  const profile = state.profile || {};
  const cardsMap = buildHomeCardsMap(totals, profile);
  const layout = currentHomeLayout();

  return `
    <div class="space-y-4 fade-in">
      <div class="flex items-center justify-between">
        <h2 class="text-[11px] font-semibold text-slate-500 uppercase tracking-wide">Início</h2>
        <button onclick="toggleHomeEditMode()" type="button" class="tap-h-44 flex items-center gap-1 text-[11px] font-semibold text-slate-400 border border-neutral-800 rounded-full px-3.5 active:scale-95 transition">
          <i data-lucide="sliders-horizontal" class="w-3 h-3"></i> Personalizar
        </button>
      </div>

      ${nextRaceHomeCard()}

      ${nutritionHeroCard(totals, profile)}

      ${waterHomeCard()}

      ${homeEditMode ? renderHomeEditPanel() : `
        ${layout.length ? `
          <div class="grid grid-cols-2 gap-2.5" style="grid-auto-flow:dense;">
            ${layout.map(k => {
              const def = HOME_CARD_DEFS.find(d => d.key === k);
              const span = def && def.size === 'full' ? 'col-span-2' : '';
              // [&>*]: força o cartão (botão/div) lá dentro a preencher a
              // célula da grelha — sem isto, um <button> (inline-block por
              // omissão) encolhia para o conteúdo em vez de esticar como um
              // item de grid normal fazia antes deste wrapper existir.
              return `<div class="${span} [&>*]:w-full [&>*]:block">${cardsMap[k]}</div>`;
            }).join('')}
          </div>` : `
          <button onclick="toggleHomeEditMode()" type="button" class="w-full text-xs text-slate-500 border-2 border-dashed border-neutral-800 rounded-2xl py-6">
            Sem cartões ativos — toca em "Personalizar" para escolher.
          </button>`}
      `}
    </div>
  `;
}

/* ============================= CORRIDA (vertical) ============================= */
// Etiqueta curta do tipo de corrida para o cartão da lista e para o resumo do Coach.
function runKindLabel(r){
  if (r.kind === 'competicao') {
    const raceType = (r.details || {}).race_type;
    const disciplineLabel = raceType ? (RACE_TYPES.find(t => t.key === raceType) || {}).label : null;
    return disciplineLabel ? `Competição · ${disciplineLabel}` : 'Competição';
  }
  if (r.kind === 'treino') return (RUN_TRAINING_TYPES.find(t => t.key === r.training_type) || {}).label || 'Treino';
  return null; // corridas antigas gravadas como 'simples' (categoria removida) não mostram etiqueta
}

function runCard(r){
  const expanded = expandedRunId === r.id;
  const reanalyzing = reanalyzingRunId === r.id;
  const paths = r.photo_paths || [];
  const hasDistance = r.distance_km !== null && r.distance_km !== undefined;
  const hasDuration = r.duration_seconds !== null && r.duration_seconds !== undefined;
  const pace = (hasDistance && hasDuration) ? paceSecPerKm(r) : null;
  const splits = [[5, r.split_5k_seconds], [10, r.split_10k_seconds], [21, r.split_21k_seconds]]
    .filter(([, s]) => s !== null && s !== undefined)
    .map(([km, s]) => `${km}km ${formatDuration(s)}`);
  const kindLabel = runKindLabel(r);
  const d = r.details || {};

  const summaryParts = [
    hasDistance ? `${Number(r.distance_km).toFixed(2)} km` : null,
    hasDuration ? formatDuration(r.duration_seconds) : null,
    pace !== null ? formatPace(pace) : null,
  ].filter(Boolean);

  return `
    <div id="run-card-${r.id}" class="bg-neutral-900/60 border border-neutral-800 rounded-xl overflow-hidden">
      <button onclick="toggleRunExpand('${r.id}')" class="w-full flex items-center justify-between gap-2 p-3 text-left">
        <div class="min-w-0">
          <p class="text-xs font-semibold text-white flex items-center gap-1.5 flex-wrap">
            ${r.name ? esc(r.name) : formatDatePT(r.date)}
            ${kindLabel ? `<span class="text-[10px] font-semibold px-1.5 py-0.5 rounded-full bg-[var(--accent)]/10 badge-ink border border-[var(--accent)]/30">${esc(kindLabel)}</span>` : ''}
            ${paths.length>1 ? `<span class="text-[10px] text-slate-500 flex items-center gap-0.5"><i data-lucide="images" class="w-3 h-3"></i>${paths.length}</span>` : ''}
          </p>
          <p class="text-[11px] text-slate-500 mt-0.5">${r.name ? formatDatePT(r.date) + (summaryParts.length ? ' · ' + summaryParts.join(' · ') : '') : (summaryParts.length ? summaryParts.join(' · ') : 'Sem distância/duração registadas')}</p>
          ${splits.length ? `<p class="text-[10px] text-slate-600 mt-0.5">Splits: ${splits.join(' · ')}</p>` : ''}
        </div>
        <i data-lucide="${expanded?'chevron-up':'chevron-down'}" class="w-4 h-4 text-slate-500 shrink-0"></i>
      </button>

      ${expanded ? `
      <div class="px-3 pb-3 space-y-2.5 border-t border-neutral-800 pt-2.5">
        ${paths.length ? `
          <div class="flex flex-wrap gap-2">
            ${paths.map(p => signedUrlCache[p]
              ? `<a href="${signedUrlCache[p]}" target="_blank" rel="noopener" class="shrink-0"><img src="${signedUrlCache[p]}" class="w-20 h-20 object-cover rounded-xl border border-neutral-800" alt="Print" /></a>`
              : signedUrlFailed[p]
                ? `<button onclick="loadRunPhotoUrls('${r.id}')" type="button" class="w-20 h-20 shrink-0 rounded-xl border border-red-500/30 bg-neutral-900 flex flex-col items-center justify-center text-red-400 text-[10px] gap-1 text-center px-1">
                    <i data-lucide="refresh-cw" class="w-4 h-4"></i> Tentar de novo
                  </button>`
                : `<div class="w-20 h-20 shrink-0 rounded-xl border border-neutral-800 bg-neutral-900 flex items-center justify-center text-slate-600 text-xs"><i data-lucide="loader-2" class="w-4 h-4 animate-spin"></i></div>`
            ).join('')}
          </div>` : ''}

        ${r.kind === 'treino' && RUN_REPEAT_TRAINING_TYPES.has(r.training_type) ? `
          <div class="grid grid-cols-2 gap-1.5 text-[11px] text-slate-400 mb-1.5">
            ${d.warmup_minutes ? `<span>Aquecimento: <span class="text-slate-200">${d.warmup_minutes} min</span></span>` : ''}
            ${d.recovery_seconds ? `<span>Recuperação: <span class="text-slate-200">${d.recovery_seconds} seg</span></span>` : ''}
          </div>
          ${(d.splits && d.splits.length) ? `
            <div class="space-y-0.5 mb-1">
              ${d.splits.map((s, i) => `
                <p class="text-[11px] text-slate-400">Split ${i+1}: <span class="text-slate-200">${s.distance_km ? Number(s.distance_km).toFixed(2)+' km' : ''}${s.distance_km && s.time_seconds ? ' · ' : ''}${s.time_seconds ? formatDuration(s.time_seconds) : ''}</span></p>
              `).join('')}
            </div>` : ''}` : ''}

        ${r.kind === 'competicao' ? `
          <div class="grid grid-cols-2 gap-1.5 text-[11px] text-slate-400">
            ${d.official_time_seconds ? `<span>Tempo oficial: <span class="text-slate-200">${formatDuration(d.official_time_seconds)}</span></span>` : ''}
            ${d.position ? `<span>Posição: <span class="text-slate-200">${d.position}º</span></span>` : ''}
          </div>` : ''}

        ${(d.elevation_gain_m || d.cadence_spm || d.calories_kcal || d.avg_heart_rate_bpm || d.max_heart_rate_bpm || d.vo2_max) ? `
          <div class="grid grid-cols-2 gap-1.5 text-[11px] text-slate-400">
            ${d.elevation_gain_m ? `<span>Desnível: <span class="text-slate-200">${d.elevation_gain_m} m</span></span>` : ''}
            ${d.cadence_spm ? `<span>Cadência: <span class="text-slate-200">${d.cadence_spm} spm</span></span>` : ''}
            ${d.calories_kcal ? `<span>Calorias: <span class="text-slate-200">${d.calories_kcal} kcal</span></span>` : ''}
            ${d.vo2_max ? `<span>VO2 máx: <span class="text-slate-200">${d.vo2_max}</span></span>` : ''}
            ${d.avg_heart_rate_bpm ? `<span>FC média: <span class="text-slate-200">${d.avg_heart_rate_bpm} bpm</span></span>` : ''}
            ${d.max_heart_rate_bpm ? `<span>FC máxima: <span class="text-slate-200">${d.max_heart_rate_bpm} bpm</span></span>` : ''}
          </div>` : ''}
        ${(d.hr_zones && d.hr_zones.length) ? `
          <p class="text-[11px] text-slate-400">Zonas de FC: <span class="text-slate-200">${d.hr_zones.map(z => `Z${z.zone} ${z.minutes}min`).join(' · ')}</span></p>
        ` : ''}

        ${r.effort_rpe ? `<p class="text-[11px] text-slate-500">Esforço: <span class="text-slate-300 font-medium">${r.effort_rpe}/10</span></p>` : ''}
        ${r.notes ? `<p class="text-[11px] text-slate-500"><span class="text-slate-400 font-medium">Obs.:</span> ${esc(r.notes)}</p>` : ''}

        ${r.coach_notes ? `
          <div class="rounded-lg bg-neutral-800/40 border border-emerald-500/20 p-2.5 mb-1">
            <p class="text-[10px] text-emerald-400 font-semibold flex items-center gap-1.5 mb-1">
              <i data-lucide="award" class="w-3.5 h-3.5"></i> Coach
            </p>
            <p class="text-[11px] text-slate-300 leading-relaxed">${esc(r.coach_notes)}</p>
          </div>
        ` : ''}

        <div class="flex items-center gap-2 pt-1">
          <button onclick="openEditRun('${r.id}')"
            class="flex-1 border border-neutral-700 hover:border-[var(--accent)]/50 text-slate-300 text-xs font-semibold rounded-xl py-2 flex items-center justify-center gap-1.5 transition">
            <i data-lucide="pencil" class="w-3.5 h-3.5"></i> Editar
          </button>
          ${paths.length ? `
            <button onclick="reanalyzeRun('${r.id}')" ${reanalyzing ? 'disabled' : ''}
              class="flex-1 border border-neutral-700 hover:border-[var(--accent)]/50 text-slate-300 text-xs font-semibold rounded-xl py-2 flex items-center justify-center gap-1.5 transition disabled:opacity-40 ${reanalyzing?'analyzing':''}">
              ${reanalyzing
                ? '<i data-lucide="loader-2" class="w-3.5 h-3.5 animate-spin"></i> A reanalisar...'
                : '<i data-lucide="refresh-cw" class="w-3.5 h-3.5"></i> Reanalisar'}
            </button>
          ` : ''}
          <button onclick="openDeleteRunModal('${r.id}')" aria-label="Eliminar corrida"
            class="border border-red-500/30 text-red-400 hover:bg-red-500/10 text-xs font-semibold rounded-xl px-3 py-2 flex items-center justify-center gap-1.5 transition">
            <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
          </button>
        </div>
      </div>` : ''}
    </div>`;
}

// Limpa só as chaves específicas de kind/tipo (warmup, recuperação,
// disciplina, tempo oficial, posição) — nunca as métricas do relógio
// (elevation_gain_m, cadence_spm, etc.), que partilham o mesmo objeto mas
// não dependem de Treino/Competição nem do tipo escolhido.
function clearKindSpecificRunDetails(){
  ['warmup_minutes', 'recovery_seconds', 'race_type', 'official_time_minutes', 'position']
    .forEach(k => delete runDetailsDraft[k]);
}
function selectRunKind(kind){
  runKind = kind;
  // 'continuo' por omissão ao voltar a Treino — a maioria das corridas são
  // uma corrida solta, não vale a pena obrigar a escolher sempre.
  runTrainingType = kind === 'treino' ? 'continuo' : null;
  clearKindSpecificRunDetails();
  runSplitsDraft = [];
  delete runFieldErrors.trainingType;
  delete runFieldErrors.distance;
  delete runFieldErrors.duration;
  refreshRunNameSuggestion();
  refreshCorridaRegistar();
}
function selectRunTrainingType(type){
  runTrainingType = type;
  clearKindSpecificRunDetails();
  runSplitsDraft = [];
  delete runFieldErrors.trainingType;
  refreshRunNameSuggestion();
  refreshCorridaRegistar();
}
function updateRunDetail(key, value){ runDetailsDraft[key] = value; }
function selectRaceType(value){
  runDetailsDraft.race_type = value;
  refreshRunNameSuggestion();
  refreshCorridaRegistar();
}

function selectRunEffort(n){ runEffortDraft = (runEffortDraft === n) ? null : n; refreshCorridaRegistar(); }

// Campo "Nome da corrida" — obrigatório, sempre pré-preenchido com uma
// sugestão (ver suggestedRunName), partilhado por IA e manual (aparece uma
// só vez em cada ecrã: no bloco partilhado da Nova Corrida, ou no ecrã de
// Editar). `id` distinto por chamada porque as duas telas podem coexistir
// no mesmo documento entre re-renders.
function renderRunNameField(id){
  return `
    <div class="mb-3">
      <label for="${id}" class="text-[11px] text-slate-500 mb-1 block">Nome da corrida <span class="text-red-400">*</span></label>
      <input id="${id}" type="text" maxlength="120" required value="${esc(runNameDraft)}"
        oninput="updateRunName(this.value)"
        class="w-full bg-neutral-900 border ${runFieldBorderClass('name')} rounded-xl px-3 py-2 text-sm text-white placeholder-slate-600 outline-none focus:border-[var(--accent)]/60" />
      ${runFieldErrorMsg('name')}
      ${(runNameAutoSuggested && !runFieldErrors.name) ? `<p class="text-[10px] text-slate-600 mt-1">Sugestão automática — muda se quiseres.</p>` : ''}
    </div>
  `;
}

// Período do dia (hora atual) usado na sugestão automática do nome.
function periodOfDayLabel(){
  const h = new Date().getHours();
  if (h < 12) return 'matinal';
  if (h < 19) return 'da tarde';
  return 'noturno';
}
// Nome sugerido a partir do kind atual + período do dia —
// ex.: "Treino matinal", "Competição da tarde".
function suggestedRunName(){
  const period = periodOfDayLabel();
  return runKind === 'competicao' ? `Competição ${period}` : `Treino ${period}`;
}
// Só atualiza o rascunho se ainda for a sugestão automática — nunca sobrepõe
// um nome que o utilizador já editou à mão.
function refreshRunNameSuggestion(){
  if (!runNameAutoSuggested) return;
  runNameDraft = suggestedRunName();
}
function updateRunName(value){
  runNameDraft = value;
  runNameAutoSuggested = false;
  clearRunFieldError('name');
}

// Validação por campo (ver runFieldErrors) — mostra o erro junto ao campo
// em vez de um toast genérico, e desaparece assim que o utilizador mexe
// nesse campo específico.
function runFieldBorderClass(key){ return runFieldErrors[key] ? 'border-red-500/70' : 'border-neutral-800'; }
function runFieldErrorMsg(key){ return runFieldErrors[key] ? `<p class="text-[11px] text-red-400 mt-1">${esc(runFieldErrors[key])}</p>` : ''; }
function clearRunFieldError(key){
  if (runFieldErrors[key]) { delete runFieldErrors[key]; refreshCorridaRegistar(); }
}
// Foca e centra o primeiro campo com erro depois de re-renderizar — só faz
// sentido chamar a seguir a um refresh que já mostra os campos assinalados.
function focusRunField(id){
  requestAnimationFrame(() => {
    const el = document.getElementById(id);
    if (el) { el.focus({ preventScroll: true }); el.scrollIntoView({ behavior:'smooth', block:'center' }); }
  });
}

// Splits dinâmicos (Intervalos/Subidas) — cada volta com a sua
// distância e tempo, em vez de um "nº de repetições" + "distância por
// repetição" genéricos que assumiam todas as voltas iguais.
function addRunSplit(){
  runSplitsDraft.push({ distance_km:'', minutes:'' });
  refreshCorridaRegistar();
}
function removeRunSplit(index){
  runSplitsDraft.splice(index, 1);
  refreshCorridaRegistar();
}
function updateRunSplit(index, field, value){
  if (!runSplitsDraft[index]) return;
  runSplitsDraft[index][field] = value;
}

// Zonas de FC dinâmicas — mesma lógica dos splits, mas para tempo em cada
// zona de frequência cardíaca (comum a qualquer tipo de corrida).
function addRunHrZone(){
  runHrZonesDraft.push({ zone: '', minutes: '' });
  refreshCorridaRegistar();
}
function removeRunHrZone(index){
  runHrZonesDraft.splice(index, 1);
  refreshCorridaRegistar();
}
function updateRunHrZone(index, field, value){
  if (!runHrZonesDraft[index]) return;
  runHrZonesDraft[index][field] = value;
}

// Métricas do relógio comuns a QUALQUER tipo de corrida (desnível, cadência,
// calorias, FC média/máxima, zonas de FC, VO2 máx) — ao contrário dos campos
// de treino por repetição/competição abaixo, não dependem de runKind.
function buildRunWatchMetrics(){
  const d = {};
  const num = (v) => { const n = Number(v); return n > 0 ? n : null; };
  const elevation = num(runDetailsDraft.elevation_gain_m); if (elevation) d.elevation_gain_m = elevation;
  const cadence = num(runDetailsDraft.cadence_spm); if (cadence) d.cadence_spm = cadence;
  const calories = num(runDetailsDraft.calories_kcal); if (calories) d.calories_kcal = calories;
  const avgHr = num(runDetailsDraft.avg_heart_rate_bpm); if (avgHr) d.avg_heart_rate_bpm = avgHr;
  const maxHr = num(runDetailsDraft.max_heart_rate_bpm); if (maxHr) d.max_heart_rate_bpm = maxHr;
  const vo2 = num(runDetailsDraft.vo2_max); if (vo2) d.vo2_max = vo2;
  const zones = runHrZonesDraft
    .map(z => ({ zone: Number(z.zone), minutes: Number(z.minutes) }))
    .filter(z => z.zone > 0 && z.minutes > 0);
  if (zones.length) d.hr_zones = zones;
  return d;
}

// Campos dinâmicos (Intervalos/Subidas) ou de competição + métricas do
// relógio, prontos para gravar em `details` jsonb — só inclui chaves/splits
// preenchidos com valores válidos.
function buildRunDetailsPayload(){
  const d = buildRunWatchMetrics();
  if (runKind === 'treino' && RUN_REPEAT_TRAINING_TYPES.has(runTrainingType)) {
    RUN_REPEAT_DETAIL_FIELDS.forEach(f => {
      const v = Number(runDetailsDraft[f.key]);
      if (v > 0) d[f.key] = v;
    });
    const splits = runSplitsDraft
      .map(s => ({ distance_km: Number(s.distance_km), time_seconds: parseDurationToSeconds(s.minutes) }))
      .filter(s => s.distance_km > 0 || s.time_seconds);
    if (splits.length) d.splits = splits;
  }
  if (runKind === 'competicao') {
    if (runDetailsDraft.race_type) d.race_type = runDetailsDraft.race_type;
    const officialSeconds = parseDurationToSeconds(runDetailsDraft.official_time_minutes);
    if (officialSeconds) d.official_time_seconds = officialSeconds;
    const pos = Number(runDetailsDraft.position);
    if (pos > 0) d.position = pos;
  }
  return Object.keys(d).length ? d : null;
}

// Pílulas Treino/Competição — partilhadas pelo upload (analyzeRun) e pela
// entrada manual (submitNewRun). O tipo de treino/disciplina (ver
// renderRunTypeSelectField) é escolhido logo a seguir, também partilhado: é
// sempre o utilizador a decidir, mesmo no caminho por foto.
function renderRunKindPills(){
  const kinds = [
    { key:'treino', label:'Treino' },
    { key:'competicao', label:'Competição' },
  ];
  return `
    <div class="flex flex-wrap gap-1.5 mb-3">
      ${kinds.map(k => `
        <button onclick="selectRunKind('${k.key}')" type="button"
          class="choice-pill ${runKind===k.key ? 'active' : ''} rounded-full px-3 py-1.5 text-[11px] font-medium"
          ${runKind===k.key ? `style="background:var(--mod-corrida-to); border-color:var(--mod-corrida-to);"` : ''}>
          ${k.label}
        </button>
      `).join('')}
    </div>
  `;
}

// Nível de esforço percebido (RPE 1-10) — opcional, partilhado por IA e
// manual (a IA nunca o infere, é sempre o utilizador a reportar).
function renderRunEffortField(){
  return `
    <div class="mb-3">
      <label class="text-[11px] text-slate-500 mb-1 block">Nível de esforço <span class="text-slate-600">(RPE, opcional)</span></label>
      <div class="flex gap-1">
        ${Array.from({length:10}, (_, i) => i+1).map(n => `
          <button onclick="selectRunEffort(${n})" type="button" aria-label="Esforço ${n} de 10"
            class="flex-1 h-7 rounded-lg text-[10px] font-semibold border transition text-slate-500 ${runEffortDraft===n ? 'text-neutral-950' : 'bg-neutral-900 border-neutral-800'}"
            ${runEffortDraft===n ? `style="background:var(--mod-corrida-to); border-color:var(--mod-corrida-to);"` : ''}>
            ${n}
          </button>
        `).join('')}
      </div>
    </div>
  `;
}

// Métricas do relógio (desnível, cadência, calorias, FC, VO2 máx) — comuns a
// Treino e Competição, por isso ficam fora dos blocos condicionais abaixo.
// No caminho por foto a IA lê estes valores sozinha; aqui só para a entrada
// manual/edição.
function renderRunWatchMetricsFields(){
  return `
    <div class="rounded-xl border border-neutral-800 bg-neutral-900/40 p-3 mb-3">
      <p class="text-[11px] font-semibold text-slate-400 mb-2">Métricas do relógio (opcional)</p>
      <div class="grid grid-cols-2 gap-2 mb-3">
        <input type="number" min="0" step="1" placeholder="Desnível (m)" value="${esc(runDetailsDraft.elevation_gain_m || '')}"
          oninput="updateRunDetail('elevation_gain_m', this.value)"
          class="w-full bg-neutral-900 border border-neutral-800 rounded-xl px-3 py-2 text-xs text-white placeholder-slate-600 outline-none focus:border-[var(--accent)]/60" />
        <input type="number" min="0" step="1" placeholder="Cadência (passadas/min)" value="${esc(runDetailsDraft.cadence_spm || '')}"
          oninput="updateRunDetail('cadence_spm', this.value)"
          class="w-full bg-neutral-900 border border-neutral-800 rounded-xl px-3 py-2 text-xs text-white placeholder-slate-600 outline-none focus:border-[var(--accent)]/60" />
        <input type="number" min="0" step="1" placeholder="Calorias (kcal)" value="${esc(runDetailsDraft.calories_kcal || '')}"
          oninput="updateRunDetail('calories_kcal', this.value)"
          class="w-full bg-neutral-900 border border-neutral-800 rounded-xl px-3 py-2 text-xs text-white placeholder-slate-600 outline-none focus:border-[var(--accent)]/60" />
        <input type="number" min="0" step="0.1" placeholder="VO2 máx" value="${esc(runDetailsDraft.vo2_max || '')}"
          oninput="updateRunDetail('vo2_max', this.value)"
          class="w-full bg-neutral-900 border border-neutral-800 rounded-xl px-3 py-2 text-xs text-white placeholder-slate-600 outline-none focus:border-[var(--accent)]/60" />
        <input type="number" min="0" step="1" placeholder="FC média (bpm)" value="${esc(runDetailsDraft.avg_heart_rate_bpm || '')}"
          oninput="updateRunDetail('avg_heart_rate_bpm', this.value)"
          class="w-full bg-neutral-900 border border-neutral-800 rounded-xl px-3 py-2 text-xs text-white placeholder-slate-600 outline-none focus:border-[var(--accent)]/60" />
        <input type="number" min="0" step="1" placeholder="FC máxima (bpm)" value="${esc(runDetailsDraft.max_heart_rate_bpm || '')}"
          oninput="updateRunDetail('max_heart_rate_bpm', this.value)"
          class="w-full bg-neutral-900 border border-neutral-800 rounded-xl px-3 py-2 text-xs text-white placeholder-slate-600 outline-none focus:border-[var(--accent)]/60" />
      </div>

      <div class="flex items-center justify-between mb-1.5">
        <label class="text-[11px] text-slate-500">Zonas de FC (tempo em cada zona)</label>
        <button onclick="addRunHrZone()" type="button" class="text-[11px] text-[var(--accent)] font-semibold flex items-center gap-1">
          <i data-lucide="plus" class="w-3 h-3"></i> Adicionar zona
        </button>
      </div>
      ${runHrZonesDraft.length === 0 ? `
        <p class="text-[11px] text-slate-600">Sem zonas ainda — usa "Adicionar zona" para cada uma que o relógio mostrar.</p>
      ` : runHrZonesDraft.map((z, i) => `
        <div class="flex items-center gap-1.5 mb-1.5">
          <select onchange="updateRunHrZone(${i}, 'zone', this.value)"
            class="bg-neutral-900 border border-neutral-800 rounded-xl px-2 py-2 text-xs text-white outline-none focus:border-[var(--accent)]/60">
            <option value="">Zona</option>
            ${[1,2,3,4,5].map(n => `<option value="${n}" ${String(z.zone)===String(n)?'selected':''}>Z${n}</option>`).join('')}
          </select>
          <input type="number" min="0" step="1" placeholder="Minutos" value="${esc(z.minutes)}"
            onchange="updateRunHrZone(${i}, 'minutes', this.value)"
            class="w-full bg-neutral-900 border border-neutral-800 rounded-xl px-2 py-2 text-xs text-white placeholder-slate-600 outline-none focus:border-[var(--accent)]/60" />
          <button onclick="removeRunHrZone(${i})" type="button" aria-label="Remover zona ${i+1}" class="shrink-0 text-slate-600 hover:text-red-400 p-1">
            <i data-lucide="x" class="w-3.5 h-3.5"></i>
          </button>
        </div>
      `).join('')}
    </div>
  `;
}

// Tipo de treino (Treino) ou Disciplina (Competição) — sempre escolhido pelo
// utilizador, na secção partilhada do ecrã (antes de "Analisar Corrida" ou da
// entrada manual): a IA já não infere isto a partir da foto.
function renderRunTypeSelectField(){
  if (runKind === 'competicao') {
    return `
      <div class="mb-3">
        <label class="text-[11px] text-slate-500 mb-1 block">Disciplina</label>
        <select onchange="selectRaceType(this.value)"
          class="w-full bg-neutral-900 border border-neutral-800 rounded-xl px-3 py-2 text-sm text-white outline-none focus:border-[var(--accent)]/60">
          <option value="">Escolhe a disciplina…</option>
          ${RACE_TYPES.map(t => `<option value="${t.key}" ${(runDetailsDraft.race_type||'')===t.key?'selected':''}>${t.label}</option>`).join('')}
        </select>
      </div>
    `;
  }
  return `
    <div class="mb-1.5">
      <label class="text-[11px] text-slate-500 mb-1 block">Tipo de treino</label>
      <select id="runTrainingTypeSelect" onchange="selectRunTrainingType(this.value)"
        class="w-full bg-neutral-900 border ${runFieldBorderClass('trainingType')} rounded-xl px-3 py-2 text-sm text-white outline-none focus:border-[var(--accent)]/60">
        <option value="">Escolhe o tipo…</option>
        ${[...new Set(RUN_TRAINING_TYPES.map(t => t.group))].map(g => `
          <optgroup label="${g}">
            ${RUN_TRAINING_TYPES.filter(t => t.group === g).map(t => `<option value="${t.key}" ${runTrainingType===t.key?'selected':''}>${t.label}</option>`).join('')}
          </optgroup>
        `).join('')}
      </select>
      ${runFieldErrorMsg('trainingType')}
    </div>
    <p class="text-[10px] text-slate-600 mb-3">A maioria das corridas é "Contínuo" — só muda se for um treino estruturado.</p>
  `;
}

// Campos específicos de cada tipo/disciplina — usados na entrada manual e no
// ecrã de edição (a estrutura da sessão, tempo oficial, etc., continuam a ser
// preenchidos à mão; o tipo/disciplina em si já não está aqui, ver
// renderRunTypeSelectField).
function renderRunTypeDetailFields(){
  return `
    ${renderRunWatchMetricsFields()}
    ${runKind === 'treino' ? `
      ${RUN_REPEAT_TRAINING_TYPES.has(runTrainingType) ? `
        <div class="rounded-xl border border-neutral-800 bg-neutral-900/40 p-3 mb-3">
          <p class="text-[11px] font-semibold text-slate-400 mb-2">Estrutura da sessão</p>
          <div class="grid grid-cols-2 gap-2 mb-3">
            ${RUN_REPEAT_DETAIL_FIELDS.map(f => `
              <div>
                <label class="text-[10px] text-slate-500 mb-1 block">${f.label}</label>
                <input type="number" min="0" step="${f.step}" value="${esc(runDetailsDraft[f.key] || '')}"
                  oninput="updateRunDetail('${f.key}', this.value)"
                  class="w-full bg-neutral-900 border border-neutral-800 rounded-xl px-3 py-2 text-xs text-white placeholder-slate-600 outline-none focus:border-[var(--accent)]/60" />
              </div>
            `).join('')}
          </div>

          <div class="flex items-center justify-between mb-1.5">
            <label class="text-[11px] text-slate-500">Splits (cada volta com distância e tempo)</label>
            <button onclick="addRunSplit()" type="button" class="text-[11px] text-[var(--accent)] font-semibold flex items-center gap-1">
              <i data-lucide="plus" class="w-3 h-3"></i> Adicionar split
            </button>
          </div>
          ${runSplitsDraft.length === 0 ? `
            <p class="text-[11px] text-slate-600">Sem splits ainda — usa "Adicionar split" para cada volta, ou deixa em branco se só quiseres o total.</p>
          ` : runSplitsDraft.map((s, i) => `
            <div class="flex items-center gap-1.5 mb-1.5">

// Agrega as métricas do relógio (details) das corridas do período — só entram
// no cálculo as corridas que efetivamente têm cada campo, para não puxar
// médias para baixo com corridas sem essa informação.
function runWatchMetricsSummary(periodRuns){
  const withDetails = periodRuns.filter(r => r.details);
  const numsFrom = (key) => withDetails
    .map(r => Number(r.details[key]))
    .filter(n => Number.isFinite(n) && n > 0);

  const elevation = numsFrom('elevation_gain_m');
  const calories = numsFrom('calories_kcal');
  const cadence = numsFrom('cadence_spm');
  const avgHr = numsFrom('avg_heart_rate_bpm');
  const maxHr = numsFrom('max_heart_rate_bpm');

  const vo2Runs = withDetails
    .filter(r => Number(r.details.vo2_max) > 0)
    .sort((a, b) => b.date.localeCompare(a.date) || (b.created_at || '').localeCompare(a.created_at || ''));

  const zoneMinutes = [0, 0, 0, 0, 0]; // índice 0 = Zona 1
  withDetails.forEach(r => {
    (r.details.hr_zones || []).forEach(z => {
      const zone = Number(z.zone), minutes = Number(z.minutes);
      if (zone >= 1 && zone <= 5 && Number.isFinite(minutes) && minutes > 0) zoneMinutes[zone - 1] += minutes;
    });
  });
  const zoneTotal = zoneMinutes.reduce((a, b) => a + b, 0);

  return {
    totalElevation: elevation.reduce((a, b) => a + b, 0),
    totalCalories: calories.reduce((a, b) => a + b, 0),
    avgCadence: cadence.length ? cadence.reduce((a, b) => a + b, 0) / cadence.length : null,
    avgHr: avgHr.length ? avgHr.reduce((a, b) => a + b, 0) / avgHr.length : null,
    maxHr: maxHr.length ? Math.max(...maxHr) : null,
    latestVo2: vo2Runs.length ? Number(vo2Runs[0].details.vo2_max) : null,
    zoneMinutes, zoneTotal,
  };
}

// Cartões extra do Dashboard, um por família de métrica do relógio — só
// aparecem quando há pelo menos uma corrida no período com esse dado (o
// utilizador pode nunca ter usado relógio, ou só nalgumas corridas).
function renderRunWatchMetricsDashboard(periodRuns){

    cards.push(`

          </div>
        </div>
      </div>
    `);
  }

  if (m.avgHr != null || m.maxHr != null || m.zoneTotal > 0) {

    cards.push(`
      <div class="card rounded-2xl p-3.5">
        <h2 class="text-[11px] font-semibold text-slate-300 mb-2.5 flex items-center gap-1.5">
          <i data-lucide="heart-pulse" class="w-3.5 h-3.5 text-slate-500"></i> Frequência cardíaca
        </h2>
        <div class="grid grid-cols-2 gap-2 text-center mb-3">
          <div>
            <p class="text-base font-extrabold text-white leading-none">${m.avgHr != null ? Math.round(m.avgHr) : '—'}</p>
            <p class="text-[10px] text-slate-500 mt-1">FC média (bpm)</p>

            <p class="text-base font-extrabold text-white leading-none">${m.maxHr != null ? Math.round(m.maxHr) : '—'}</p>
            <p class="text-[10px] text-slate-500 mt-1">FC máxima (bpm)</p>
          </div>
        </div>
        ${m.zoneTotal > 0 ? `
          <div class="space-y-1.5">
            ${zoneLabels.map((label, i) => `
              <div class="flex items-center gap-2">
                <span class="text-[10px] text-slate-500 w-5 shrink-0">${label}</span>
                <div class="flex-1">${gaugeBar((m.zoneMinutes[i] / m.zoneTotal) * 100, { color: 'var(--mod-corrida-from)' })}</div>
                <span class="text-[10px] text-slate-500 w-10 text-right shrink-0">${Math.round(m.zoneMinutes[i])} min</span>
              </div>
            `).join('')}
          </div>
        ` : ''}
      </div>
    `);
  }

  if (m.latestVo2 != null) {
    cards.push(`
      <div class="card rounded-2xl p-3.5 flex items-center justify-between">
        <div class="flex items-center gap-2">
          <i data-lucide="gauge" class="w-4 h-4 text-slate-500"></i>

            <p class="text-[11px] font-semibold text-slate-300">VO2 máx</p>

          </div>

        <p class="text-lg font-extrabold text-white leading-none">${m.latestVo2.toFixed(1)}</p>
      </div>
    `);
  }

  return cards.join('');
}

function renderCorridaCharts(){
  Chart.defaults.color = theme === 'light' ? '#475569' : '#a1a1aa';
  const gridColor = theme === 'light' ? 'rgba(154,116,74,0.45)' : 'rgba(232,163,66,0.3)';
  const { start, end } = corridaRangeBounds(corridaRange);

  if (corridaCharts.dist) { corridaCharts.dist.destroy(); corridaCharts.dist = null; }
  const canvas = document.getElementById('corridaDistChart');
  if (canvas) {
    const byDay = {};
    for (let d = new Date(start); d.toISOString().slice(0,10) <= end; d.setDate(d.getDate()+1)) byDay[d.toISOString().slice(0,10)] = 0;
    runs.forEach(r => { if (r.date >= start && r.date <= end) byDay[r.date] = (byDay[r.date] || 0) + Number(r.distance_km || 0); });
    const days = Object.keys(byDay).sort();
    corridaCharts.dist = new Chart(canvas, {
      data: {
        labels: days.map(d => d.slice(8,10) + '/' + d.slice(5,7)),
        datasets: [{ type:'bar', label:'Distância (km)', data: days.map(d => byDay[d]), backgroundColor: hexToRgba(cssVar('--mod-corrida-to'), 0.6), borderRadius:4 }]
      },
      options: {
        responsive:true,
        plugins:{ legend:{ display:false } },
        scales:{ y:{ beginAtZero:true, grid:{ color:gridColor } }, x:{ grid:{ display:false } } }
      }
    });
  }
}

async function onRunPhotoSelected(input){
  const files = Array.from(input.files || []);
  input.value = '';
  if (!files.length) return;
  const remaining = MAX_PHOTOS - runPhotos.length;
  if (remaining <= 0) { showToast('error', null, `Máximo de ${MAX_PHOTOS} imagens.`); return; }
  for (const file of files.slice(0, remaining)) {
    try { runPhotos.push(await compressImage(file)); }
    catch(e) { console.warn('Falha a processar imagem', e); }
  }
  refreshCorridaRegistar();
}
function removeRunPhoto(index){ runPhotos.splice(index, 1); refreshCorridaRegistar(); }
function clearRunPhotos(){ runPhotos = []; refreshCorridaRegistar(); }

async function analyzeRun(){
  if (!runPhotos.length || analyzingRun) return;
  const errors = {};
  if (runKind === 'treino' && !runTrainingType) errors.trainingType = 'Escolhe o tipo de treino.';
  if (runKind === 'competicao' && !runDetailsDraft.race_type) errors.trainingType = 'Escolhe a disciplina.';
  if (!runNameDraft.trim()) errors.name = 'Preenche o nome da corrida.';
  if (Object.keys(errors).length) {
    runFieldErrors = errors;
    refreshCorridaRegistar();
    focusRunField(errors.trainingType ? 'runTrainingTypeSelect' : 'runName');
    return;
  }
  const date = runDate || todayISO();
  analyzingRun = true;
  refreshCorridaRegistar();
  try {
    const { data, error } = await sb.functions.invoke('analyze-run', {
      body: {
        images: runPhotos.map(p => p.base64), mime_type: 'image/jpeg', date,
        kind: runKind, name: runNameDraft.trim(), name_is_auto: runNameAutoSuggested,
        period_label: periodOfDayLabel(), effort_rpe: runEffortDraft || null,
        training_type: runKind === 'treino' ? runTrainingType : null,
        race_type: runKind === 'competicao' ? (runDetailsDraft.race_type || null) : null,
      },
    });
    if (error) throw new Error(await edgeFunctionErrorMessage(error, 'Falha na análise.'));
    if (data && data.error) throw new Error(data.error);

    const run = data.run;
    runs.unshift(run);
    runs.sort((a,b) => b.date.localeCompare(a.date) || (b.created_at||'').localeCompare(a.created_at||''));
    runPhotos = [];
    runNameAutoSuggested = true;
    runNameDraft = suggestedRunName();
    runEffortDraft = null;
    expandedRunId = run.id;
    showToast('success', 'Corrida registada', `${formatDatePT(run.date)} · a IA leu os dados do print`,
      { actionLabel: 'Ver no Calendário', actionOnclick: `viewInCorridaCalendar('${run.date}')` });
    logEvent('success', 'run_analysis', null, { date: run.date, ...(data.usage || {}) });
    corridaTab = 'calendario';
    corridaCalendarSelectedDate = run.date;
  } catch(e) {
    console.error(e);
    showToast('error', null, aiErrorMessage(e, 'Falha na análise. Tenta novamente.'));
    logEvent('error', 'run_analysis', e.message || 'erro desconhecido');
  }
  analyzingRun = false;
  render();
}

async function reanalyzeRun(id){
  if (reanalyzingRunId) return;
  const r = runs.find(x => x.id === id);
  if (!r) return;
  reanalyzingRunId = id;
  refreshCorridaRegistar();
  try {
    const { data, error } = await sb.functions.invoke('analyze-run', {
      body: { run_id: id, notes: r.notes || null },

    showToast('success', 'Corrida reanalisada', null);
