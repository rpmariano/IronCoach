<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=0">
  <title>IronCoach</title>
  
  <meta name="theme-color" content="#0b1120">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="icon" type="image/png" sizes="64x64" href="/favicon.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png">
  <link rel="manifest" href="/manifest.json">
  <meta property="og:title" content="IronCoach">
  <meta property="og:description" content="A tua treinadora com IA — corrida, ginásio, nutrição e provas.">
  <meta property="og:image" content="https://rpmariano.github.io/IronCoach/brand/og.png">
  <meta name="twitter:card" content="summary_large_image">
  <!-- O logo de arranque, desenhado (pedido de produto 2026-09-24): vive
       aqui, no HTML, para começar a desenhar-se no primeiro instante em que
       o Android entrega o ecrã — antes de o JavaScript chegar. A app adota-o
       (utils/logoIntro.js, adoptBootSplash) em vez de o recomeçar, e tira-o
       quando o desenho acabou e os dados chegaram. É o mesmo desenho do
       shared/LogoLoader e do FullScreenLoader do App.jsx, com os mesmos
       tempos das regras .logo-loader-* do globals.css: mudar lá é mudar
       aqui. O ecrã de abertura do próprio Android (o ícone parado sobre o
       fundo) é do sistema e não se desliga daqui; isto só o encurta ao
       mínimo e acaba com o intervalo escuro que vinha a seguir. -->
  <style>
    html, body { background: #0b1120; margin: 0; }
    #boot-splash {
      position: fixed; inset: 0; z-index: 2147483000;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px;
      background: #0b1120; color: #f8fafc;
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
      transition: opacity 260ms cubic-bezier(.16, 1, .3, 1);
    }
    #boot-splash.bs-out { opacity: 0; pointer-events: none; }
    #boot-splash svg { overflow: visible; transform-origin: center; animation: bsPop 520ms cubic-bezier(.34, 1.56, .64, 1) 1480ms both; }
    .bs-line { stroke-dasharray: 1; stroke-dashoffset: 1; }
    .bs-hex    { animation: bsDraw 720ms cubic-bezier(.65, 0, .35, 1) 0ms forwards; }
    .bs-hex-in { animation: bsDraw 620ms cubic-bezier(.65, 0, .35, 1) 260ms forwards; }
    .bs-chev-ouro  { animation: bsDraw 480ms cubic-bezier(.65, 0, .35, 1) 640ms forwards; }
    .bs-chev-ciano { animation: bsDraw 480ms cubic-bezier(.65, 0, .35, 1) 880ms forwards; }
    .bs-fill { opacity: 0; }
    .bs-fill-ouro  { animation: bsFill 320ms cubic-bezier(.16, 1, .3, 1) 1240ms forwards; }
    .bs-fill-ciano { animation: bsFill 320ms cubic-bezier(.16, 1, .3, 1) 1360ms forwards; }
    .bs-aura { opacity: 0; animation: bsFlash 700ms cubic-bezier(.16, 1, .3, 1) 1520ms forwards, bsBreathe 2600ms ease-in-out 2220ms infinite; }
    .bs-name { font-size: 30px; font-weight: 900; letter-spacing: .14em; padding-left: .14em; line-height: 1; animation: bsRise 520ms cubic-bezier(.16, 1, .3, 1) 1500ms both; }
    .bs-name span { background: linear-gradient(135deg, #a5f3fc, #22d3ee 45%, #0891b2); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .bs-tag { margin-top: -12px; font-size: 10.5px; font-weight: 800; letter-spacing: .62em; padding-left: .62em; line-height: 1; color: #fbbf24; animation: bsRise 520ms cubic-bezier(.16, 1, .3, 1) 1750ms both; }
    @keyframes bsDraw { to { stroke-dashoffset: 0; } }
    @keyframes bsFill { to { opacity: 1; } }
    @keyframes bsFlash { 0% { opacity: 0; } 45% { opacity: .75; } 100% { opacity: .32; } }
    @keyframes bsBreathe { 0%, 100% { opacity: .32; } 50% { opacity: .55; } }
    @keyframes bsPop { 0% { transform: scale(1); } 40% { transform: scale(1.045); } 100% { transform: scale(1); } }
    @keyframes bsRise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    @media (prefers-reduced-motion: reduce) {
      #boot-splash svg, .bs-hex, .bs-hex-in, .bs-chev-ouro, .bs-chev-ciano, .bs-fill-ouro, .bs-fill-ciano, .bs-aura, .bs-name, .bs-tag { animation: none; }
      .bs-line { stroke-dashoffset: 0; }
      .bs-fill { opacity: 1; }
      .bs-aura { opacity: .32; }
    }
  </style>
</head>
<body>
  <div id="boot-splash" role="status" aria-label="A carregar">
    <svg viewBox="0 0 512 512" width="112" height="112" aria-hidden="true">
      <defs>
        <linearGradient id="bs-ouro" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#fde68a"/><stop offset="50%" stop-color="#fbbf24"/><stop offset="100%" stop-color="#d97706"/></linearGradient>
        <linearGradient id="bs-ciano" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#a5f3fc"/><stop offset="45%" stop-color="#22d3ee"/><stop offset="100%" stop-color="#0891b2"/></linearGradient>
        <filter id="bs-brilho" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="14" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
      </defs>
      <g transform="translate(256 256)">
        <polygon class="bs-aura" points="0,-170 148,-85 148,85 0,170 -148,85 -148,-85" fill="none" stroke="#22d3ee" stroke-width="22" stroke-linejoin="round" filter="url(#bs-brilho)"/>
        <polygon class="bs-line bs-hex" pathLength="1" points="0,-170 148,-85 148,85 0,170 -148,85 -148,-85" fill="none" stroke="#94a3b8" stroke-width="8" stroke-linejoin="round"/>
        <polygon class="bs-line bs-hex-in" pathLength="1" points="0,-154 130,-73 130,73 0,154 -130,73 -130,-73" fill="none" stroke="#fbbf24" stroke-opacity=".65" stroke-width="3" stroke-linejoin="round"/>
        <path class="bs-fill bs-fill-ouro" d="M -84,-78 L -18,0 L -84,78 L -48,78 L 18,0 L -48,-78 Z" fill="url(#bs-ouro)"/>
        <path class="bs-fill bs-fill-ciano" d="M -18,-78 L 48,0 L -18,78 L 18,78 L 84,0 L 18,-78 Z" fill="url(#bs-ciano)"/>
        <path class="bs-line bs-chev-ouro" pathLength="1" d="M -84,-78 L -18,0 L -84,78 L -48,78 L 18,0 L -48,-78 Z" fill="none" stroke="#fbbf24" stroke-width="6" stroke-linejoin="round"/>
        <path class="bs-line bs-chev-ciano" pathLength="1" d="M -18,-78 L 48,0 L -18,78 L 18,78 L 84,0 L 18,-78 Z" fill="none" stroke="#22d3ee" stroke-width="6" stroke-linejoin="round"/>
      </g>
    </svg>
    <div class="bs-name" aria-hidden="true">IRON<span>COACH</span></div>
    <div class="bs-tag" aria-hidden="true">AI-POWERED</div>
  </div>
  <script>
    // A hora a que o desenho começou — a app conta o que falta a partir daqui.
    window.__bootSplashAt = performance.now();
    // Rede de segurança: se a app nunca chegar a adotá-lo (o JavaScript não
    // carregou), o logo não fica no ecrã para sempre.
    setTimeout(function () {
      if (window.__bootSplashAdopted) return;
      var el = document.getElementById('boot-splash');
      if (el) el.parentNode.removeChild(el);
    }, 30000);
  </script>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
