// Espelha loadGymSessionPhotoUrls — bucket run-photos.
async function loadRunPhotoUrls(id){
  const r = runs.find(x => x.id === id);
  const allPaths = (r && r.photo_paths) || [];
  const paths = allPaths.filter(p => !signedUrlCache[p]);
  if (!paths.length) return;
  paths.forEach(p => { delete signedUrlFailed[p]; });
  try {
    const { data, error } = await sb.storage.from('run-photos').createSignedUrls(paths, 3600);
    if (error) throw error;
    const returned = new Set();
    (data || []).forEach(d => {
      if (d.signedUrl && d.path) { signedUrlCache[d.path] = d.signedUrl; returned.add(d.path); }
    });
    paths.forEach(p => { if (!returned.has(p)) signedUrlFailed[p] = true; });
  } catch(e) {
    console.warn('signed urls', e);
    paths.forEach(p => { signedUrlFailed[p] = true; });
  }
  if (expandedRunId === id) refreshCorridaCalendarDaySessions();
}

async function submitNewRun(){
  if (savingRun) return;
  const date = runDate;
  const distance = Number(runDistanceDraft);
  const durationSecondsParsed = parseDurationToSeconds(runDurationDraft);
  const hasDistance = distance > 0;
  const hasDuration = durationSecondsParsed != null && durationSecondsParsed > 0;

  // Treinos "normais" continuam a exigir distância+duração; treinos por
  // repetição (Intervalos/Subidas) e competição toleram ficar só com os
  // campos dinâmicos preenchidos (ex.: uma sessão de intervalos pode não ter
  // uma distância total única; uma competição já tem o tempo oficial).
  const needsDistanceDuration = runKind === 'treino' && !RUN_REPEAT_TRAINING_TYPES.has(runTrainingType);
  const errors = {};
  if (!date) errors.date = 'Preenche a data.';
  if (needsDistanceDuration && !hasDistance) errors.distance = 'Preenche a distância.';
  else if (runDistanceDraft.trim() && !hasDistance) errors.distance = 'Distância inválida.';
  if (needsDistanceDuration && !hasDuration) errors.duration = 'Preenche a duração.';
  else if (runDurationDraft.trim() && !hasDuration) errors.duration = 'Duração inválida.';
  if (runKind === 'treino' && !runTrainingType) errors.trainingType = 'Escolhe o tipo de treino.';
  if (!runNameDraft.trim()) errors.name = 'Preenche o nome da corrida.';

  runFieldErrors = errors;
  if (Object.keys(errors).length) {
    refreshCorridaRegistar();
    const order = ['date', 'trainingType', 'distance', 'duration', 'name'];
    const idMap = { date:'runDate', trainingType:'runTrainingTypeSelect', distance:'runDistance', duration:'runDuration', name:'runName' };
    focusRunField(idMap[order.find(k => errors[k])]);
    return;
  }

  savingRun = true;
  render();

  try {
    const { data, error } = await sb.from('runs').insert({
      user_id: currentUser.id, date,
      distance_km: hasDistance ? distance : null,
      duration_seconds: hasDuration ? durationSecondsParsed : null,
      name: runNameDraft.trim(),
      kind: runKind,
      training_type: runKind === 'treino' ? runTrainingType : null,
      details: buildRunDetailsPayload(),
      effort_rpe: runEffortDraft || null,
    }).select().single();
    if (error) throw error;
    runs.unshift(data);
    runs.sort((a, b) => b.date.localeCompare(a.date) || (b.created_at || '').localeCompare(a.created_at || ''));
    runDate = todayISO();
    runKind = 'treino';
    runTrainingType = 'continuo';
    runDetailsDraft = {};
    runHrZonesDraft = [];
    runDistanceDraft = '';
    runDurationDraft = '';
    runSplitsDraft = [];
    runEffortDraft = null;
    runNameAutoSuggested = true;
    runNameDraft = suggestedRunName();
    showToast('success', 'Corrida registada', null,
      { actionLabel: 'Ver no Calendário', actionOnclick: `viewInCorridaCalendar('${data.date}')` });
    corridaTab = 'dashboard';
  } catch (e) {
    console.error(e);
    showToast('error', null, 'Falha a gravar a corrida. Tenta novamente.');
  }
  savingRun = false;
  render();
}

// Edição de uma corrida já existente (manual ou vinda de IA) — acedida a
// partir do Calendário/cartão expandido. Reaproveita o estado/formulário da
// entrada manual, pré-preenchido; grava com UPDATE direto (não volta a
// chamar a IA — para isso já existe "Reanalisar").
function openEditRun(id){
  const r = runs.find(x => x.id === id);
  if (!r) return;
  const d = r.details || {};
  editingRunId = id;
  runFieldErrors = {};
  runDate = r.date;
  runKind = r.kind === 'competicao' ? 'competicao' : 'treino';
  runTrainingType = runKind === 'treino' ? (r.training_type || 'continuo') : null;
  runDetailsDraft = {
    warmup_minutes: d.warmup_minutes || '',
    recovery_seconds: d.recovery_seconds || '',
    race_type: d.race_type || '',
    official_time_minutes: d.official_time_seconds ? formatDuration(d.official_time_seconds) : '',
    position: d.position || '',
    elevation_gain_m: d.elevation_gain_m || '',
    cadence_spm: d.cadence_spm || '',
    calories_kcal: d.calories_kcal || '',
    avg_heart_rate_bpm: d.avg_heart_rate_bpm || '',
    max_heart_rate_bpm: d.max_heart_rate_bpm || '',
    vo2_max: d.vo2_max || '',
  };
  runSplitsDraft = (d.splits || []).map(s => ({
    distance_km: s.distance_km || '',
    minutes: s.time_seconds ? formatDuration(s.time_seconds) : '',
  }));
  runHrZonesDraft = (d.hr_zones || []).map(z => ({ zone: z.zone || '', minutes: z.minutes || '' }));
  runDistanceDraft = r.distance_km != null ? String(r.distance_km) : '';
  runDurationDraft = r.duration_seconds != null ? formatDuration(r.duration_seconds) : '';
  runNameDraft = r.name || suggestedRunName();
  // Só marca como "sugestão automática" (continua a atualizar-se e mostra o
  // aviso) quando o nome foi mesmo inventado agora — um nome já gravado pelo
  // utilizador nunca deve parecer/comportar-se como um palpite.
  runNameAutoSuggested = !r.name;
  runEffortDraft = r.effort_rpe || null;
  corridaTab = 'registar';
  render();
  pushNavState();
}

function openDeleteRunModal(id){

    () => deleteRun(id));
}
async function deleteRun(id){
  const idx = runs.findIndex(r => r.id === id);
  if (idx === -1) return;
  const [removed] = runs.splice(idx, 1);
  if (expandedRunId === id) expandedRunId = null;
  render();
  try {
    if (removed.photo_paths && removed.photo_paths.length) await sb.storage.from('run-photos').remove(removed.photo_paths);
    const { error } = await sb.from('runs').delete().eq('id', id);
    if (error) throw error;
  } catch (e) {
    runs.splice(idx, 0, removed);
    flashSyncError(e);
  }
}

async function submitRaceEvent(){
  const date = raceEventDraft.date;
  const name = (raceEventDraft.name || '').trim();
  const raceType = raceEventDraft.race_type;
  if (!date || !name || !raceType) {
    showToast('error', null, 'Preenche pelo menos a data, o nome e o tipo da prova.');
    return;
  }
  const payload = {
    date, name, race_type: raceType,
    location: (raceEventDraft.location || '').trim() || null,
    equipment: (raceEventDraft.equipment || '').trim() || null,
    target_time: (raceEventDraft.target_time || '').trim() || null,
    notes: (raceEventDraft.notes || '').trim() || null,
  };
  try {
    if (editingRaceEventId) {
      const { data, error } = await sb.from('race_events').update(payload).eq('id', editingRaceEventId).select().single();
      if (error) throw error;
      const idx = raceEvents.findIndex(e => e.id === editingRaceEventId);
      if (idx !== -1) raceEvents[idx] = data;
    } else {
      const { data, error } = await sb.from('race_events')
        .insert({ user_id: currentUser.id, status: 'agendada', ...payload }).select().single();
      if (error) throw error;
      raceEvents.push(data);
    }
    raceEvents.sort((a, b) => a.date.localeCompare(b.date));
    showToast('success', editingRaceEventId ? 'Prova atualizada' : 'Prova adicionada à agenda', null);
    closeRaceEventForm();
  } catch(e) {
    console.error(e);
    showToast('error', null, 'Falha a gravar a prova. Tenta novamente.');
  }
}

async function toggleRaceEventStatus(id){
  const ev = findRaceEventById(id);
  if (!ev) return;
  const newStatus = ev.status === 'concluida' ? 'agendada' : 'concluida';
  ev.status = newStatus;
  refreshCorridaAgenda();
  try {
    const { error } = await sb.from('race_events').update({ status: newStatus }).eq('id', id);
    if (error) throw error;
  } catch(e) {
    ev.status = newStatus === 'concluida' ? 'agendada' : 'concluida';
    flashSyncError(e);
  }
}

function openDeleteRaceEventModal(id){
  const ev = findRaceEventById(id);
  if (!ev) return;
  openConfirmDeleteModal(`Eliminar ${ev.name || 'prova'}?`,
    'Esta ação remove permanentemente a prova da agenda. Não pode ser desfeita.',
    () => deleteRaceEvent(id));
}
async function deleteRaceEvent(id){
  const idx = raceEvents.findIndex(e => e.id === id);
  if (idx === -1) return;
  const [removed] = raceEvents.splice(idx, 1);
  refreshCorridaAgenda();
  try {
    const { error } = await sb.from('race_events').delete().eq('id', id);
    if (error) throw error;
  } catch(e) {
    raceEvents.splice(idx, 0, removed);
    flashSyncError(e);
  }
}

/* ============================= AVALIAÇÃO CORPORAL (vertical "Corpo") ============================= */
function findAssessmentById(id){ return bodyAssessments.find(a => a.id === id) || null; }

// Avaliação imediatamente anterior (mais antiga) a `a`, para comparar valores.
// bodyAssessments está ordenada por data desc, logo a anterior está a seguir.
function previousAssessment(a){
  const idx = bodyAssessments.findIndex(x => x.id === a.id);
  return (idx === -1) ? null : (bodyAssessments[idx + 1] || null);
}

function fmtMetric(m, v){
  if (v === null || v === undefined || v === '') return '—';
  const n = Number(v);
  if (!isFinite(n)) return '—';
  return n.toFixed(m.dec) + (m.unit ? ' ' + m.unit : '');
}

// Cor do delta consoante o sentido saudável da métrica (BODY_METRICS.good).
// Usado como fallback quando não há objetivo definido para a métrica.
function deltaClass(m, delta){
  if (!delta || m.good === null) return 'text-slate-400';
  const improving = m.good === 'up' ? delta > 0 : delta < 0;
  return improving ? 'text-emerald-400' : 'text-red-400';
}

// Objetivo do utilizador para uma métrica do Corpo (ou null se não definido).
function bodyGoal(m){
  const v = state.profile ? state.profile['goal_' + m.key] : null;
  return (v === null || v === undefined || v === '') ? null : Number(v);
}

// Cor da seta de evolução entre duas leituras. Com objetivo definido: compara
// a distância ao objetivo antes/depois — aproximar = verde, afastar =
// vermelho, mesma distância = neutro. Sem objetivo, cai no sentido genérico
// saudável da métrica (BODY_METRICS.good), como antes.
// Nota: a direção da seta (▲/▼) reflete sempre o sinal real da variação —
// só a COR depende de estar a aproximar-se ou a afastar-se do objetivo.
function deltaTrendClass(m, prevValue, latestValue){
  if (prevValue === null || prevValue === undefined || latestValue === null || latestValue === undefined) {
    return 'text-slate-400';
  }
  const goal = bodyGoal(m);
  const delta = Number(latestValue) - Number(prevValue);
  if (goal !== null) {
    const distPrev = Math.abs(Number(prevValue) - goal);
    const distLatest = Math.abs(Number(latestValue) - goal);
    if (distLatest < distPrev) return 'text-emerald-400';
    if (distLatest > distPrev) return 'text-red-400';
    return 'text-slate-400';
  }
  return deltaClass(m, delta);
}

// Seta de tendência (▲/▼) + diferença entre parêntesis com sinal, ambas na
// cor goal-aware de deltaTrendClass (ex.: "▲ (+0.5 kg)"). Devolve '' se não
// houver duas leituras comparáveis ou a diferença for irrelevante.
function deltaArrowLabel(m, prevValue, latestValue, sizeClass){
  if (prevValue === null || prevValue === undefined || latestValue === null || latestValue === undefined) return '';
  const d = Number(latestValue) - Number(prevValue);
  const threshold = m.dec === 0 ? 1 : 0.05;
  if (Math.abs(d) < threshold) return '';
  const cls = deltaTrendClass(m, prevValue, latestValue);
  const sign = d > 0 ? '+' : '-';
  const unit = m.unit ? ' ' + m.unit : '';
  return `<span class="font-semibold ${cls} ${sizeClass || ''}">${d > 0 ? '▲' : '▼'} (${sign}${Math.abs(d).toFixed(m.dec)}${unit})</span>`;
}

// Classes do badge para a etiqueta de estado que a Renpho mostra por métrica.
// Verde = dentro do normal; âmbar = ligeiramente fora / atenção; vermelho =
// muito fora. A cor sai das palavras da etiqueta (sem acentos), não da métrica.
function classificationStyle(label){
  const t = String(label).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
  if (/(muito|obesid|obeso|perigos|critico|grave|severo)/.test(t))
    return 'bg-red-500/15 text-red-400 border-red-500/40';
  if (/(alto|baixo|elevado|acima|abaixo|insuficiente|sobrepeso|ligeir|magro|excesso|reduzid)/.test(t))
    return 'bg-amber-500/15 text-amber-400 border-amber-500/40';
  if (/(normal|media|medio|padr|saudav|otim|excelente|ideal|\bbom\b|\bboa\b|adequ)/.test(t))
    return 'bg-emerald-500/10 text-emerald-400 border-emerald-500/30';
  return 'bg-neutral-800 text-slate-400 border-neutral-700';
}

// Pequeno badge com a classificação Renpho (ou '' se não existir).
function classificationBadge(assessment, key, extra){
  const label = assessment && assessment.classifications ? assessment.classifications[key] : null;
  if (!label) return '';
  return `<span class="text-[10px] font-semibold px-1.5 py-0.5 rounded-full border shrink-0 ${classificationStyle(label)} ${extra || ''}">${esc(label)}</span>`;
}

// espelhando refreshDashboard da Nutrição.

  if (!main) return;
  main.innerHTML = renderBodyTabContent();
  if (window.lucide) lucide.createIcons();
  if (bodyTab === 'dashboard') requestAnimationFrame(renderBodyChart);

// Rascunho da Nova Avaliação (fotos+data+notas) — só antes de a IA/registo
// manual criar a avaliação em si (manualAssessmentId). Mesma lógica do
// rascunho da Nutrição/Ginásio (ver saveMealDraft/saveGymDraft).
function saveBodyDraft(){
  if (manualAssessmentId) return;
  const isEmpty = !bodyPhotos.length && !bodyNotes.trim() && bodyDate === todayISO();
  if (isEmpty) { clearDraft('body'); return; }
  saveDraft('body', { bodyPhotos, bodyDate, bodyNotes });
}
function restoreBodyDraftIfAny(){
  if (manualAssessmentId) return;
  const d = loadDraft('body');
  if (!d || (!d.bodyPhotos?.length && !(d.bodyNotes||'').trim())) return;
  bodyPhotos = d.bodyPhotos || [];
  bodyDate = d.bodyDate || todayISO();
  bodyNotes = d.bodyNotes || '';
  showToast('success', 'Rascunho recuperado', 'Continuámos a avaliação que tinhas a meio.',
    { actionLabel: 'Descartar', actionOnclick: 'discardBodyDraft()' });
}
function discardBodyDraft(){
  bodyPhotos = [];
  bodyDate = todayISO();
  bodyNotes = '';
  clearDraft('body');
  if (activeVertical === 'corpo' && bodyTab === 'avaliar') refreshBody();
}

async function onBodyPhotoSelected(input){
  const files = Array.from(input.files || []);
  input.value = '';
  if (!files.length) return;
  const remaining = MAX_PHOTOS - bodyPhotos.length;
  if (remaining <= 0) { showToast('error', null, `Máximo de ${MAX_PHOTOS} imagens.`); return; }
  for (const file of files.slice(0, remaining)) {
    try { bodyPhotos.push(await compressImage(file)); }
    catch(e) { console.warn('Falha a processar imagem', e); }
  }
  refreshBody();
}

function removeBodyPhoto(index){ bodyPhotos.splice(index, 1); refreshBody(); }
function clearBodyPhotos(){ bodyPhotos = []; refreshBody(); }
function updateBodyNotes(value){ bodyNotes = value; saveBodyDraft(); }

async function analyzeBody(){
  if (!bodyPhotos.length || analyzingBody) return;
  const date = document.getElementById('bodyDate').value || todayISO();
  analyzingBody = true;
  refreshBody();
  try {
    const { data, error } = await sb.functions.invoke('analyze-body', {
      body: { images: bodyPhotos.map(p => p.base64), mime_type: 'image/jpeg', date, notes: bodyNotes || null },
    });
    if (error) throw new Error(await edgeFunctionErrorMessage(error, 'Falha na análise.'));
    if (data && data.error) throw new Error(data.error);

    const assessment = data.assessment;
    bodyAssessments.unshift(assessment);
    bodyAssessments.sort((a,b) => b.date.localeCompare(a.date) || (b.created_at||'').localeCompare(a.created_at||''));
    bodyPhotos = [];
    bodyNotes = '';
    clearDraft('body');
    expandedAssessmentId = assessment.id;
    showToast('success', 'Avaliação registada', `${formatDatePT(assessment.date)} · a IA leu e comentou os valores`,
      { actionLabel: 'Ver no Calendário', actionOnclick: `viewInBodyCalendar('${assessment.date}')` });
    logEvent('success', 'body_analysis', null, { date: assessment.date, ...(data.usage || {}) });
    bodyTab = 'dashboard';
  } catch(e) {
    console.error(e);
    showToast('error', null, aiErrorMessage(e, 'Falha na análise. Tenta novamente.'));
    logEvent('error', 'body_analysis', e.message || 'erro desconhecido');
  }
  analyzingBody = false;
  render();
}

async function reanalyzeBody(id){
  if (reanalyzingAssessmentId) return;
  const a = findAssessmentById(id);
  if (!a) return;
  reanalyzingAssessmentId = id;
  refreshBody();
  try {
    const { data, error } = await sb.functions.invoke('analyze-body', {
      body: { assessment_id: id, notes: a.notes || null },
    });
    if (error) throw new Error(await edgeFunctionErrorMessage(error, 'Falha na reanálise.'));
    if (data && data.error) throw new Error(data.error);
    Object.assign(a, data.assessment);
    showToast('success', 'Avaliação reanalisada', null);
    logEvent('success', 'body_reanalysis', null, { date: a.date, ...(data.usage || {}) });
  } catch(e) {
    console.error(e);
    showToast('error', null, aiErrorMessage(e, 'Falha na reanálise. Tenta novamente.'));
    logEvent('error', 'body_reanalysis', e.message || 'erro desconhecido');
  }
  reanalyzingAssessmentId = null;
  refreshBody();
}

// Cria uma avaliação vazia na BD e entra em modo de construção manual — cada
// métrica grava-se sozinha ao editar (ver updateAssessmentMetric, já
// reutilizado por renderAssessmentCard), sem precisar de foto nenhuma.
// Espelha startManualMeal/startManualGymSession.
async function startManualAssessment(){
  const date = document.getElementById('bodyDate') ? document.getElementById('bodyDate').value : bodyDate;
  try {
    const { data, error } = await sb.from('body_assessments')
      .insert({ user_id: currentUser.id, date: date || todayISO(), photo_paths: [], notes: bodyNotes.trim() || null })
      .select().single();
    if (error) throw error;
    bodyAssessments.unshift(data);
    bodyAssessments.sort((a,b) => b.date.localeCompare(a.date) || (b.created_at||'').localeCompare(a.created_at||''));
    manualAssessmentId = data.id;
    expandedAssessmentId = data.id;
    bodyPhotos = [];
    bodyNotes = '';
    clearDraft('body');
  } catch(e) {
    flashSyncError(e);
  }
  refreshBody();
}

function finishManualAssessment(){
  const a = manualAssessmentId ? findAssessmentById(manualAssessmentId) : null;
  if (a) {
    const filledCount = BODY_METRICS.filter(m => a[m.key] !== null && a[m.key] !== undefined).length;
    showToast('success', 'Avaliação registada', `${formatDatePT(a.date)} · ${filledCount} valor(es)`,
      { actionLabel: 'Ver no Calendário', actionOnclick: `viewInBodyCalendar('${a.date}')` });
  }
  manualAssessmentId = null;
  expandedAssessmentId = null;
  bodyTab = 'dashboard';
  render();
}

function openDeleteBodyAssessmentModal(id){
  const a = findAssessmentById(id);
  if (!a) return;
  openConfirmDeleteModal(`Eliminar avaliação de ${formatDatePT(a.date)}?`,
    'Esta ação apaga permanentemente a avaliação corporal. Não pode ser desfeita.',
    () => deleteBodyAssessment(id));
}
async function deleteBodyAssessment(id){
  const a = findAssessmentById(id);
  if (!a) return;
  bodyAssessments = bodyAssessments.filter(x => x.id !== id);
  if (expandedAssessmentId === id) expandedAssessmentId = null;
  refreshBody();
  try {
    if (a.photo_paths && a.photo_paths.length) await sb.storage.from('body-photos').remove(a.photo_paths);
    const { error } = await sb.from('body_assessments').delete().eq('id', id);
    if (error) throw error;
  } catch(e) { flashSyncError(e); }
}

async function toggleAssessmentExpand(id){
  const opening = expandedAssessmentId !== id;
  expandedAssessmentId = opening ? id : null;
  refreshBodyCalendarDayAssessments();
  if (opening) scrollCardIntoView(`assessment-card-${id}`);
  if (expandedAssessmentId) await loadAssessmentPhotoUrls(id);
}

// Espelha loadMealPhotoUrls — isolada para poder ser re-chamada a partir do
// botão "Tentar novamente" sem duplicar o fluxo de expandir/recolher.
async function loadAssessmentPhotoUrls(id){
  const a = findAssessmentById(id);
  const allPaths = (a && a.photo_paths) || [];
  const paths = allPaths.filter(p => !signedUrlCache[p]);
  if (!paths.length) return;
  paths.forEach(p => { delete signedUrlFailed[p]; });
  try {
    const { data, error } = await sb.storage.from('body-photos').createSignedUrls(paths, 3600);
    if (error) throw error;
    const returned = new Set();
    (data || []).forEach(d => {
      if (d.signedUrl && d.path) { signedUrlCache[d.path] = d.signedUrl; returned.add(d.path); }
    });
    paths.forEach(p => { if (!returned.has(p)) signedUrlFailed[p] = true; });
  } catch(e) {
    console.warn('signed urls', e);
    paths.forEach(p => { signedUrlFailed[p] = true; });
  }
  if (expandedAssessmentId === id) refreshBodyCalendarDayAssessments();
}

async function updateAssessmentMetric(id, key, rawValue){
  const a = findAssessmentById(id);
  if (!a) return;
  const trimmed = String(rawValue).trim();
  const value = trimmed === '' ? null : Math.max(0, Number(trimmed));
  if (value !== null && !isFinite(value)) return;
  a[key] = value;
  refreshBody();
  try {
    const { error } = await sb.from('body_assessments').update({ [key]: value }).eq('id', id);
    if (error) throw error;
  } catch(e) { flashSyncError(e); }
}

      </div>`;
  }
  const m = BODY_METRICS.find(x => x.key === selectedBodyMetric) || BODY_METRICS[0];

  // Leituras da métrica selecionada, mais recente primeiro (bodyAssessments já
  // vem ordenada por data desc).
  const withVal = bodyAssessments.filter(a => a[m.key] !== null && a[m.key] !== undefined);
  const latest = withVal[0];
  const previous = withVal[1] || null;
  const goal = bodyGoal(m);

  // Seta de tendência: compara as duas leituras mais recentes. A cor indica
  // se a variação aproxima (verde) ou afasta (vermelho) do objetivo definido
  // — ou, sem objetivo, o sentido genérico saudável da métrica.
  const trendArrow = deltaArrowLabel(m, previous ? previous[m.key] : null, latest ? latest[m.key] : null, 'text-xs whitespace-nowrap');

  // Subtítulo: distância ao objetivo (se definido) ou nº de leituras.
  let subtitle;
  if (goal !== null && latest) {
    const dist = Math.abs(Number(latest[m.key]) - goal);
    subtitle = dist < (m.dec === 0 ? 1 : 0.05)
      ? `<span class="text-[11px] text-emerald-400 font-semibold">Objetivo atingido</span>`
      : `<span class="text-[11px] text-slate-500">Objetivo: <span class="text-slate-300 font-semibold">${fmtMetric(m, goal)}</span> · faltam ${dist.toFixed(m.dec)} ${m.unit}</span>`;
  } else {
    subtitle = `<span class="text-[11px] text-slate-500">${withVal.length} leitura(s)${goal===null ? ' · sem objetivo definido' : ''}</span>`;
  }

  const chips = BODY_METRICS.map(x => `
    <button onclick="selectBodyMetric('${x.key}')"
      class="shrink-0 border rounded-full px-3 py-1.5 text-[11px] font-medium transition ${selectedBodyMetric===x.key ? 'text-neutral-950 border-transparent' : 'text-slate-300 border-neutral-700'}"
      style="${selectedBodyMetric===x.key ? `background:${x.color};` : ''}">
      ${x.label}
    </button>
  `).join('');

  // Últimos valores de todas as métricas, com seta de tendência (goal-aware)
  // comparando as duas leituras mais recentes de cada uma.
  const latestGrid = BODY_METRICS.map(x => {
    const withValX = bodyAssessments.filter(as => as[x.key] !== null && as[x.key] !== undefined);
    const a = withValX[0];
    const prevA = withValX[1] || null;
    const badge = a ? classificationBadge(a, x.key, 'mt-1 inline-block') : '';
    const arrow = deltaArrowLabel(x, prevA ? prevA[x.key] : null, a ? a[x.key] : null, 'text-[10px]');
    return `
      <div class="card rounded-xl p-3">
        <p class="text-[10px] text-slate-500 truncate">${x.label}</p>
        <p class="text-sm font-bold text-white mt-0.5">${a ? fmtMetric(x, a[x.key]) : '—'}</p>
        ${arrow ? `<p class="mt-0.5">${arrow}</p>` : ''}
        ${badge}
      </div>`;
  }).join('');

  return `
    <div class="space-y-4">
      <div class="flex gap-2 overflow-x-auto no-scrollbar pb-1">${chips}</div>

      <div class="card rounded-2xl p-4">
        <div class="flex items-center justify-between gap-2 mb-1 flex-wrap">
          <div class="flex items-center gap-2 min-w-0">
            <span class="w-2.5 h-2.5 rounded-full shrink-0" style="background:${m.color}"></span>
            <h2 class="text-sm font-semibold text-white truncate">${m.label}</h2>
          </div>
          <div class="flex items-center gap-1.5 shrink-0">
            ${latest ? `<span class="text-lg font-bold text-white">${fmtMetric(m, latest[m.key])}</span>` : ''}
            ${trendArrow}
          </div>
        </div>
        <div class="mb-3">${subtitle}</div>
        ${withVal.length >= 1 ? `<canvas id="bodyChart" height="190"></canvas>` : `<p class="text-xs text-slate-500">Sem leituras desta métrica ainda.</p>`}
      </div>

      <div class="flex items-center gap-2 px-1">
        <i data-lucide="list" class="w-4 h-4 text-[var(--accent)]"></i>
        <h2 class="text-sm font-semibold text-white">Valores mais recentes</h2>
      </div>
      <div class="grid grid-cols-3 gap-2">${latestGrid}</div>
    </div>
  `;
}

// Calendário da vertical Corpo — espelha renderCalendario da Nutrição.

function renderBodyCalendario(){
  const [y, m] = bodyCalendarViewMonth.split('-').map(Number);
  const firstOfMonth = new Date(y, m - 1, 1);
  const daysInMonth = new Date(y, m, 0).getDate();
  const firstWeekday = (firstOfMonth.getDay() + 6) % 7; // 0 = Segunda
  const monthLabel = `${PT_MONTHS[m-1]} ${y}`;
  const todayIso = todayISO();

  const cells = Array(firstWeekday).fill(null);
  for (let d = 1; d <= daysInMonth; d++) {
    cells.push(`${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`);
  }

  return `
    <div class="space-y-4 fade-in">
      <button onclick="goToAvaliarForDate(bodyCalendarSelectedDate)"
        class="w-full bg-[var(--accent)] text-neutral-950 font-bold text-sm rounded-2xl py-3.5 flex items-center justify-center gap-2 active:scale-[0.98] transition shadow-lg">
        <i data-lucide="scan-line" class="w-5 h-5"></i> Nova Avaliação
      </button>

      <div class="card rounded-2xl p-4">
        <div class="flex items-center justify-between mb-4">
          <button onclick="changeBodyCalendarMonth(-1)" aria-label="Mês anterior" class="tap-44 flex items-center justify-center text-slate-400 hover:text-white">
            <i data-lucide="chevron-left" class="w-5 h-5"></i>
          </button>
          <h2 class="text-sm font-bold text-white capitalize">${monthLabel}</h2>
          <button onclick="changeBodyCalendarMonth(1)" aria-label="Mês seguinte" class="tap-44 flex items-center justify-center text-slate-400 hover:text-white">
            <i data-lucide="chevron-right" class="w-5 h-5"></i>
          </button>
        </div>

        <div class="grid grid-cols-7 gap-1 mb-1">
          ${['Seg','Ter','Qua','Qui','Sex','Sáb','Dom'].map(d => `<div class="text-center text-[10px] text-slate-600 font-semibold">${d}</div>`).join('')}
        </div>

        <div class="grid grid-cols-7 gap-1">
          ${cells.map(dateIso => {
            if (!dateIso) return `<div></div>`;
            const status = dayBodyStatus(dateIso);
            const isToday = dateIso === todayIso;
            const isSelected = dateIso === bodyCalendarSelectedDate;
            const dotColor = status === 'alert' ? 'bg-red-500' : status === 'has' ? 'bg-emerald-500' : 'bg-neutral-700';

// Resumo do dia selecionado: métricas que pioraram face à avaliação anterior
// (o motivo do ponto vermelho) — mostra qual métrica e o quanto, em vez de
// obrigar a comparar manualmente os "Valores mais recentes" contra o histórico.
function renderBodyCalendarDaySummary(){
  const dayAssessments = bodyAssessments.filter(a => a.date === bodyCalendarSelectedDate);
  if (dayAssessments.length === 0) return '';
  const worsened = dayAssessments.flatMap(bodyAssessmentWorsenedMetrics);
  if (worsened.length === 0) return '';

  return `
    <div class="rounded-2xl border border-red-500/30 bg-red-500/5 p-3.5 space-y-2">
      <p class="text-[11px] font-semibold text-red-300 uppercase tracking-wide flex items-center gap-1.5">
        <i data-lucide="alert-triangle" class="w-3.5 h-3.5"></i> Afastou-se do objetivo neste dia
      </p>
      ${worsened.map(({ m, prevVal, latest }) => {
        const delta = Number(latest) - Number(prevVal);
        const arrow = delta > 0 ? '▲' : delta < 0 ? '▼' : '•';
        const goal = bodyGoal(m);
        return `
          <div class="flex items-center justify-between text-xs">
            <span class="text-red-300 font-semibold">${esc(m.label)}</span>
            <span class="text-red-300">${fmtMetric(m, latest)} <span class="text-red-300/70">(${arrow} ${Math.abs(delta).toFixed(m.dec)}${m.unit})</span>${goal !== null ? ` <span class="text-slate-500">· meta ${fmtMetric(m, goal)}</span>` : ''}</span>
          </div>
        `;
      }).join('')}
    </div>

}

function renderBodyCalendarDayAssessments(){
  const dayAssessments = bodyAssessments
    .filter(a => a.date === bodyCalendarSelectedDate)
    .sort((a,b) => (a.created_at||'').localeCompare(b.created_at||''));
  if (dayAssessments.length === 0) return `<p class="text-xs text-slate-500 px-1">Sem avaliações registadas neste dia.</p>`;

function renderBodyChart(){
  const canvas = document.getElementById('bodyChart');
  if (!canvas) return;
  if (bodyChart) { bodyChart.destroy(); bodyChart = null; }

  const m = BODY_METRICS.find(x => x.key === selectedBodyMetric) || BODY_METRICS[0];
  // Ordem cronológica ascendente, apenas avaliações com valor para a métrica.
  const points = bodyAssessments
    .filter(a => a[m.key] !== null && a[m.key] !== undefined)
    .slice()
    .sort((a,b) => a.date.localeCompare(b.date));
  if (!points.length) return;

  const goal = bodyGoal(m);
  const datasets = [{
    label: `${m.label}${m.unit ? ' (' + m.unit + ')' : ''}`,
    data: points.map(a => Number(a[m.key])),
    borderColor: m.color,
    backgroundColor: hexToRgba(m.color, 0.15),
    pointBackgroundColor: m.color,
    pointRadius: points.length > 20 ? 0 : 3,
    borderWidth: 2,
    tension: 0.25,
    fill: true,
  }];
  // Linha tracejada do objetivo — mesmo estilo da meta no dashboard da Nutrição.
  if (goal !== null) {
    datasets.push({
      label: 'Objetivo', data: points.map(() => goal),
      borderColor: '#ef4444', borderDash: [6,4], pointRadius: 0, borderWidth: 1.5,
    });
  }

  Chart.defaults.color = theme === 'light' ? '#475569' : '#a1a1aa';
  bodyChart = new Chart(canvas, {
    type: 'line',
    data: {
      labels: points.map(a => a.date.slice(8,10) + '/' + a.date.slice(5,7)),
      datasets,
    },
    options: {
      responsive: true,
      plugins: { legend: { labels: { boxWidth: 10, font: { size: 10 } } } },
      scales: {
        y: { beginAtZero: false, grid: { color: theme === 'light' ? 'rgba(154,116,74,0.45)' : 'rgba(232,163,66,0.3)' } },
        x: { grid: { display: false } },
      },
    },
  });
}

function findGymSessionById(id){ return gymSessions.find(s => s.id === id) || null; }

// Agrupa as séries de uma sessão por exercício, preservando a ordem de
// aparecimento e a ordem das séries dentro de cada exercício (set_index).
function gymSetGroups(session){
  const sets = (session.workout_session_sets || []).slice().sort((a,b) => (a.set_index||0) - (b.set_index||0));
  const order = [];
  const byName = {};
  sets.forEach(s => {
    if (!byName[s.exercise_name]) { byName[s.exercise_name] = []; order.push(s.exercise_name); }
    byName[s.exercise_name].push(s);
  });
  return order.map(name => ({ exercise_name: name, sets: byName[name] }));
}

// Resumo curto de uma sessão, adequado ao seu tipo: um treino de força
// descreve-se pelo nº de exercícios, uma aula pelas métricas do relógio
// (que é tudo o que ela tem). Usado em toasts e no cabeçalho do cartão.
function gymSessionSummary(session){
  if (session.kind === 'aula') {
    const parts = [
      session.duration_seconds ? formatDuration(session.duration_seconds) : null,
      session.calories_kcal ? `${session.calories_kcal} kcal` : null,
    ].filter(Boolean);
    if (parts.length) return parts.join(' · ');
    return gymCategoryLabel(session) || 'Aula';
  }
  return `${gymSetGroups(session).length} exercício(s)`;
}

// "Ombros · Tríceps" a partir do array de categorias. Tolera as sessões
// antigas, anteriores à coluna existir.
function gymCategoryLabel(session){
  return (session.categories || []).join(' · ');
}

// Chips das métricas do relógio, mostrados em qualquer sessão que as tenha
// (uma aula tem quase sempre, um treino de força pode ter). Devolve string
// vazia quando não há nada para mostrar, para o chamador poder omitir a linha.
function gymMetricChips(session){
  const chips = [
    session.duration_seconds ? { icon:'timer', text: formatDuration(session.duration_seconds) } : null,
    session.calories_kcal ? { icon:'flame', text: `${session.calories_kcal} kcal` } : null,
    session.avg_hr ? { icon:'heart-pulse', text: `${session.avg_hr} bpm méd` } : null,
    session.max_hr ? { icon:'trending-up', text: `${session.max_hr} bpm máx` } : null,
    session.exertion ? { icon:'gauge', text: `Esforço ${session.exertion}/10` } : null,
  ].filter(Boolean);
  if (!chips.length) return '';
  return `
    <div class="flex flex-wrap gap-1.5">
      ${chips.map(c => `
        <span class="inline-flex items-center gap-1 text-[10px] font-medium text-slate-400 bg-neutral-900 border border-neutral-800 rounded-full px-2 py-1">
          <i data-lucide="${c.icon}" class="w-3 h-3"></i>${c.text}
        </span>
      `).join('')}
    </div>`;
}

async function onGymPhotoSelected(input){
  const files = Array.from(input.files || []);
  input.value = '';
  if (!files.length) return;
  const remaining = MAX_PHOTOS - gymPhotos.length;
  if (remaining <= 0) { showToast('error', null, `Máximo de ${MAX_PHOTOS} imagens.`); return; }
  for (const file of files.slice(0, remaining)) {
    try { gymPhotos.push(await compressImage(file)); }
    catch(e) { console.warn('Falha a processar imagem', e); }
  }
  refreshGym();
}
function removeGymPhoto(index){ gymPhotos.splice(index, 1); refreshGym(); }
function clearGymPhotos(){ gymPhotos = []; refreshGym(); }
function updateGymNotes(value){ gymNotes = value; saveGymDraft(); }
function updateGymSessionName(value){ gymSessionNameDraft = value; saveGymDraft(); }

// Rascunho do "Novo Treino" (fotos+data+tipo+categorias+métricas+notas) — só
// antes de a sessão manual/IA existir na BD (manualGymSessionId). Mesma
// lógica do rascunho da Nutrição (ver saveMealDraft).
function saveGymDraft(){
  if (manualGymSessionId) return;
  const isEmpty = !gymPhotos.length && !gymNotes.trim() && !gymSessionNameDraft.trim() && gymCategoriesDraft.length === 0
    && !gymDurationDraft && !gymCaloriesDraft && !gymAvgHrDraft && !gymMaxHrDraft && !gymExertionDraft && gymDate === todayISO();
  if (isEmpty) { clearDraft('gym'); return; }
  saveDraft('gym', {
    gymPhotos, gymDate, gymNotes, gymSessionNameDraft, gymKindDraft, gymCategoriesDraft,
    gymDurationDraft, gymCaloriesDraft, gymAvgHrDraft, gymMaxHrDraft, gymExertionDraft,
  });
}
function restoreGymDraftIfAny(){
  if (manualGymSessionId) return;
  const d = loadDraft('gym');
  if (!d || (!d.gymPhotos?.length && !(d.gymNotes||'').trim() && !(d.gymSessionNameDraft||'').trim())) return;
  gymPhotos = d.gymPhotos || [];
  gymDate = d.gymDate || todayISO();
  gymNotes = d.gymNotes || '';
  gymSessionNameDraft = d.gymSessionNameDraft || '';
  gymKindDraft = d.gymKindDraft || 'forca';
  gymCategoriesDraft = d.gymCategoriesDraft || [];
  gymDurationDraft = d.gymDurationDraft || '';
  gymCaloriesDraft = d.gymCaloriesDraft || '';
  gymAvgHrDraft = d.gymAvgHrDraft || '';
  gymMaxHrDraft = d.gymMaxHrDraft || '';
  gymExertionDraft = d.gymExertionDraft || '';
  showToast('success', 'Rascunho recuperado', 'Continuámos o treino que tinhas a meio.',
    { actionLabel: 'Descartar', actionOnclick: 'discardGymDraft()' });
}
function discardGymDraft(){
  gymPhotos = []; gymDate = todayISO(); gymNotes = ''; gymSessionNameDraft = '';
  gymKindDraft = 'forca'; gymCategoriesDraft = [];
  gymDurationDraft = ''; gymCaloriesDraft = ''; gymAvgHrDraft = ''; gymMaxHrDraft = ''; gymExertionDraft = '';
  clearDraft('gym');
  if (activeVertical === 'ginasio' && gymTab === 'registar') refreshGym();
}
// Trocar de tipo limpa as categorias: um grupo muscular não faz sentido numa
// aula (e vice-versa), e deixá-las lá gravaria "Peito" numa aula de pilates.
function selectGymKind(kind){
  if (gymKindDraft === kind) return;
  gymKindDraft = kind;
  gymCategoriesDraft = [];
  gymCategoriesExpanded = false;
  refreshGym();
}
// Uma sessão pode treinar vários grupos ("Ombros" + "Tríceps"), por isso a
// escolha é múltipla: segundo toque na mesma pílula desmarca.
function toggleGymCategory(category){
  const i = gymCategoriesDraft.indexOf(category);
  if (i >= 0) gymCategoriesDraft.splice(i, 1);
  else gymCategoriesDraft.push(category);
  refreshGym();
}

  const el = document.getElementById('gymCategoryCustom');
  if (!el) return;
  const value = el.value.trim().slice(0, 60);
  el.value = '';
  if (!value || gymCategoriesDraft.includes(value)) { refreshGym(); return; }

}
// Lê os campos de métricas para o formato da BD, ignorando os que ficaram
// vazios ou ilegíveis. Partilhado pelo upload e pela entrada manual.
function gymMetricsFromDraft(){
  const int = (v) => {
    const n = Math.round(Number(String(v ?? '').trim()));
    return Number.isFinite(n) && n > 0 ? n : null;
  };
  const exertion = int(gymExertionDraft);
  return {
    duration_seconds: parseDurationToSeconds(gymDurationDraft),
    calories_kcal: int(gymCaloriesDraft),
    avg_hr: int(gymAvgHrDraft),
    max_hr: int(gymMaxHrDraft),
    // A BD só aceita 1-10 (CHECK); fora disso vale mais não gravar do que
    // rebentar o insert.
    exertion: exertion !== null && exertion <= 10 ? exertion : null,
  };
}
function resetGymDraft(){
  gymPhotos = [];
  gymNotes = '';
  gymSessionNameDraft = '';
  gymCategoriesDraft = [];
  gymDurationDraft = '';
  gymCaloriesDraft = '';

async function analyzeGym(){
  if (!gymPhotos.length || analyzingGym) return;
  const date = document.getElementById('gymDate').value || todayISO();
  analyzingGym = true;
  refreshGym();
  try {
    const { data, error } = await sb.functions.invoke('analyze-gym', {
      body: {
        images: gymPhotos.map(p => p.base64),
        mime_type: 'image/jpeg',
        date,
        notes: gymNotes || null,
        kind: gymKindDraft,
        // O que o utilizador escreveu ganha à sugestão da IA — ver analyze-gym,
        // que só preenche estes campos quando vêm vazios daqui.
        name: gymSessionNameDraft.trim() || null,
        categories: gymCategoriesDraft,
        ...gymMetricsFromDraft(),
      },
    });
    if (error) throw new Error(await edgeFunctionErrorMessage(error, 'Falha na análise.'));
    if (data && data.error) throw new Error(data.error);

    const session = data.session;
    session.workout_session_sets = data.sets || [];
    gymSessions.unshift(session);
    gymSessions.sort((a,b) => b.date.localeCompare(a.date) || (b.created_at||'').localeCompare(a.created_at||''));
    resetGymDraft();
    expandedGymSessionId = session.id;
    showToast('success', 'Sessão registada', `${formatDatePT(session.date)} · ${gymSessionSummary(session)}`,
      { actionLabel: 'Ver no Calendário', actionOnclick: `viewInGymCalendar('${session.date}')` });
    // extra_fields são dados que a IA viu no print e que a app ainda não tem
    // onde guardar. Ficam nos logs (app_logs.meta) para depois decidirmos quais
    // valem uma coluna própria — ver RESPONSE_SCHEMA em analyze-gym.
    logEvent('success', 'gym_analysis', null, {
      date: session.date,
      kind: session.kind,
      ...(data.extra_fields && data.extra_fields.length ? { extra_fields: data.extra_fields } : {}),
      ...(data.usage || {}),
    });
    gymTab = 'dashboard';
  } catch(e) {
    console.error(e);
    showToast('error', null, aiErrorMessage(e, 'Falha na análise. Tenta novamente.'));
    logEvent('error', 'gym_analysis', e.message || 'erro desconhecido');
  }
  analyzingGym = false;
  render();
}

async function reanalyzeGym(id){
  if (reanalyzingGymSessionId) return;
  const s = findGymSessionById(id);
  if (!s) return;
  reanalyzingGymSessionId = id;
  refreshGym();
  try {
    const { data, error } = await sb.functions.invoke('analyze-gym', {
      body: { session_id: id, notes: s.notes || null },
    });
    if (error) throw new Error(await edgeFunctionErrorMessage(error, 'Falha na reanálise.'));
    if (data && data.error) throw new Error(data.error);
    Object.assign(s, data.session);
    s.workout_session_sets = data.sets || [];
    showToast('success', 'Sessão reanalisada', null);
    logEvent('success', 'gym_reanalysis', null, { date: s.date, ...(data.usage || {}) });
  } catch(e) {
    console.error(e);
    showToast('error', null, aiErrorMessage(e, 'Falha na reanálise. Tenta novamente.'));
    logEvent('error', 'gym_reanalysis', e.message || 'erro desconhecido');
  }
  reanalyzingGymSessionId = null;
  refreshGym();
}

async function deleteGymSession(id){
  const s = findGymSessionById(id);
  if (!s) return;
  gymSessions = gymSessions.filter(x => x.id !== id);
  if (expandedGymSessionId === id) expandedGymSessionId = null;
  if (manualGymSessionId === id) manualGymSessionId = null;
  refreshGym();
  try {
    if (s.photo_paths && s.photo_paths.length) await sb.storage.from('gym-photos').remove(s.photo_paths);
    const { error } = await sb.from('workout_sessions').delete().eq('id', id);
    if (error) throw error;
  } catch(e) { flashSyncError(e); }
}

}

// Espelha loadAssessmentPhotoUrls — bucket gym-photos.
async function loadGymSessionPhotoUrls(id){
  const s = findGymSessionById(id);
  const allPaths = (s && s.photo_paths) || [];
  const paths = allPaths.filter(p => !signedUrlCache[p]);
  if (!paths.length) return;
  paths.forEach(p => { delete signedUrlFailed[p]; });
  try {
    const { data, error } = await sb.storage.from('gym-photos').createSignedUrls(paths, 3600);
    if (error) throw error;
    const returned = new Set();
    (data || []).forEach(d => {
      if (d.signedUrl && d.path) { signedUrlCache[d.path] = d.signedUrl; returned.add(d.path); }
    });
    paths.forEach(p => { if (!returned.has(p)) signedUrlFailed[p] = true; });
  } catch(e) {
    console.warn('signed urls', e);
    paths.forEach(p => { signedUrlFailed[p] = true; });
  }
  if (expandedGymSessionId === id) refreshGymCalendarDaySessions();
}

/* -------- Sessão manual (série-a-série), sem IA -------- */
async function startManualGymSession(){
  const date = document.getElementById('gymDate').value || todayISO();
  // Sem nome escrito, cai para a categoria ("HIIT") e só depois para o tipo
  // ("Aula") — assim uma aula registada à pressa continua identificável na
  // lista, em vez de aparecer como "Treino" sem mais nada.
  const name = gymSessionNameDraft.trim() || gymCategoriesDraft.join(' e ') || gymKindLabel(gymKindDraft);
  try {
    const { data, error } = await sb.from('workout_sessions')
      .insert({
        user_id: currentUser.id,
        date,
        name,
        kind: gymKindDraft,
        categories: gymCategoriesDraft,
        ...gymMetricsFromDraft(),
        notes: gymNotes.trim() || null,
        photo_paths: [],
        status: 'concluido',
      })
      .select().single();
    if (error) throw error;
    data.workout_session_sets = [];
    gymSessions.unshift(data);
    manualGymSessionId = data.id;
    expandedGymSessionId = data.id;
    resetGymDraft();
  } catch(e) {
    flashSyncError(e);
  }
  refreshGym();
}

// Esforço percebido é o único campo editável depois da sessão gravada: é o
// que muitas vezes só se sabe no fim do treino, e não vale a pena reanalisar
// os prints por causa dele. Campo vazio limpa o valor.
async function saveGymSessionExertion(sessionId, rawValue){
  const s = findGymSessionById(sessionId);
  if (!s) return;
  const text = String(rawValue ?? '').trim();
  let value = null;
  if (text) {
    const n = Math.round(Number(text));
    if (!Number.isFinite(n) || n < 1 || n > 10) {
      showToast('error', null, 'O esforço tem de ser um número entre 1 e 10.');
      refreshGym();
      return;
    }
    value = n;
  }
  if (value === (s.exertion ?? null)) return;
  const previous = s.exertion ?? null;
  s.exertion = value;
  refreshGym();
  try {
    const { error } = await sb.from('workout_sessions').update({ exertion: value }).eq('id', sessionId);
    if (error) throw error;
  } catch(e) {
    s.exertion = previous;
    flashSyncError(e);
    refreshGym();
  }
}

function finishManualGymSession(){
  const s = manualGymSessionId ? findGymSessionById(manualGymSessionId) : null;
  if (s) {
    showToast('success', 'Sessão registada',
      `${formatDatePT(s.date)} · ${gymSessionSummary(s)}`,
      { actionLabel: 'Ver no Calendário', actionOnclick: `viewInGymCalendar('${s.date}')` });
  }
  manualGymSessionId = null;
  expandedGymSessionId = null;
  newGymExerciseNameDraft = '';
  newGymSetRepsDraft = '';
  newGymSetWeightDraft = '';
  gymTab = 'dashboard';
  render();
}

// Adiciona uma série ao exercício indicado pelo nome (cria o exercício se for
// a primeira série com este nome). O nome do exercício mantém-se depois de
// gravar para facilitar adicionar várias séries seguidas do mesmo exercício.
async function submitGymSet(sessionId){
  if (addingGymSet) return;
  const name = newGymExerciseNameDraft.trim();
  const reps = Number(newGymSetRepsDraft);
  const weight = Number(newGymSetWeightDraft);

  const errors = {};
  if (!name) errors['gym.exerciseName'] = 'Preenche o exercício.';
  if (!(reps > 0)) errors['gym.setReps'] = 'Repetições inválidas.';
  if (!(weight >= 0)) errors['gym.setWeight'] = 'Carga inválida.';
  formFieldErrors = errors;
  if (Object.keys(errors).length) {
    refreshGym();
    focusFormField(errors['gym.exerciseName'] ? 'newGymExerciseName' : errors['gym.setReps'] ? 'newGymSetReps' : 'newGymSetWeight');
    return;
  }
  const s = findGymSessionById(sessionId);
  if (!s) return;
  const setIndex = (s.workout_session_sets || []).filter(x => x.exercise_name === name).length;

  addingGymSet = true;
  refreshGym();
  try {
    const { data, error } = await sb.from('workout_session_sets')
      .insert({ session_id: sessionId, user_id: currentUser.id, exercise_name: name, set_index: setIndex, reps, weight })
      .select().single();
    if (error) throw error;
    s.workout_session_sets = [...(s.workout_session_sets || []), data];
    newGymSetRepsDraft = '';
    newGymSetWeightDraft = '';
  } catch(e) {
    flashSyncError(e);
  }
  addingGymSet = false;
  refreshGym();
}

function openDeleteGymSetModal(sessionId, setId, label){
  openConfirmDeleteModal(`Eliminar ${label}?`,
    'Remove esta série da sessão de treino. Não pode ser desfeita.',
    () => deleteGymSet(sessionId, setId));
}
async function deleteGymSet(sessionId, setId){
  const s = findGymSessionById(sessionId);
  if (!s) return;
  s.workout_session_sets = (s.workout_session_sets || []).filter(x => x.id !== setId);
  refreshGym();
  try {
    const { error } = await sb.from('workout_session_sets').delete().eq('id', setId);
    if (error) throw error;
  } catch(e) { flashSyncError(e); }
}

    ? (session.duration_seconds ? formatDuration(session.duration_seconds) : '')
    : `${Math.round(volume).toLocaleString('pt-PT')} kg`;

/* ============================= CALENDÁRIO ============================= */
// Calendário da vertical Ginásio — espelha renderBodyCalendario. Não precisa
// de cache/carregamento por mês porque gymSessions já contém o histórico
// completo do utilizador.
function changeGymCalendarMonth(delta){
  gymCalendarViewMonth = shiftMonthKey(gymCalendarViewMonth, delta);
  render();
}
function selectGymCalendarDay(dateIso){
  gymCalendarSelectedDate = dateIso;
  render();
}
function dayGymStatus(dateIso){
  return gymSessions.some(s => s.date === dateIso) ? 'has' : 'none';
}

function renderGymCalendario(){
  const [y, m] = gymCalendarViewMonth.split('-').map(Number);
  const firstOfMonth = new Date(y, m - 1, 1);
  const daysInMonth = new Date(y, m, 0).getDate();
  const firstWeekday = (firstOfMonth.getDay() + 6) % 7; // 0 = Segunda
  const monthLabel = `${PT_MONTHS[m-1]} ${y}`;
  const todayIso = todayISO();

  const cells = Array(firstWeekday).fill(null);
  for (let d = 1; d <= daysInMonth; d++) {
    cells.push(`${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`);
  }

  return `
    <div class="space-y-4 fade-in">
      <button onclick="goToGymRegistarForDate(gymCalendarSelectedDate)"
        class="w-full bg-[var(--accent)] text-neutral-950 font-bold text-sm rounded-2xl py-3.5 flex items-center justify-center gap-2 active:scale-[0.98] transition shadow-lg">
        <i data-lucide="dumbbell" class="w-5 h-5"></i> Novo Treino
      </button>

      <div class="card rounded-2xl p-4">
        <div class="flex items-center justify-between mb-4">
          <button onclick="changeGymCalendarMonth(-1)" aria-label="Mês anterior" class="tap-44 flex items-center justify-center text-slate-400 hover:text-white">
            <i data-lucide="chevron-left" class="w-5 h-5"></i>
          </button>
          <h2 class="text-sm font-bold text-white capitalize">${monthLabel}</h2>
          <button onclick="changeGymCalendarMonth(1)" aria-label="Mês seguinte" class="tap-44 flex items-center justify-center text-slate-400 hover:text-white">
            <i data-lucide="chevron-right" class="w-5 h-5"></i>
          </button>
        </div>

        <div class="grid grid-cols-7 gap-1 mb-1">
          ${['Seg','Ter','Qua','Qui','Sex','Sáb','Dom'].map(d => `<div class="text-center text-[10px] text-slate-600 font-semibold">${d}</div>`).join('')}
        </div>

        <div class="grid grid-cols-7 gap-1">
          ${cells.map(dateIso => {
            if (!dateIso) return `<div></div>`;
            const status = dayGymStatus(dateIso);
            const isToday = dateIso === todayIso;
            const isSelected = dateIso === gymCalendarSelectedDate;
            const dotColor = status === 'has' ? 'bg-emerald-500' : 'bg-neutral-700';
            const dayNum = Number(dateIso.slice(8,10));
            return `
              <button onclick="selectGymCalendarDay('${dateIso}')"
                class="aspect-square flex flex-col items-center justify-center rounded-xl text-xs transition
                  ${isSelected ? 'bg-[var(--accent)] text-neutral-950 font-bold' : isToday ? 'border border-[var(--accent)]/60 text-white' : 'text-slate-300 hover:bg-neutral-800'}">
                ${dayNum}
                <span class="w-1.5 h-1.5 rounded-full mt-0.5 ${dotColor}"></span>
              </button>
            `;
          }).join('')}
        </div>

        <div class="flex flex-wrap items-center gap-x-3 gap-y-1 mt-4 pt-3 border-t border-neutral-800 text-[10px] text-slate-500">
          <span class="flex items-center gap-1"><span class="w-2 h-2 rounded-full bg-emerald-500"></span> Treino registado</span>
          <span class="flex items-center gap-1"><span class="w-2 h-2 rounded-full bg-neutral-700"></span> Sem registo</span>
        </div>
      </div>

      <div class="space-y-3">
        <h2 class="text-xs font-semibold text-slate-500 uppercase tracking-wide px-1">${formatDatePT(gymCalendarSelectedDate)}</h2>
        <div id="gymCalendarDaySessions" class="space-y-3">${renderGymCalendarDaySessions()}</div>
      </div>
    </div>
  `;
}

// Espelha refreshBodyCalendarDayAssessments: atualiza só a lista de sessões
// do dia selecionado, sem recriar o calendário todo.
function refreshGymCalendarDaySessions(){
  const container = document.getElementById('gymCalendarDaySessions');
  if (!container) return;
  container.innerHTML = renderGymCalendarDaySessions();
  if (window.lucide) lucide.createIcons();
}

function renderGymCalendarDaySessions(){
  const daySessions = gymSessions
    .filter(s => s.date === gymCalendarSelectedDate)
    .sort((a,b) => (a.created_at||'').localeCompare(b.created_at||''));
  if (daySessions.length === 0) return `<p class="text-xs text-slate-500 px-1">Sem treinos registados neste dia.</p>`;
  return daySessions.map(renderGymSessionCard).join('');
}

/* ---------- Dashboard de evolução ---------- */
function currentAccentHex(){
  const a = ACCENT_COLORS.find(a => a.key === (state.profile?.accent_color || 'amber'));
  return a ? a.light : '#fb923c';
}
// Género do utilizador para escolher a silhueta ('F' feminina, senão masculina).
function userGender(){ return state.profile?.gender === 'F' ? 'F' : 'M'; }
function gymRangeBounds(range){
  const today = todayISO();
  if (range === 'semana') return { start: startOfWeekISO(), end: today };
  if (range === 'mes')    return { start: startOfMonthISO(), end: today };
  const d = new Date(); d.setDate(d.getDate() - 89); // trimestre: últimos 90 dias
  return { start: d.toISOString().slice(0, 10), end: today };
}
function sessionVolume(s){
  return (s.workout_session_sets || []).reduce((a, set) => a + ((set.reps || 0) * (set.weight || 0)), 0);
}
function gymSessionsInRange(range){
  const { start, end } = gymRangeBounds(range);
  return gymSessions.filter(s => s.date >= start && s.date <= end);
}
function trainedExercisesInRange(range){
  const names = [];
  gymSessionsInRange(range).forEach(s => (s.workout_session_sets || []).forEach(set => {
    if (set.weight != null && !names.includes(set.exercise_name)) names.push(set.exercise_name);
  }));
  return names.sort((a, b) => a.localeCompare(b));
}

function setGymRange(r){ gymRange = r; refreshGymDashboard(); }
function selectGymExercise(id){ gymChartExercise = id || null; refreshGymDashboard(); }
function refreshGymDashboard(){
  const main = document.getElementById('tab-content');
  if (!main) return;
  main.innerHTML = renderGymDashboard();
  if (window.lucide) lucide.createIcons();
  requestAnimationFrame(renderGymCharts);
}

function renderGymDashboard(){
  const sessions = gymSessionsInRange(gymRange);
  const totalVol = sessions.reduce((a, s) => a + sessionVolume(s), 0);
  const totalSets = sessions.reduce((a, s) => a + (s.workout_session_sets || []).filter(x => x.reps != null && x.weight != null).length, 0);
  const trained = trainedExercisesInRange(gymRange);
  if (gymChartExercise && !trained.includes(gymChartExercise)) gymChartExercise = null;
  const ranges = [{ k:'semana', l:'Esta Semana' }, { k:'mes', l:'Este Mês' }, { k:'trimestre', l:'3 Meses' }];

  return `
    <div class="space-y-4 fade-in">
      <div class="flex items-center gap-2">
        <div class="w-9 h-9 rounded-xl flex items-center justify-center shrink-0" style="background:linear-gradient(135deg,var(--mod-ginasio-from),var(--mod-ginasio-to));">
          <i data-lucide="trending-up" class="w-5 h-5 text-white"></i>
        </div>
        <div><h2 class="text-sm font-bold text-white leading-none">Evolução</h2>
        <p class="text-[11px] text-slate-500 mt-1">${sessions.length} treino(s) no período</p></div>
      </div>

      <div class="flex gap-2">
        ${ranges.map(r => `
          <button onclick="setGymRange('${r.k}')" class="range-chip ${gymRange===r.k?'active':''} flex-1 border border-neutral-700 rounded-xl py-2 text-xs font-semibold text-slate-300 transition">${r.l}</button>`).join('')}
      </div>

      <div class="grid grid-cols-3 gap-2">
        <div class="card rounded-2xl p-3 text-center">
          <p class="text-lg font-bold text-white leading-none">${sessions.length}</p>
          <p class="text-[10px] text-slate-500 mt-1.5">Treinos</p>
        </div>
        <div class="card rounded-2xl p-3 text-center">
          <p class="text-lg font-bold text-white leading-none">${Math.round(totalVol).toLocaleString('pt-PT')}</p>
          <p class="text-[10px] text-slate-500 mt-1.5">Volume (kg)</p>
        </div>
        <div class="card rounded-2xl p-3 text-center">
          <p class="text-lg font-bold text-white leading-none">${totalSets}</p>
          <p class="text-[10px] text-slate-500 mt-1.5">Séries</p>
        </div>
      </div>

      ${sessions.length === 0 ? `
        <div class="min-h-[30vh] flex flex-col items-center justify-center text-center px-6">
          <i data-lucide="bar-chart-3" class="w-10 h-10 text-slate-600 mb-3"></i>
          <p class="text-xs text-slate-500 max-w-xs leading-relaxed">Ainda não há treinos neste período. Termina uma sessão de treino para veres a tua evolução aqui.</p>
        </div>` : `
        <div class="card rounded-2xl p-3.5">
          <p class="text-[11px] font-semibold text-slate-300 mb-2">Volume por dia</p>
          <canvas id="gymVolChart" height="150"></canvas>
        </div>

        <div class="card rounded-2xl p-3.5 space-y-3">
          <div class="flex items-center justify-between gap-2">
            <p class="text-[11px] font-semibold text-slate-300">Progressão por exercício</p>
          </div>
          <select onchange="selectGymExercise(this.value)" aria-label="Exercício a mostrar na progressão"
            class="w-full bg-neutral-900 border border-neutral-800 rounded-xl px-3 py-2 text-xs text-white outline-none focus:border-[var(--accent)]/60">
            <option value="">Escolhe um exercício…</option>
            ${trained.map(name => `<option value="${esc(name)}" ${gymChartExercise===name?'selected':''}>${esc(name)}</option>`).join('')}
          </select>
          ${gymChartExercise ? `<canvas id="gymExChart" height="150"></canvas>` :
            `<p class="text-[11px] text-slate-500 text-center py-4">Escolhe um exercício para veres a evolução da carga.</p>`}
        </div>`}
    </div>`;
}

function renderGymCharts(){
  Chart.defaults.color = theme === 'light' ? '#475569' : '#a1a1aa';
  const gridColor = theme === 'light' ? 'rgba(154,116,74,0.45)' : 'rgba(232,163,66,0.3)';
  const accent = currentAccentHex();
  const { start, end } = gymRangeBounds(gymRange);

  // Volume por dia (barras)
  if (gymCharts.vol) { gymCharts.vol.destroy(); gymCharts.vol = null; }
  const volCanvas = document.getElementById('gymVolChart');
  if (volCanvas) {
    const byDay = {};
    for (let d = new Date(start); d.toISOString().slice(0,10) <= end; d.setDate(d.getDate()+1)) byDay[d.toISOString().slice(0,10)] = 0;
    gymSessions.forEach(s => { if (s.date >= start && s.date <= end) byDay[s.date] = (byDay[s.date] || 0) + sessionVolume(s); });
    const days = Object.keys(byDay).sort();
    gymCharts.vol = new Chart(volCanvas, {
      data: {
        labels: days.map(d => d.slice(8,10) + '/' + d.slice(5,7)),
        datasets: [{ type:'bar', label:'Volume (kg)', data: days.map(d => byDay[d]), backgroundColor: hexToRgba(accent, 0.6), borderRadius:4 }]
      },
      options: {
        responsive:true,
        plugins:{ legend:{ display:false } },
        scales:{ y:{ beginAtZero:true, grid:{ color:gridColor } }, x:{ grid:{ display:false } } }
      }
    });
  }

  // Progressão da carga por exercício (linha)
  if (gymCharts.ex) { gymCharts.ex.destroy(); gymCharts.ex = null; }
  const exCanvas = document.getElementById('gymExChart');
  if (exCanvas && gymChartExercise) {
    const points = [];
    gymSessions.filter(s => s.date >= start && s.date <= end)
      .slice().sort((a,b) => a.date < b.date ? -1 : 1)
      .forEach(s => {
        const best = (s.workout_session_sets || [])
          .filter(x => x.exercise_name === gymChartExercise && x.weight != null)
          .reduce((m,x) => Math.max(m, x.weight), 0);
        if (best > 0) points.push({ date: s.date, best });
      });
    gymCharts.ex = new Chart(exCanvas, {
      type:'line',
      data: {
        labels: points.map(p => p.date.slice(8,10) + '/' + p.date.slice(5,7)),
        datasets: [{ label:'Melhor carga (kg)', data: points.map(p => p.best), borderColor: accent, backgroundColor: hexToRgba(accent, 0.15), fill:true, tension:0.3, pointRadius:3, borderWidth:2 }]
      },
      options: {
        responsive:true,
        plugins:{ legend:{ display:false } },
        scales:{ y:{ beginAtZero:false, grid:{ color:gridColor } }, x:{ grid:{ display:false } } }
      }
    });
  }
}

/* ============================= DASHBOARD ============================= */
function setRange(range){
  activeRange = range;
  refreshDashboard();
}

function selectMacro(key){
  selectedMacro = key;
  refreshDashboard();
}

// Atualização in-place do dashboard — não toca no header, nav ou vertical strip,
// e não aciona a animação fade-in, eliminando o flash ao mudar range/macro.
function refreshDashboard(){
  const main = document.getElementById('tab-content');
  if (!main) return;
  main.innerHTML = renderDashboard(false);
  if (window.lucide) lucide.createIcons();
  requestAnimationFrame(renderDashChart);
}

function toggleMicros(){
  microsCollapsed = !microsCollapsed;
  refreshDashboard();
}

function renderDashboard(animate = true){
  const profile = state.profile || {};
  const { daysElapsed } = rangeBounds(activeRange);
  const totals = rangeTotals(activeRange);
  const rangeLabel = activeRange === 'hoje' ? 'Hoje' : activeRange === 'semana' ? 'Esta Semana' : 'Este Mês';

  const macroCards = MACROS.map(m => {
    const goal = (Number(profile[m.goalKey]) || 0) * daysElapsed;
    const consumed = totals[m.key];
    const remaining = goal - consumed;
    const pct = goal > 0 ? Math.min(100, (consumed/goal)*100) : 0;
    const over = remaining < 0;
    const isSelected = selectedMacro === m.key;

    return `
      <button onclick="selectMacro('${m.key}')"
        class="card rounded-2xl p-4 text-left transition ${isSelected ? 'ring-2' : ''}" style="${isSelected ? `--tw-ring-color:var(--accent);` : ''}">
        <span class="text-xs block truncate mb-1 ${isSelected ? 'text-white font-semibold' : 'text-slate-400'}">${m.label}</span>
        <span class="text-[10px] px-1.5 py-0.5 rounded-full inline-block mb-1 whitespace-nowrap ${over ? 'bg-red-500/15 text-red-400 border border-red-500/40' : 'bg-emerald-500/10 text-emerald-400 border border-emerald-500/30'}">
          ${over ? `${Math.abs(remaining).toFixed(0)} ${m.unit} acima` : `restam ${remaining.toFixed(0)} ${m.unit}`}
        </span>
        <p class="text-lg font-bold text-white leading-none mb-2">${consumed.toFixed(0)}<span class="text-[11px] text-slate-500 font-normal"> / ${goal.toFixed(0)} ${m.unit}</span></p>
        <div class="w-full h-2 rounded-full bg-neutral-800 border border-neutral-700 overflow-hidden">
          <div class="h-full rounded-full" style="width:${pct}%; background:${over ? '#ef4444' : m.color}"></div>
        </div>
      </button>
    `;
  }).join('');

  const microRows = MICROS.map(mi => `
    <div class="flex justify-between py-1.5 border-b border-neutral-900 last:border-0">
      <span class="text-xs text-slate-400">${mi.label}</span>
      <span class="text-xs text-white font-semibold">${totals[mi.key].toFixed(mi.unit==='mg'?0:1)} ${mi.unit}</span>
    </div>
  `).join('');

  const mealCount = mealsInRange(activeRange).length;

  return `
    <div class="space-y-4 ${animate ? 'fade-in' : ''}">
      <div class="flex items-center gap-2">
        <div class="w-9 h-9 rounded-xl flex items-center justify-center shrink-0" style="background:linear-gradient(135deg,var(--mod-nutricao-from),var(--mod-nutricao-to));">
          <i data-lucide="trending-up" class="w-5 h-5 text-white"></i>
        </div>
        <div><h2 class="text-sm font-bold text-white leading-none">Evolução</h2>
        <p class="text-[11px] text-slate-500 mt-1">${mealCount} refeição(ões) no período</p></div>
      </div>

      <div class="flex gap-2">
        ${['hoje','semana','mes'].map(r => `
          <button onclick="setRange('${r}')"
            class="range-chip ${activeRange===r?'active':''} flex-1 border border-neutral-700 rounded-xl py-2 text-xs font-semibold text-slate-300 transition">
            ${r==='hoje'?'Hoje':r==='semana'?'Esta Semana':'Este Mês'}
          </button>
        `).join('')}
      </div>

      <p class="text-[11px] text-slate-500 px-1">${rangeLabel} · meta proporcional a ${daysElapsed} dia(s)</p>

      <div class="grid grid-cols-2 gap-3">${macroCards}</div>

      <div class="card rounded-2xl p-4">
        <div class="flex items-center gap-2 mb-3">
          <i data-lucide="bar-chart-3" class="w-4 h-4 text-[var(--accent)]"></i>
          <h2 class="text-sm font-semibold text-white">${MACROS.find(m=>m.key===selectedMacro).label} por Dia</h2>
        </div>
        ${state.meals.length ? `<canvas id="dashChart" height="190"></canvas>` : `<p class="text-xs text-slate-500">Regista a tua primeira refeição para veres o gráfico.</p>`}
      </div>

      <div class="card rounded-2xl p-4">
        <button onclick="toggleMicros()" class="w-full flex items-center justify-between ${microsCollapsed ? '' : 'mb-2'}">
          <div class="flex items-center gap-2">
            <i data-lucide="microscope" class="w-4 h-4 text-[var(--accent)]"></i>
            <h2 class="text-sm font-semibold text-white">Micronutrientes · ${rangeLabel}</h2>
          </div>
          <i data-lucide="${microsCollapsed ? 'chevron-down' : 'chevron-up'}" class="w-4 h-4 text-slate-500"></i>
        </button>
        ${microsCollapsed ? '' : microRows}
      </div>
    </div>
  `;
}

function renderDashChart(){
  const canvas = document.getElementById('dashChart');
  if (!canvas) return;
  if (dashChart) { dashChart.destroy(); dashChart = null; }

  const macro = MACROS.find(m => m.key === selectedMacro);
  const { start, end } = rangeBounds(activeRange);
  const byDay = {};
  for (let d = new Date(start); d.toISOString().slice(0,10) <= end; d.setDate(d.getDate()+1)) {
    byDay[d.toISOString().slice(0,10)] = 0;
  }
  state.meals.forEach(meal => {
    if (meal.date >= start && meal.date <= end) {
      byDay[meal.date] = (byDay[meal.date] || 0) + mealNutrients(meal)[macro.key];
    }
  });
  const days = Object.keys(byDay).sort();
  const goal = Number(state.profile?.[macro.goalKey]) || 0;

  Chart.defaults.color = theme === 'light' ? '#475569' : '#a1a1aa';
  dashChart = new Chart(canvas, {
    data: {
      labels: days.map(d => d.slice(8,10) + '/' + d.slice(5,7)),
      datasets: [
        { type:'bar', label:`${macro.label} (${macro.unit})`, data:days.map(d=>byDay[d]), backgroundColor:hexToRgba(macro.color, 0.6), borderRadius:4 },
        { type:'line', label:'Meta', data:days.map(()=>goal), borderColor:'#ef4444', borderDash:[6,4], pointRadius:0, borderWidth:1.5 },
      ]
    },
    options: {
      responsive:true,
      plugins:{ legend:{ labels:{ boxWidth:10, font:{size:10} } } },
      scales: {
        y: { beginAtZero:true, grid:{ color: theme === 'light' ? 'rgba(154,116,74,0.45)' : 'rgba(232,163,66,0.3)' } },
        x: { grid:{ display:false } }
      }
    }
  });
}

/* ============================= CALENDÁRIO ============================= */
function renderCalendario(){
  const monthMeals = mealsForMonth(calendarViewMonth);
  const [y, m] = calendarViewMonth.split('-').map(Number);
  const firstOfMonth = new Date(y, m - 1, 1);
  const daysInMonth = new Date(y, m, 0).getDate();
  const firstWeekday = (firstOfMonth.getDay() + 6) % 7; // 0 = Segunda
  const monthLabel = `${PT_MONTHS[m-1]} ${y}`;
  const todayIso = todayISO();

  const cells = Array(firstWeekday).fill(null);
  for (let d = 1; d <= daysInMonth; d++) {
    cells.push(`${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`);
  }

  return `
    <div class="space-y-4 fade-in">
      <button onclick="goToRegistarForDate(calendarSelectedDate)"
        class="w-full bg-[var(--accent)] text-neutral-950 font-bold text-sm rounded-2xl py-3.5 flex items-center justify-center gap-2 active:scale-[0.98] transition shadow-lg">
        <i data-lucide="camera" class="w-5 h-5"></i> Registar Refeição
      </button>

      <div class="card rounded-2xl p-4">
        <div class="flex items-center justify-between mb-4">
          <button onclick="changeCalendarMonth(-1)" aria-label="Mês anterior" class="tap-44 flex items-center justify-center text-slate-400 hover:text-white">
            <i data-lucide="chevron-left" class="w-5 h-5"></i>
          </button>
          <h2 class="text-sm font-bold text-white capitalize">${monthLabel}</h2>
          <button onclick="changeCalendarMonth(1)" aria-label="Mês seguinte" class="tap-44 flex items-center justify-center text-slate-400 hover:text-white">
            <i data-lucide="chevron-right" class="w-5 h-5"></i>
          </button>
        </div>

        <div class="grid grid-cols-7 gap-1 mb-1">
          ${['Seg','Ter','Qua','Qui','Sex','Sáb','Dom'].map(d => `<div class="text-center text-[10px] text-slate-600 font-semibold">${d}</div>`).join('')}
        </div>

        ${monthMeals === null ? `
          <div class="flex items-center justify-center h-40 text-slate-500 text-xs gap-2">
            <i data-lucide="loader-2" class="w-4 h-4 animate-spin"></i> A carregar...
          </div>
        ` : `
        <div class="grid grid-cols-7 gap-1">
          ${cells.map(dateIso => {
            if (!dateIso) return `<div></div>`;
            const status = dayNutrientStatus(dateIso, monthMeals);
            const isToday = dateIso === todayIso;
            const isSelected = dateIso === calendarSelectedDate;
            const dotColor = status === 'ok' ? 'bg-emerald-500' : status === 'over' ? 'bg-red-500' : 'bg-neutral-700';
            const dayNum = Number(dateIso.slice(8,10));
            return `
              <button onclick="selectCalendarDay('${dateIso}')"
                class="aspect-square flex flex-col items-center justify-center rounded-xl text-xs transition
                  ${isSelected ? 'bg-[var(--accent)] text-neutral-950 font-bold' : isToday ? 'border border-[var(--accent)]/60 text-white' : 'text-slate-300 hover:bg-neutral-800'}">
                ${dayNum}
                <span class="w-1.5 h-1.5 rounded-full mt-0.5 ${dotColor}"></span>
              </button>
            `;
          }).join('')}
        </div>
        `}

        <div class="flex flex-wrap items-center gap-x-3 gap-y-1 mt-4 pt-3 border-t border-neutral-800 text-[10px] text-slate-500">
          <span class="flex items-center gap-1"><span class="w-2 h-2 rounded-full bg-emerald-500"></span> Objetivos cumpridos</span>
          <span class="flex items-center gap-1"><span class="w-2 h-2 rounded-full bg-red-500"></span> Excedeu um macro</span>
          <span class="flex items-center gap-1"><span class="w-2 h-2 rounded-full bg-neutral-700"></span> Sem registos</span>
        </div>
      </div>

      <div class="space-y-3">
        <h2 class="text-xs font-semibold text-slate-500 uppercase tracking-wide px-1">${formatDatePT(calendarSelectedDate)}</h2>
        ${renderCalendarDaySummary(monthMeals)}
        <div id="calendarDayMeals" class="space-y-3">${renderCalendarDayMeals(monthMeals)}</div>
      </div>
    </div>
  `;
}

// Resumo do dia selecionado: total vs meta de cada macro, só aparece quando
// pelo menos um foi excedido (o motivo do ponto vermelho no calendário) — dá
// a resposta direta a "o que foi excedido", em vez de obrigar a comparar
// manualmente cada refeição contra as metas do Perfil.
function renderCalendarDaySummary(monthMeals){
  if (monthMeals === null) return '';
  const dayMeals = monthMeals.filter(m => m.date === calendarSelectedDate);
  if (dayMeals.length === 0) return '';
  const totals = { calories:0, protein:0, carbs:0, fat:0 };
  dayMeals.forEach(meal => {
    const n = mealNutrients(meal);
    totals.calories += n.calories; totals.protein += n.protein;
    totals.carbs += n.carbs; totals.fat += n.fat;
  });
  const p = state.profile || {};
  const rows = MACROS.map(m => {
    const goal = Number(p[m.goalKey]) || 0;
    const value = totals[m.key];
    const hasGoal = goal > 0;
    const over = hasGoal && value > goal;
    return { m, value, goal, hasGoal, over };
  }).filter(r => r.hasGoal);
  const anyOver = rows.some(r => r.over);
  if (!anyOver) return '';

  return `

            <span class="${r.over ? 'text-red-300 font-semibold' : 'text-slate-500'}">${r.value.toFixed(0)} / ${r.goal.toFixed(0)} ${r.m.unit}</span>

}

// Atualiza só a lista de refeições do dia selecionado (sem recriar o
// calendário todo) — usada ao expandir/colapsar uma refeição no Calendário,
// para evitar o "piscar" do ecrã inteiro que a re-renderização completa
// (com a animação fade-in a repetir) causava a cada toque.
function refreshCalendarDayMeals(){
  const container = document.getElementById('calendarDayMeals');
  if (!container) return;
  container.innerHTML = renderCalendarDayMeals(mealsForMonth(calendarViewMonth));
  if (window.lucide) lucide.createIcons();
}

function renderCalendarDayMeals(monthMeals){
  if (monthMeals === null) return '';
  const dayMeals = monthMeals
    .filter(m => m.date === calendarSelectedDate)
    .sort((a,b) => (a.created_at||'').localeCompare(b.created_at||''));
  if (dayMeals.length === 0) return `<p class="text-xs text-slate-500 px-1">Sem refeições registadas neste dia.</p>`;
  return dayMeals.map(renderMealCard).join('');
}

// Renderizador de Markdown mínimo — escapa HTML primeiro, depois aplica formatação.
function renderMarkdown(md) {
  let s = md
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

  // Blocos de código (``` ... ```)
  s = s.replace(/```(?:\w*\n)?([\s\S]*?)```/g,
    (_, c) => `<pre>${c.trimEnd()}</pre>`);
  // Código inline
  s = s.replace(/`([^`\n]+)`/g, '<code>$1</code>');
  // Negrito e itálico
  s = s.replace(/\*\*\*(.+?)\*\*\*/g, '<strong><em>$1</em></strong>');
  s = s.replace(/\*\*(.+?)\*\*/g,     '<strong>$1</strong>');
  s = s.replace(/\*(.+?)\*/g,         '<em>$1</em>');
  // Cabeçalhos
  s = s.replace(/^### (.+)$/gm, '<p class="font-semibold text-white text-[11px] uppercase tracking-wide mt-3 mb-0.5">$1</p>');
  s = s.replace(/^## (.+)$/gm,  '<p class="font-bold text-white mt-3 mb-1">$1</p>');
  s = s.replace(/^# (.+)$/gm,   '<p class="font-bold text-white text-base mt-3 mb-1">$1</p>');
  // Linha horizontal
  s = s.replace(/^-{3,}$/gm, '<hr class="border-neutral-700 my-3" />');
  // Listas não ordenadas
  s = s.replace(/^[\-\*] (.+)$/gm, '<li>$1</li>');
  // Listas ordenadas
  s = s.replace(/^\d+\. (.+)$/gm, '<li>$1</li>');
  // Agrupar <li> consecutivos
  s = s.replace(/(<li>[\s\S]*?<\/li>\n?)+/g, m => `<ul>${m}</ul>`);
  // Quebras de linha
  s = s.replace(/\n\n/g, '<br><br>').replace(/\n/g, '<br>');

  return `<div class="md-body">${s}</div>`;
}

function coachSuggestion(text) {

async function sendCoachMessage() {
  const textarea = document.getElementById('coachInputEl');
  if (!textarea) return;
  const text = textarea.value.trim();
  if (!text || coachLoading) return;

  coachLoading = true;
  coachSuggestions = [];

  // UI optimista: mostra a mensagem do utilizador imediatamente
  const tempMsg = { id: '__tmp__', role: 'user', content: text, created_at: new Date().toISOString() };
  coachMessages = [...coachMessages, tempMsg];
  textarea.value = '';
  textarea.style.height = 'auto';
  renderCoachInPlace();

  try {
    const { data: { session } } = await sb.auth.getSession();
    const res = await fetch(`${SUPABASE_URL}/functions/v1/coach-chat`, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${session.access_token}`,
        'apikey': SUPABASE_ANON_KEY,
      },
      body: JSON.stringify({ message: text }),
    });
    const data = await res.json();
    if (!res.ok) {
      const err = new Error(data.error || 'Erro no coach');
      err.detail = data.detail || null;
      throw err;
    }

    // Substitui a mensagem temporária pelas guardadas na BD + resposta do modelo
    coachMessages = coachMessages.filter(m => m.id !== '__tmp__');
    coachMessages.push(data.user_message, data.model_message);
    coachSuggestions = Array.isArray(data.suggestions) ? data.suggestions : [];
    logEvent('success', 'coach_message', null, data.usage || null);
  } catch(e) {
    console.error(e);
    showToast('error', null, aiErrorMessage(e, 'Erro inesperado. Tenta novamente.'));
    coachMessages = coachMessages.filter(m => m.id !== '__tmp__');
    logEvent('error', 'coach_message', e.message || 'erro desconhecido', e.detail ? { detail: e.detail } : null);
  }

  coachLoading = false;
  renderCoachInPlace();
}
