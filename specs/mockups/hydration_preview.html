<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hydration Tracker – Tema Claro Preview</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #eaeef4;
    font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 16px 48px;
    gap: 32px;
  }
  h1 { font-size: .8rem; font-weight: 700; color: #516071; letter-spacing: .08em; text-transform: uppercase; margin-top: 8px; }

  /* ======== CARD WRAPPER ======== */
  .card {
    width: 100%;
    max-width: 380px;
    background: linear-gradient(145deg, rgba(255,255,255,.92), rgba(233,237,243,.85));
    border: 1px solid rgba(255,255,255,.9);
    border-radius: 28px;
    box-shadow:
      0 1px 0 rgba(255,255,255,.9) inset,
      0 20px 60px -12px rgba(62,107,130,.22),
      0 4px 16px rgba(62,107,130,.1),
      0 1px 3px rgba(15,23,42,.06);
    padding: 28px 24px 24px;
    backdrop-filter: blur(12px);
    position: relative;
    overflow: hidden;
  }

  /* soft teal glow behind bottle */
  .card::before {
    content: '';
    position: absolute;
    top: 30px; left: 50%; transform: translateX(-50%);
    width: 220px; height: 220px;
    background: radial-gradient(circle, rgba(111,156,178,.25) 0%, transparent 70%);
    pointer-events: none;
  }

  /* header */
  .card-label {
    font-size: .65rem; font-weight: 700; letter-spacing: .1em;
    color: #3e6b82; text-transform: uppercase; text-align: center; margin-bottom: 2px;
  }
  .card-title {
    font-size: 1.25rem; font-weight: 800; color: #0f172a;
    text-align: center; margin-bottom: 20px;
  }

  /* ======== BOTTLE + RING ======== */
  .bottle-area {
    position: relative;
    width: 190px; height: 190px;
    margin: 0 auto 24px;
    display: flex; align-items: center; justify-content: center;
  }

  /* Circular ring progress */
  .ring-svg {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    transform: rotate(-90deg);
  }
  .ring-bg { fill: none; stroke: rgba(62,107,130,.12); stroke-width: 6; }
  .ring-progress {
    fill: none;
    stroke: url(#ringGrad);
    stroke-width: 6;
    stroke-linecap: round;
    stroke-dasharray: 502;
    stroke-dashoffset: 502;
    transition: stroke-dashoffset 1.2s cubic-bezier(.4,0,.2,1);
    filter: drop-shadow(0 0 6px rgba(62,107,130,.5));
  }

  /* Bottle SVG */
  .bottle-wrap {
    position: relative;
    width: 90px; height: 130px;
    flex-shrink: 0;
  }
  .bottle-svg { width: 100%; height: 100%; overflow: visible; }

  /* percentage label in center */
  .pct-label {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: flex-end;
    padding-bottom: 18px;
    pointer-events: none;
  }
  .pct-num {
    font-size: 1.4rem; font-weight: 900; color: #0f172a;
    line-height: 1; text-shadow: 0 1px 4px rgba(255,255,255,.8);
  }
  .pct-sub { font-size: .55rem; font-weight: 700; color: #3e6b82; letter-spacing: .08em; text-transform: uppercase; }

  /* ======== CAPSULE BAR ======== */
  .bar-section { margin-bottom: 20px; }
  .bar-row { display: flex; gap: 4px; height: 22px; }
  .capsule-track {
    position: relative;
    flex: 1;
    background: rgba(62,107,130,.1);
    border-radius: 999px;
    overflow: hidden;
    border: 1px solid rgba(62,107,130,.15);
  }
  /* continuous fill */
  .capsule-fill {
    position: absolute; top: 0; left: 0; bottom: 0;
    background: linear-gradient(90deg, #3e6b82, #6f9cb2);
    border-radius: 999px;
    transition: width 0.8s cubic-bezier(.4,0,.2,1);
    box-shadow: 0 0 10px rgba(62,107,130,.4), 2px 0 8px rgba(111,156,178,.3);
  }
  /* divider overlay — creates capsule look */
  .capsule-dividers {
    position: absolute; inset: 0;
    display: flex; pointer-events: none;
  }
  .capsule-dividers span {
    flex: 1;
    border-right: 2px solid rgba(234,238,244,.8);
  }
  .capsule-dividers span:last-child { border-right: none; }

  .bar-info { display: flex; justify-content: space-between; margin-top: 8px; }
  .bar-ml { font-size: .85rem; font-weight: 800; color: #0f172a; }
  .bar-goal { font-size: .75rem; font-weight: 600; color: #516071; }

  /* ======== BUTTONS ======== */
  .btns { display: flex; gap: 10px; }
  .btn-add {
    flex: 1; height: 48px;
    background: linear-gradient(135deg, #ec8871, #d46957);
    border: none; border-radius: 16px;
    color: #fff; font-size: .9rem; font-weight: 800;
    cursor: pointer;
    box-shadow: 0 4px 14px rgba(236,136,113,.4), 0 1px 3px rgba(15,23,42,.12);
    transition: transform .15s ease, box-shadow .15s ease;
    position: relative; overflow: hidden;
  }
  .btn-add::after {
    content: '';
    position: absolute; inset: 0;
    background: linear-gradient(180deg, rgba(255,255,255,.2), transparent);
    border-radius: inherit;
  }
  .btn-add:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(236,136,113,.5); }
  .btn-add:active { transform: scale(.97); }

  /* wave animation */
  @keyframes waveScroll { from { transform: translateX(0); } to { transform: translateX(-80px); } }
  @keyframes waveScroll2 { from { transform: translateX(0); } to { transform: translateX(80px); } }
  @keyframes shimmer { 0%,100%{opacity:.4} 50%{opacity:.9} }
  @keyframes bubbleRise { 0%{transform:translateY(0);opacity:.6} 100%{transform:translateY(-40px);opacity:0} }

  .wave1 { animation: waveScroll 3s linear infinite; }
  .wave2 { animation: waveScroll2 4.5s linear infinite; }
  .bubble { animation: bubbleRise 3s ease-in infinite; }
  .bubble:nth-child(2) { animation-delay: 1s; }
  .bubble:nth-child(3) { animation-delay: 2s; }

  /* glitter sparkles */
  @keyframes sparkle { 0%,100%{opacity:0;transform:scale(0)} 50%{opacity:1;transform:scale(1)} }
  .spark { animation: sparkle 2s ease-in-out infinite; }
  .spark:nth-child(2){animation-delay:.7s}
  .spark:nth-child(3){animation-delay:1.4s}

  /* ring pulse */
  @keyframes ringPulse { 0%,100%{filter:drop-shadow(0 0 4px rgba(62,107,130,.4))} 50%{filter:drop-shadow(0 0 12px rgba(111,156,178,.8))} }
  .ring-progress { animation: ringPulse 3s ease-in-out infinite; }

  .controls { font-size:.7rem; color:#516071; text-align:center; margin-top:-12px; }
</style>
</head>
<body>
<h1>IronHealth – Hydration Preview (Tema Claro)</h1>

<div class="card">
  <p class="card-label">Daily Hydration</p>
  <p class="card-title">Mantém-te hidratado 💧</p>

  <div class="bottle-area">
    <!-- Circular ring SVG -->
    <svg class="ring-svg" viewBox="0 0 190 190">
      <defs>
        <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%" stop-color="#3e6b82"/>
          <stop offset="100%" stop-color="#6f9cb2"/>
        </linearGradient>
      </defs>
      <circle class="ring-bg" cx="95" cy="95" r="80"/>
      <circle class="ring-progress" id="ringEl" cx="95" cy="95" r="80"/>
    </svg>

    <!-- Bottle SVG -->
    <div class="bottle-wrap">
      <svg class="bottle-svg" viewBox="0 0 90 130" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="waterGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#6f9cb2" stop-opacity=".95"/>
            <stop offset="100%" stop-color="#3e6b82" stop-opacity=".98"/>
          </linearGradient>
          <linearGradient id="glassGrad" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0%" stop-color="rgba(255,255,255,.6)"/>
            <stop offset="40%" stop-color="rgba(255,255,255,.05)"/>
            <stop offset="100%" stop-color="rgba(255,255,255,.35)"/>
          </linearGradient>
          <clipPath id="bottleClip">
            <path d="M28,18 L62,18 L66,28 L70,40 L70,118 Q70,126 62,126 L28,126 Q20,126 20,118 L20,40 L24,28 Z"/>
          </clipPath>
          <filter id="glow">
            <feGaussianBlur stdDeviation="2" result="blur"/>
            <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
          </filter>
        </defs>

        <!-- bottle body outline -->
        <path d="M28,18 L62,18 L66,28 L70,40 L70,118 Q70,126 62,126 L28,126 Q20,126 20,118 L20,40 L24,28 Z"
          fill="rgba(62,107,130,.08)" stroke="rgba(62,107,130,.35)" stroke-width="1.5"/>

        <!-- water fill (clipped) -->
        <g clip-path="url(#bottleClip)">
          <!-- fill level — set dynamically -->
          <rect id="waterFill" x="18" width="54" fill="url(#waterGrad)" y="50" height="80"/>
          <!-- wave 1 -->
          <g id="waveG1" class="wave1">
            <path d="M-10,50 Q0,44 10,50 Q20,56 30,50 Q40,44 50,50 Q60,56 70,50 Q80,44 90,50 Q100,56 110,50 L110,130 L-10,130 Z"
              fill="rgba(111,156,178,.7)"/>
          </g>
          <!-- wave 2 -->
          <g id="waveG2" class="wave2" opacity=".5">
            <path d="M-10,52 Q0,47 10,52 Q20,57 30,52 Q40,47 50,52 Q60,57 70,52 Q80,47 90,52 Q100,57 110,52 L110,130 L-10,130 Z"
              fill="rgba(62,107,130,.6)"/>
          </g>
          <!-- bubbles -->
          <circle class="bubble" cx="35" cy="80" r="2" fill="rgba(255,255,255,.6)"/>
          <circle class="bubble" cx="50" cy="90" r="1.5" fill="rgba(255,255,255,.5)"/>
          <circle class="bubble" cx="42" cy="100" r="1" fill="rgba(255,255,255,.4)"/>
          <!-- sparkles -->
          <circle class="spark" cx="40" cy="62" r="1.5" fill="rgba(255,255,255,.9)"/>
          <circle class="spark" cx="55" cy="70" r="1" fill="rgba(255,255,255,.8)"/>
          <circle class="spark" cx="30" cy="75" r="1.2" fill="rgba(255,255,255,.7)"/>
        </g>

        <!-- glass shine overlay -->
        <path d="M28,18 L62,18 L66,28 L70,40 L70,118 Q70,126 62,126 L28,126 Q20,126 20,118 L20,40 L24,28 Z"
          fill="url(#glassGrad)" opacity=".8"/>

        <!-- cap -->
        <rect x="30" y="10" width="30" height="10" rx="4" fill="rgba(62,107,130,.7)"/>
        <rect x="34" y="6" width="22" height="6" rx="3" fill="rgba(62,107,130,.85)"/>
        <!-- cap shine -->
        <rect x="35" y="7" width="8" height="2" rx="1" fill="rgba(255,255,255,.4)"/>
      </svg>

      <!-- percentage overlay -->
      <div class="pct-label">
        <span class="pct-num" id="pctNum">72%</span>
        <span class="pct-sub">hidratado</span>
      </div>
    </div>
  </div>

  <!-- Capsule progress bar -->
  <div class="bar-section">
    <div class="bar-row">
      <div class="capsule-track">
        <div class="capsule-fill" id="capsuleFill" style="width:72%"></div>
        <div class="capsule-dividers" id="dividers"></div>
      </div>
    </div>
    <div class="bar-info">
      <span class="bar-ml"><span id="consumed">1800</span> ml</span>
      <span class="bar-goal">/ <span id="goalVal">2500</span> ml</span>
    </div>
  </div>

  <!-- Add buttons -->
  <div class="btns">
    <button class="btn-add" onclick="addWater(200)">+ 200 ml</button>
    <button class="btn-add" onclick="addWater(250)">+ 250 ml</button>
  </div>
</div>

<p class="controls">↑ Protótipo interativo — clica nos botões para testar</p>

<script>
  const GOAL = 2500;
  let consumed = 1800;

  function getNumSegments(goal) {
    // dynamic segments: ~10, but always an integer
    return 10;
  }

  function buildDividers() {
    const n = getNumSegments(GOAL);
    const div = document.getElementById('dividers');
    div.innerHTML = '';
    for (let i = 0; i < n; i++) {
      const s = document.createElement('span');
      div.appendChild(s);
    }
  }

  function updateRing(pct) {
    const circumference = 2 * Math.PI * 80; // 502.65
    const offset = circumference * (1 - pct / 100);
    document.getElementById('ringEl').style.strokeDashoffset = offset;
  }

  function updateBottle(pct) {
    // Water fill: bottle clip area is y=18 to y=126 (108px tall)
    const fillHeight = 108 * (pct / 100);
    const yStart = 126 - fillHeight;
    const waterFill = document.getElementById('waterFill');
    waterFill.setAttribute('y', yStart);
    waterFill.setAttribute('height', fillHeight + 10);
    // Also move wave groups
    const waveY = yStart;
    document.getElementById('waveG1').setAttribute('transform', `translate(0, ${waveY - 50})`);
    document.getElementById('waveG2').setAttribute('transform', `translate(0, ${waveY - 50})`);
  }

  function render() {
    const pct = Math.min(100, Math.round((consumed / GOAL) * 100));
    document.getElementById('pctNum').textContent = pct + '%';
    document.getElementById('consumed').textContent = consumed;
    document.getElementById('capsuleFill').style.width = pct + '%';
    updateRing(pct);
    updateBottle(pct);
  }

  function addWater(ml) {
    consumed = Math.min(GOAL, consumed + ml);
    render();
  }

  buildDividers();
  // init ring dasharray
  document.getElementById('ringEl').style.strokeDasharray = '502';
  render();
</script>
</body>
</html>
