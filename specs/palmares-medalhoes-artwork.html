<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<title>Medalhão IronCoach — artwork de referência</title>
<!-- Referência visual de specs/palmares-medalhoes.md (renderização final,
     2026-09-15). Medalhão pequeno com estrela .33 / encaixe .34: com a
     estrela a 1.4× a escala .42 sobrepunha-as. -->

<style>
  body { margin: 0; padding: 40px 0 80px; background: #080c16; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif; }

  /* ── 1. O disco de latão (Apple UI Look) ─────────────────────────── */
  .medal-rim {
    position: absolute; inset: 0; border-radius: 50%;
    background: conic-gradient(from 180deg,
      #3d2509 0deg, #d4a956 45deg, #fff4cc 90deg, #d4a956 135deg,
      #3d2509 180deg, #d4a956 225deg, #fff4cc 270deg, #d4a956 315deg, #3d2509 360deg);
    box-shadow:
      0 32px 64px -12px rgba(0,0,0,0.8),
      0 16px 24px -8px rgba(0,0,0,0.6),
      inset 0 4px 6px rgba(255,255,255,0.7),
      inset 0 -6px 12px rgba(0,0,0,0.9),
      inset 0 0 0 1px rgba(255,244,204,0.4);
  }
  .medal-face {
    position: absolute; inset: 12px; border-radius: 50%;
    background: radial-gradient(130% 130% at 50% 0%, #fdf0c6 0%, #c49948 40%, #633f0f 80%, #201202 100%);
    box-shadow:
      inset 0 4px 10px rgba(0,0,0,0.6),
      inset 0 -2px 6px rgba(255,255,255,0.2),
      inset 0 0 0 1px rgba(0,0,0,0.8);
  }
  .medal-grain {
    position: absolute; inset: 12px; border-radius: 50%; opacity: 0.25; mix-blend-mode: overlay; pointer-events: none;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='1.5' numOctaves='3' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='240' height='240' filter='url(%23n)'/></svg>");
  }
  .medal-sheen {
    position: absolute; inset: 12px; border-radius: 50%; pointer-events: none;
    background:
      linear-gradient(180deg, rgba(255,255,255,0.45) 0%, rgba(255,255,255,0) 25%),
      radial-gradient(ellipse at 50% 100%, rgba(255,236,190,0.15) 0%, transparent 50%);
    mix-blend-mode: screen;
  }
  .medal-ring {
    position: absolute; inset: 34px; border-radius: 50%; pointer-events: none;
    box-shadow:
      inset 0 1px 2px rgba(255,255,255,0.3),
      inset 0 -1px 2px rgba(0,0,0,0.6),
      0 1px 2px rgba(255,255,255,0.3),
      0 -1px 2px rgba(0,0,0,0.6),
      0 0 0 1px rgba(40,20,5,0.9);
  }
  .medal-engrave {
    position: absolute; left: 0; right: 0; text-align: center; pointer-events: none;
    color: rgba(40,20,5,0.9);
    text-shadow: 0 1px 1px rgba(255,255,255,0.3), 0 -1px 1px rgba(0,0,0,0.8);
    mix-blend-mode: multiply; 
  }

  .medal-sm .medal-face, .medal-sm .medal-grain, .medal-sm .medal-sheen { inset: 5px; }
  .medal-sm .medal-rim { 
    box-shadow: 0 16px 32px rgba(0,0,0,.7), inset 0 2px 4px rgba(255,255,255,.6), inset 0 -3px 6px rgba(0,0,0,.9); 
  }

  .demo { width: 390px; margin: 0 auto; display: flex; flex-direction: column; align-items: center; gap: 60px; }
</style>
</head>
<body>

<!-- ── 2. A biblioteca de formas ────────────────────────────────────── -->
<svg width="0" height="0" style="position: absolute;">
  <defs>
    <radialGradient id="enam-amber" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#fff2c2"></stop>
      <stop offset="30%" stop-color="#f59e0b"></stop>
      <stop offset="100%" stop-color="#5a1f0a"></stop>
    </radialGradient>
    <radialGradient id="enam-cyan" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#e0faff"></stop>
      <stop offset="30%" stop-color="#14b8d6"></stop>
      <stop offset="100%" stop-color="#053342"></stop>
    </radialGradient>
    <linearGradient id="silver-ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"></stop>
      <stop offset="40%" stop-color="#94a3b8"></stop>
      <stop offset="60%" stop-color="#e2e8f0"></stop>
      <stop offset="100%" stop-color="#475569"></stop>
    </linearGradient>
    
    <linearGradient id="rib-a" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f59e0b"></stop>
      <stop offset="100%" stop-color="#4a1a0c"></stop>
    </linearGradient>
    <linearGradient id="rib-b" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e86a6"></stop>
      <stop offset="100%" stop-color="#041a24"></stop>
    </linearGradient>

    <!-- Sombra ajustada para o novo tamanho -->
    <filter id="star-drop" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="7" stdDeviation="5.5" flood-color="rgba(0,0,0,.8)"></feDropShadow>
    </filter>
    
    <filter id="inset-deep" x="-40%" y="-40%" width="180%" height="180%">
      <feOffset in="SourceAlpha" dx="0" dy="4" result="o"></feOffset>
      <feGaussianBlur in="o" stdDeviation="3" result="b"></feGaussianBlur>
      <feComposite in="SourceAlpha" in2="b" operator="out" result="mask"></feComposite>
      <feFlood flood-color="rgba(0,0,0,.95)"></feFlood>
      <feComposite in2="mask" operator="in" result="shadow"></feComposite>
      <feComposite in="shadow" in2="SourceGraphic" operator="over"></feComposite>
    </filter>

    <g id="star-ag">
      <polygon points="0,0 -6.7,-9.3 0,-30" fill="#ffffff"></polygon>
      <polygon points="0,0 0,-30 6.7,-9.3" fill="#94a3b8"></polygon>
      <polygon points="0,0 6.7,-9.3 28.5,-9.3" fill="#f8fafc"></polygon>
      <polygon points="0,0 28.5,-9.3 10.9,3.5" fill="#64748b"></polygon>
      <polygon points="0,0 10.9,3.5 17.6,24.3" fill="#cbd5e1"></polygon>
      <polygon points="0,0 17.6,24.3 0,11.5" fill="#475569"></polygon>
      <polygon points="0,0 0,11.5 -17.6,24.3" fill="#e2e8f0"></polygon>
      <polygon points="0,0 -17.6,24.3 -10.9,3.5" fill="#64748b"></polygon>
      <polygon points="0,0 -10.9,3.5 -28.5,-9.3" fill="#ffffff"></polygon>
      <polygon points="0,0 -28.5,-9.3 -6.7,-9.3" fill="#94a3b8"></polygon>
    </g>

    <!-- O encaixe cresceu (scale 1.23) para albergar a estrela maior -->
    <g id="star-socket">
      <g transform="scale(1.23)">
        <polygon transform="translate(0,2) scale(1.05)" points="0,-30 6.7,-9.3 28.5,-9.3 10.9,3.5 17.6,24.3 0,11.5 -17.6,24.3 -10.9,3.5 -28.5,-9.3 -6.7,-9.3" fill="none" stroke="rgba(255,240,205,.4)" stroke-width="1.5"></polygon>
        <polygon points="0,-30 6.7,-9.3 28.5,-9.3 10.9,3.5 17.6,24.3 0,11.5 -17.6,24.3 -10.9,3.5 -28.5,-9.3 -6.7,-9.3" fill="#3d2509" filter="url(#inset-deep)"></polygon>
        <circle r="3.5" fill="#0f0701"></circle>
        <circle r="3.5" cy="1" fill="none" stroke="rgba(255,255,255,.2)" stroke-width="1"></circle>
      </g>
    </g>

    <g id="medal-amber">
      <!-- A estrela base agora usa scale(1.4) em vez de 1.14 -->
      <g filter="url(#star-drop)"><use href="#star-ag" transform="scale(1.4)"></use></g>
      <!-- A joia e o anel passaram de 14.5px para 17px -->
      <circle r="17" fill="url(#enam-amber)"></circle>
      <circle r="17" fill="none" stroke="url(#silver-ring)" stroke-width="2.5"></circle>
      <!-- O reflexo da joia foi recalculado para o novo arco -->
      <path d="M -10 -7.5 A 12 12 0 0 1 7.5 -11" fill="none" stroke="rgba(255,255,255,.85)" stroke-width="2.5" stroke-linecap="round"></path>
    </g>
    
    <g id="medal-cyan">
      <g filter="url(#star-drop)"><use href="#star-ag" transform="scale(1.4)"></use></g>
      <circle r="17" fill="url(#enam-cyan)"></circle>
      <circle r="17" fill="none" stroke="url(#silver-ring)" stroke-width="2.5"></circle>
      <path d="M -10 -7.5 A 12 12 0 0 1 7.5 -11" fill="none" stroke="rgba(255,255,255,.85)" stroke-width="2.5" stroke-linecap="round"></path>
    </g>
  </defs>
</svg>

<div class="demo">
  <!-- ── 3a. O medalhão grande ──────────────────────────────────────── -->
  <div style="position: relative; width: 300px; height: 300px; margin-top: 60px;">
    
    <svg style="position: absolute; left: 50%; top: -56px; width: 200px; height: 110px; margin-left: -100px;" viewBox="0 0 200 110">
      <!-- (Path da fita mantém-se igual) -->
      <path d="M168,0 L110,100 L64,100 L122,0 Z" fill="url(#rib-b)" stroke="rgba(0,0,0,.5)" stroke-width="1"></path>
      <path d="M146,0 L92,94 L104,94 L158,0 Z" fill="rgba(255,255,255,.12)"></path>
      <path d="M162,4 L106,96" fill="none" stroke="rgba(255,255,255,.4)" stroke-width="1.2" stroke-dasharray="2.5 4"></path>
      <path d="M128,4 L72,96" fill="none" stroke="rgba(255,255,255,.3)" stroke-width="1.2" stroke-dasharray="2.5 4"></path>
      <path d="M78,0 L136,100 L148,100 L90,0 Z" fill="rgba(0,0,0,.45)"></path>
      <path d="M32,0 L90,100 L136,100 L78,0 Z" fill="url(#rib-a)" stroke="rgba(0,0,0,.5)" stroke-width="1"></path>
      <path d="M44,0 L100,94 L112,94 L56,0 Z" fill="rgba(255,255,255,.18)"></path>
      <path d="M38,4 L94,96" fill="none" stroke="rgba(255,255,255,.45)" stroke-width="1.2" stroke-dasharray="2.5 4"></path>
      <path d="M72,4 L128,96" fill="none" stroke="rgba(255,255,255,.35)" stroke-width="1.2" stroke-dasharray="2.5 4"></path>
      <path d="M32,0 L78,0 L74,7 L36,7 Z" fill="rgba(255,255,255,.25)"></path>
      <path d="M122,0 L168,0 L164,7 L126,7 Z" fill="rgba(255,255,255,.15)"></path>
    </svg>

    <div class="medal-rim"></div>
    <div class="medal-face"></div>
    <div class="medal-grain"></div>
    <div class="medal-sheen"></div>
    <div class="medal-ring"></div>

    <div class="medal-engrave" style="top: 84px;">
      <svg width="26" height="26" viewBox="0 0 26 26" style="margin: 0 auto; display: block;">
        <path d="M13,2 L23,8 L23,18 L13,24 L3,18 L3,8 Z" fill="none" stroke="currentColor" stroke-width="2"></path>
        <path d="M8,12 L13,7 L18,12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"></path>
        <path d="M8,17 L13,12 L18,17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"></path>
      </svg>
    </div>
    <div class="medal-engrave" style="top: 136px; font-size: 15px; font-weight: 900; letter-spacing: 2.5px;">O ANO EM KM</div>
    <div class="medal-engrave" style="top: 157px; font-size: 12px; font-weight: 800; letter-spacing: 4px;">2026</div>
    <div class="medal-engrave" style="top: 252px; font-size: 9px; font-weight: 700; letter-spacing: 1.5px; opacity: .85;">· 1 240 KM CORRIDOS ·</div>

    <svg style="position: absolute; inset: 0; overflow: visible;" width="300" height="300" viewBox="0 0 300 300">
      <use href="#star-socket" transform="translate(97,207)"></use>
      <use href="#star-socket" transform="translate(203,207)"></use>
      <g transform="translate(97,93)">
        <use href="#medal-amber"></use>
        <!-- Font size aumentado de 10 para 13 e alinhamento ajustado -->
        <text y="4.5" text-anchor="middle" font-size="13" font-weight="900" fill="#3c1d02" font-family="inherit">182</text>
      </g>
      <g transform="translate(203,93)">
        <use href="#medal-cyan"></use>
        <text y="4.5" text-anchor="middle" font-size="13" font-weight="900" fill="#04252b" font-family="inherit">410</text>
      </g>
    </svg>
  </div>

  <!-- ── 3b. O medalhão pequeno ─────────────────────────────────────── -->
  <div class="medal-sm" style="position: relative; width: 96px; height: 96px;">
    <div class="medal-rim"></div>
    <div class="medal-face"></div>
    <div class="medal-grain"></div>
    <div class="medal-sheen"></div>
    <svg style="position: absolute; inset: 0; overflow: visible;" width="96" height="96" viewBox="0 0 96 96">
      <g transform="translate(32,32) scale(.33)"><use href="#medal-amber"></use></g>
      <g transform="translate(64,32) scale(.33)"><use href="#medal-amber"></use></g>
      <use href="#star-socket" transform="translate(32,64) scale(.34)"></use>
      <use href="#star-socket" transform="translate(64,64) scale(.34)"></use>
    </svg>
  </div>
</div>
</body>
</html>
