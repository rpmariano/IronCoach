<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">

<script src="../../_ds_bundle.js"></script>

<body><div id="root"></div>
<script type="text/babel">
const NS = window.IronCoach || {};
const { BottomNav, SubNav, ActionBar, Button } = NS;
const I = (d) => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d={d}/></svg>;

function App(){ if(!BottomNav) return <div style={{color:'var(--text-4)',fontSize:12}}>Bundle não carregado — definir o tipo do ficheiro como Design System.</div>;

    </div>
    <div style={{display:'flex',flexDirection:'column',gap:14}}>

    </div>
  </div>; }
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script></body></html>
