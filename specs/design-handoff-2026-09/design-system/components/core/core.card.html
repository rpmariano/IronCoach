<!-- @dsCard group="Components" viewport="700x420" name="Core" subtitle="Button, IconButton, Chip, Field, GlassCard, SectionLabel" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script><script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script><script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{margin:0;background:var(--bg-app);font-family:var(--font-sans);color:var(--text-1);padding:16px 18px;box-sizing:border-box}*{box-sizing:border-box}</style></head>
<body><div id="root"></div>
<script type="text/babel">
const NS = window.IronCoach || {};
const { Button, IconButton, Chip, Field, GlassCard, SectionLabel } = NS;
const X = () => <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>;
const Check = () => <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M20 6 9 17l-5-5"/></svg>;
function App(){ if(!Button) return <div style={{color:'var(--text-4)',fontSize:12}}>Bundle não carregado — definir o tipo do ficheiro como Design System.</div>;
return <div style={{display:'flex',flexDirection:'column',gap:14}}>
  <div style={{display:'flex',gap:8,flexWrap:'wrap',alignItems:'center'}}>
    <Button tone="coach">Continuar</Button><Button tone="race">Marcar prova</Button><Button tone="ok" variant="tinted" icon={<Check/>}>Registar sessão</Button><Button tone="run" variant="tinted">Guardar</Button><Button variant="secondary">Cancelar</Button><Button variant="ghost">Saltar</Button><Button tone="coach" disabled>Guardar</Button>
    <IconButton label="Fechar"><X/></IconButton><IconButton label="Fechar" shape="round" variant="plain"><X/></IconButton>
  </div>
  <div style={{display:'flex',gap:8,flexWrap:'wrap',alignItems:'center'}}>
    <Chip tone="nutrition" selected>Sem lactose</Chip><Chip>Sem glúten</Chip><Chip tone="run" selected>Rodagem longa</Chip><Chip tone="ok" badge>Plano aceite</Chip><Chip tone="race" badge>Principal</Chip><Chip tone="warn" badge>Em curso</Chip><Chip tone="danger" badge>Aberto</Chip>
  </div>
  <div style={{display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:10}}>
    <Field label="Como te chamo?" value="Rui" tone="coach" focused/><Field label="FC em repouso (bpm)" placeholder="Ex.: 52"/><Field label="Distância" value="21,1 km"/>
  </div>
  <div style={{display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:10}}>
    <div><SectionLabel>Para onde vou</SectionLabel><GlassCard tone="race" glow style={{marginTop:8}}><div style={{fontSize:11,fontWeight:800,color:'var(--race)',textTransform:'uppercase',letterSpacing:'.05em'}}>Meia de Lisboa</div><div style={{fontSize:26,fontWeight:900,color:'var(--race)',marginTop:6,lineHeight:1}}>183</div></GlassCard></div>
    <div><SectionLabel>A Carol</SectionLabel><GlassCard tone="coach" radius="xl" style={{marginTop:8}}><div style={{fontSize:13,fontWeight:800,color:'var(--coach-soft)'}}>Precisa de falar contigo</div><div style={{fontSize:11,color:'var(--text-4)',marginTop:2}}>1 assunto a resolver</div></GlassCard></div>
    <div><SectionLabel>Como estou</SectionLabel><GlassCard style={{marginTop:8}}><div style={{fontSize:16,fontWeight:900}}>1980 <span style={{fontSize:11,color:'var(--text-4)',fontWeight:700}}>/ 2400</span></div><div style={{fontSize:11,color:'var(--text-3)',marginTop:4}}>Calorias</div></GlassCard></div>
  </div>
</div>; }
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script></body></html>
