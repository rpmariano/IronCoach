<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;background:var(--bg-app);font-family:var(--font-sans);color:var(--text-1);-webkit-font-smoothing:antialiased;padding:16px 18px;box-sizing:border-box;height:150px;overflow:hidden}*{box-sizing:border-box}</style></head><body><div style="display:flex;gap:10px"><div style="flex:1"><div style="height:56px;border-radius:12px;background:var(--grad-race);display:flex;align-items:flex-end;padding:8px;font-size:11px;font-weight:800;color:var(--race-ink)">Prova / FAB</div><div style="font-family:var(--font-mono);font-size:10.5px;color:var(--text-muted);margin-top:6px">--grad-race</div></div><div style="flex:1"><div style="height:56px;border-radius:12px;background:var(--grad-coach);display:flex;align-items:flex-end;padding:8px;font-size:11px;font-weight:800;color:var(--coach-ink)">Carol</div><div style="font-family:var(--font-mono);font-size:10.5px;color:var(--text-muted);margin-top:6px">--grad-coach</div></div><div style="flex:1"><div style="height:56px;border-radius:12px;background:var(--grad-brand);display:flex;align-items:flex-end;padding:8px;font-size:11px;font-weight:800;color:var(--brand-cream)">Logo</div><div style="font-family:var(--font-mono);font-size:10.5px;color:var(--text-muted);margin-top:6px">--grad-brand</div></div><div style="flex:1"><div style="height:56px;border-radius:12px;background:var(--grad-nav-pill);display:flex;align-items:flex-end;padding:8px;font-size:11px;font-weight:800;color:#04252b">Pílula da nav</div><div style="font-family:var(--font-mono);font-size:10.5px;color:var(--text-muted);margin-top:6px">--grad-nav-pill</div></div><div style="flex:1.4"><div style="height:56px;border-radius:12px;background:var(--bg-app);position:relative;overflow:hidden"><div style="position:absolute;inset:0;background:var(--grad-ambient)"></div></div><div style="font-family:var(--font-mono);font-size:10.5px;color:var(--text-muted);margin-top:6px">--grad-ambient</div></div></div></body></html>
