 style="height:56px;border-radius:12px;background:var(--nutrition);display:flex;align-items:flex-end;padding:8px;font-size:11px;font-weight:800;color:#22103a">Nutrição</div><div style="font-family:var(--font-mono);font-size:10.5px;color:var(--text-muted);margin-top:6px">--nutrition</div><div style="font-size:11px;color:var(--text-4);margin-top:2px">módulo</div></div><div style="flex:1;min-width:0"><div style="height:56px;border-radius:12px;background:var(--body);display:flex;align-items:flex-end;padding:8px;font-size:11px;font-weight:800;color:#3a0a22">Corpo</div><div style="font-family:var(--font-mono);font-size:10.5px;color:var(--text-muted);margin-top:6px">--body</div><div style="font-size:11px;color:var(--text-4);margin-top:2px">módulo</div></div><div style="flex:1;min-width:0"><div style="height:56px;border-radius:12px;background:var(--ok);display:flex;align-items:flex-end;padding:8px;font-size:11px;font-weight:800;color:#052e22">OK</div><div style="font-family:var(--font-mono);font-size:10.5px;color:var(--text-muted);margin-top:6px">--ok</div><div style="font-size:11px;color:var(--text-4);margin-top:2px">dentro do alvo</div></div><div style="flex:1;min-width:0"><div style="height:56px;border-radius:12px;background:var(--warn);display:flex;align-items:flex-end;padding:8px;font-size:11px;font-weight:800;color:#2a1006">Aviso</div><div style="font-family:var(--font-mono);font-size:10.5px;color:var(--text-muted);margin-top:6px">--warn</div><div style="font-size:11px;color:var(--text-4);margin-top:2px">nunca âmbar</div></div></div></body></html>
